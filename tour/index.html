      panel.querySelector('#hs-defect').addEventListener('change', e => {
        h.defect = e.target.value;
        /* switching Spall -> Crack must not leave a depth behind in the register */
        if (DEFECT_MEASURE[h.defect] !== 'depth') { delete h.depthIn; delete h.rebar; }
        if (DEFECT_MEASURE[h.defect] !== 'width') delete h.widthIn;
        drawMeasure(); scheduleSave(); refreshMarkers();
      });
      panel.querySelector('#hs-note').addEventListener('input', e => { h.note = e.target.value; scheduleSave(); });
      wireFileRow(panel.querySelector('#hs-image-line'), h, 'image', 'image/jpeg,image/png,image/webp', 'close-up photo');
    } else {
      panel.querySelector('#hs-title').addEventListener('input', e => { h.title = e.target.value; scheduleSave(); refreshMarkers(); });
      panel.querySelector('#hs-text').addEventListener('input', e => { h.text = e.target.value; scheduleSave(); });
      wireFileRow(panel.querySelector('#hs-image-line'), h, 'image', 'image/jpeg,image/png,image/webp', 'image');
      wireFileRow(panel.querySelector('#hs-audio-line'), h, 'audio', 'audio/mpeg,audio/mp4,audio/ogg', 'audio clip');
    }
    wireFileRow(panel.querySelector('#hs-icon-line'), h, 'icon', 'image/png,image/jpeg,image/webp', 'custom icon');
    panel.querySelector('input, select, textarea, button')?.focus();
    panel.querySelector('#hs-move').addEventListener('click', () => setPlacing({ move: h.id }));
    const hsDelete = panel.querySelector('#hs-delete');
    let hsDelTimer = null;
    hsDelete.addEventListener('click', () => {
      if (!hsDelete.classList.contains('danger-solid')) {
        hsDelete.classList.replace('danger-text', 'danger-solid');
        hsDelete.textContent = 'Confirm?';
        hsDelTimer = setTimeout(() => {
          if (!hsDelete.isConnected) return;
          hsDelete.classList.replace('danger-solid', 'danger-text');
          hsDelete.textContent = 'Delete';
        }, 4000);
        return;
      }
      clearTimeout(hsDelTimer);
      s.hotspots = s.hotspots.filter(x => x.id !== h.id);
      scheduleSave();
      refreshMarkers();
      closeHotspotPanel({ restore: true });
    });
    panel.querySelector('#hs-done').addEventListener('click', () => closeHotspotPanel({ restore: true }));
  }

  function wireFileRow(line, obj, key, accept, label = key) {
    if (!line) return;
    const render = () => {
      line.innerHTML = '';
      if (obj[key]) {
        const clear = el(`<button class="icon-btn" title="Remove ${esc(label)}" aria-label="Remove ${esc(label)}">&times;</button>`);
        clear.addEventListener('click', () => { obj[key] = null; scheduleSave(); refreshMarkers(); render(); });
        line.append(el(`<span style="font-size:12px;color:var(--ink-2)">set</span>`), clear);
      } else {
        const btn = el(`<button class="btn" style="padding:3px 10px;font-size:12px" aria-label="Upload ${esc(label)}">Upload</button>`);
        const input = el(`<input type="file" accept="${accept}" hidden>`);
        btn.addEventListener('click', () => input.click());
        input.addEventListener('change', async () => {
          if (!input.files[0]) return;
          try {
            obj[key] = await uploadFile(doc.id, input.files[0]);
            scheduleSave(); refreshMarkers(); render();
          } catch (err) { toast(uploadProblem(input.files[0].name, err), true); }
        });
        line.append(btn, input);
      }
    };
    render();
  }

  document.getElementById('sort-shot').addEventListener('click', () => {
    const timed = doc.scenes.filter(s => s.shot).length;
    /* Array#sort is stable, so photos with no timestamp keep their order
       relative to each other and sink to the end rather than leading the walk. */
    doc.scenes = [...doc.scenes].sort((a, b) =>
      (a.shot ? 0 : 1) - (b.shot ? 0 : 1) || String(a.shot).localeCompare(String(b.shot)));
    scheduleSave();
    renderSceneList();
    toast(`${timed} photo${timed > 1 ? 's' : ''} put back in capture order`);
  });

  /* ----- boot ----- */
  syncSortButton();
  renderSceneList();
  renderMain();
  renderSceneShape();
  renderCoverage();
  renderPreflight();
  updateHint();
}
</script>
</body>
</html>
