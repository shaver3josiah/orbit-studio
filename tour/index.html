  }

  /* ----- scene list ----- */
  function renderSceneList() {
    /* both are derived from the scenes, so they are refreshed wherever the
       scenes are — one call here beats one at each of add / delete / undo / redo */
    renderCoverage();
    refreshRegisterNote();
    renderPreflight();
    renderPlan();
    syncSortButton();
    const list = document.getElementById('scene-list');
    list.innerHTML = '';
    if (!doc.scenes.length) {
      list.append(el(`<div class="state-note" style="padding:8px 0">No scenes yet.</div>`));
      return;
    }
    /* a scene nothing links to is unreachable in the finished tour unless it is
       the one visitors start on — worth a mark rather than a silent dead end */
    const stranded = new Set(strandedScenes(doc));
    /* ----- grouping -----
       A flat rail is right for an apartment and a scroll for a bridge. Grouped
       by the photo stop each scene is already tagged with, so this is a pure
       derivation and there is no second field to keep in step. Native
       <details>, so open/closed, keyboard and screen reader all come free.
       Only past eight scenes, and only once something is tagged: below that the
       grouping is more chrome than the list it organises. Order within a group
       still follows doc.scenes, so the up/down buttons keep meaning what they
       have always meant. */
    const grouped = doc.scenes.length >= 8 && doc.scenes.some(s => s.stop);
    /* renderSceneList runs on fifteen different actions, and every one rebuilt
       these from scratch. Collapsing "Deck" then clicking a scene in
       "Underside" reopened it — the grouping's one interaction undone by its
       most adjacent action. */
    for (const d of list.querySelectorAll('details.sgroup')) {
      if (!d.open) collapsedStops.add(d.dataset.stop || '');
      else collapsedStops.delete(d.dataset.stop || '');
    }
    const groups = new Map();
    if (grouped) {
      const used = [...NBIS_STOPS.filter(stop => doc.scenes.some(s => s.stop === stop))];
      /* A hand-edited or older tour.json can carry a stop that is not on the
         list. Without this it belonged to no group and rendered bare after all
         of them, under no heading at all. */
      for (const s of doc.scenes) {
        if (s.stop && !NBIS_STOPS.includes(s.stop) && !used.includes(s.stop)) used.push(s.stop);
      }
      if (doc.scenes.some(s => !s.stop)) used.push('');
      for (const stop of used) {
        const n = doc.scenes.filter(s => (s.stop || '') === stop).length;
        const box = el(`<details class="sgroup" data-stop="${esc(stop)}"${collapsedStops.has(stop) ? '' : ' open'}>
          <summary>${esc(stop || 'Not assigned')}<span class="sg-n num">${n}</span></summary>
          <div class="sg-body"></div></details>`);
        box.addEventListener('toggle', () => {
          if (box.open) collapsedStops.delete(stop); else collapsedStops.add(stop);
        });
        groups.set(stop, box.querySelector('.sg-body'));
        list.append(box);
      }
    }
    const hostFor = s => (grouped ? groups.get(s.stop || '') || list : list);

    doc.scenes.forEach((s, i) => {
      const isStart = doc.settings.startScene === s.id;
      const orphan = doc.scenes.length > 1 && stranded.has(s.id);
      const row = el(`
        <div class="scene-row${s.id === curSceneId ? ' active' : ''}">
          <button class="scene-pick" data-a="pick" aria-current="${s.id === curSceneId}"
                  aria-label="Edit scene ${esc(s.name)}${orphan ? ' — nothing links to it' : ''}">
            <img src="${fileUrl(doc.id, s.thumb || s.file)}" alt="">
            <span class="sn" title="Double-click to rename">${esc(s.name)}</span>
            ${orphan ? '<span class="orphan" title="Nothing links to this scene yet"></span>' : ''}
          </button>
          <button class="start-btn${isStart ? ' on' : ''}" data-a="start" aria-pressed="${isStart}"
            title="${isStart ? 'This is the start scene' : 'Make start scene'}"
            aria-label="${isStart ? `${esc(s.name)} is the start scene` : `Make ${esc(s.name)} the start scene`}">START</button>
          <button class="icon-btn" data-a="up" title="Move up" aria-label="Move ${esc(s.name)} up">&uarr;</button>
          <button class="icon-btn" data-a="down" title="Move down" aria-label="Move ${esc(s.name)} down">&darr;</button>
          <button class="icon-btn" data-a="dup" title="Duplicate scene" aria-label="Duplicate ${esc(s.name)}">&plus;</button>
          <button class="icon-btn" data-a="del" title="Delete scene" aria-label="Delete ${esc(s.name)}">&times;</button>
        </div>`);
      row.querySelector('[data-a=pick]').addEventListener('click', () => selectScene(s.id));
      row.querySelector('[data-a=dup]').addEventListener('click', () => duplicateScene(s.id));
      row.querySelector('[data-a=start]').addEventListener('click', () => {
        if (doc.settings.startScene === s.id) return;
        doc.settings.startScene = s.id;
        scheduleSave();
        renderSceneList();
      });
      const nameSpan = row.querySelector('.sn');
      nameSpan.addEventListener('dblclick', () => {
        const input = el(`<input class="sn-input" value="${esc(s.name)}" maxlength="80" aria-label="Rename scene">`);
        nameSpan.replaceWith(input);
        input.focus();
        input.select();
        let settled = false;
        const commit = () => {
          if (settled) return;
          settled = true;
          s.name = input.value.trim() || s.name;
          scheduleSave();
          closeHotspotPanel(); /* an open link panel would show the stale name */
          renderSceneList();
          refreshMarkers();
        };
        input.addEventListener('blur', commit);
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter') { e.preventDefault(); commit(); }
          if (e.key === 'Escape') { settled = true; renderSceneList(); }
        });
      });
      const up = row.querySelector('[data-a=up]');
      const down = row.querySelector('[data-a=down]');
      up.disabled = i === 0;
      down.disabled = i === doc.scenes.length - 1;
      up.addEventListener('click', () => moveScene(i, -1));
      down.addEventListener('click', () => moveScene(i, 1));

      /* arm state lives on the button itself, so arming one row never
         leaves another row falsely armed */
      const delBtn = row.querySelector('[data-a=del]');
      let delTimer = null;
      delBtn.addEventListener('click', () => {
        if (!delBtn.classList.contains('armed')) {
          delBtn.classList.add('armed');
          delBtn.textContent = 'Confirm?';
          delBtn.setAttribute('aria-label', `Confirm deleting ${s.name}`);
          delTimer = setTimeout(() => {
            if (!delBtn.isConnected) return;
            delBtn.classList.remove('armed');
            delBtn.innerHTML = '&times;';
            delBtn.setAttribute('aria-label', `Delete ${s.name}`);
          }, 4000);
          return;
        }
        clearTimeout(delTimer);
        deleteScene(s.id);
      });
      hostFor(s).append(row);
    });
    if (armedTarget()) renderBuildChips(); /* same list, second view of it */
    /* the red dot is easy to miss, and half a disconnected tour is worth saying
       out loud rather than leaving to be discovered by walking it */
    const line = document.getElementById('reach-notice');
    if (line) {
      const n = stranded.size;
      line.textContent = n && doc.scenes.length > 1
        ? `${n} scene${n === 1 ? '' : 's'} nothing links to — a visitor could never reach ${n === 1 ? 'it' : 'them'}.`
        : '';
    }
  }

  function duplicateScene(sid) {
    const i = doc.scenes.findIndex(s => s.id === sid);
    if (i < 0) return;
    const src = doc.scenes[i];
    /* same media files, fresh ids — hotspot ids must not collide */
    const copy = JSON.parse(JSON.stringify(src));
    copy.id = newId('s');
    copy.name = `${src.name} copy`;
    /* A defect code is the register's primary key. Cloning it would put two
       different defects — separately movable, retypable and remeasurable —
       under one number in the CSV, the print log and manifest.json. Each copied
       defect takes the next free code. Spliced in first so nextDefectCode()
       already counts the copy it is numbering. */
    copy.hotspots = (copy.hotspots || []).map(h => ({ ...h, id: newId('h') }));
    doc.scenes.splice(i + 1, 0, copy);
    for (const h of copy.hotspots) {
      if (h.type === 'defect') h.code = nextDefectCode(doc.scenes);
    }
    scheduleSave();
    renderSceneList();
    toast(`Duplicated "${src.name}"`);
  }

  function moveScene(i, delta) {
    const j = i + delta;
    if (j < 0 || j >= doc.scenes.length) return;
    [doc.scenes[i], doc.scenes[j]] = [doc.scenes[j], doc.scenes[i]];
    scheduleSave();
    renderSceneList();
  }

  function deleteScene(sid) {
    closeHotspotPanel();
    setPlacing(null);
    doc.scenes = doc.scenes.filter(s => s.id !== sid);
    for (const s of doc.scenes) {
      s.hotspots = (s.hotspots || []).filter(h => h.type !== 'link' || h.target !== sid);
    }
    if (doc.settings.startScene === sid) doc.settings.startScene = doc.scenes[0]?.id;
    if (curSceneId === sid) curSceneId = doc.scenes[0]?.id || null;
    scheduleSave();
    renderSceneList();
    renderMain();
    renderSceneShape();
    syncBuildMode();
  }

  async function selectScene(sid) {
    if (sid === curSceneId) return;
    curSceneId = sid;
    /* on a tablet the scene list IS the drawer, so picking a scene has to get
       out of the way — otherwise you pick a panorama and keep staring at a list */
    setDrawer(false);
    /* replaceState, never pushState: the editor runs inside a same-origin frame
       during Start tour, and pushing there writes into the PARENT's history, so
       Back would walk scenes instead of leaving. It also keeps one Back press
       meaning "leave the editor" rather than "undo forty scene changes". */
    history.replaceState(null, '', `?edit=${encodeURIComponent(doc.id)}#s=${encodeURIComponent(sid)}`);
    /* build mode survives the move — walking scene to scene laying arrows is
       the whole point — but its armed target cannot be the scene we just
       opened, so re-aim it at something reachable */
    if (armedTarget()) {
      const armed = armedTarget() === sid ? otherScenes()[0]?.id : armedTarget();
      setPlacing(armed ? { link: armed } : null);
    } else {
      setPlacing(null);
    }
    closeHotspotPanel();
    renderSceneList();
    renderSceneShape();
    syncBuildMode();
    await showCurrentScene();
  }

  /* ----- settings panel -----
     always reach through doc.settings: undo swaps the whole object, so a
     captured reference would write into a detached copy */
  const autorotateCb = document.getElementById('set-autorotate');
  const speedInput = document.getElementById('set-speed');
  const planetCb = document.getElementById('set-planet');
  const logoLinkInput = document.getElementById('set-logolink');
  function syncSettingsInputs() {
    const st = doc.settings;
    autorotateCb.checked = st.autorotate === true;
    speedInput.value = st.autorotateSpeed || 0.7;
    planetCb.checked = st.littlePlanetIntro !== false;
    logoLinkInput.value = st.logoLink || '';
    nameInput.value = doc.name;
    renderFileSetting('logo-line', 'logo', 'image/png,image/jpeg,image/webp', 'logo');
    renderFileSetting('audio-line', 'audio', 'audio/mpeg,audio/mp4,audio/ogg', 'background audio');
  }
  syncSettingsInputs();
  autorotateCb.addEventListener('change', () => { doc.settings.autorotate = autorotateCb.checked; scheduleSave(); });
  speedInput.addEventListener('change', () => {
    doc.settings.autorotateSpeed = Math.min(3, Math.max(0.1, Number(speedInput.value) || 0.7));
    speedInput.value = doc.settings.autorotateSpeed;
    scheduleSave();
  });
  planetCb.addEventListener('change', () => { doc.settings.littlePlanetIntro = planetCb.checked; scheduleSave(); });
  logoLinkInput.addEventListener('change', () => { doc.settings.logoLink = logoLinkInput.value.trim(); scheduleSave(); });

  function renderFileSetting(lineId, key, accept, label) {
    const line = document.getElementById(lineId);
    line.innerHTML = '';
    if (doc.settings[key]) {
      const clear = el(`<button class="icon-btn" title="Remove ${esc(label)}" aria-label="Remove ${esc(label)}">&times;</button>`);
      clear.addEventListener('click', () => { doc.settings[key] = null; scheduleSave(); renderFileSetting(lineId, key, accept, label); });
      line.append(el(`<span style="font-size:12px;color:var(--ink-2)">set</span>`), clear);
    } else {
      const btn = el(`<button class="btn" style="padding:4px 10px;font-size:12px" aria-label="Upload ${esc(label)}">Upload</button>`);
      const input = el(`<input type="file" accept="${accept}" hidden>`);
      btn.addEventListener('click', () => input.click());
      input.addEventListener('change', async () => {
        if (!input.files[0]) return;
        try {
          doc.settings[key] = await uploadFile(doc.id, input.files[0]);
          scheduleSave();
          renderFileSetting(lineId, key, accept, label);
        } catch (err) { toast(uploadProblem(input.files[0].name, err), true); }
      });
      line.append(btn, input);
    }
  }

  /* ----- main pane: PSV editor viewer ----- */
  function renderMain() {
    const pane = document.getElementById('main-pane');
    if (!doc.scenes.length) {
      editorViewer?.destroy(); editorViewer = null; markers = null;
      setPlacing(null); /* the build bar goes with the toolbar we are about to drop */
      pane.innerHTML = `<div class="editor-empty">
        <h2>Drop the walk in</h2>
        <p>Every photo becomes a scene, whatever its shape — a 360&deg; export, a phone
          panorama, or an ordinary picture. Each one works out how much of the sphere
          it covers, and two or more get connected to each other automatically.</p>
        <p class="ee-lead">One walk covers the whole structure, in this order:</p>
        <ol class="ee-phases">${CAPTURE_PHASES.map(([name, what]) =>
          `<li><span class="ee-name">${esc(name)}</span><span class="ee-what">${esc(what)}</span></li>`).join('')}</ol>
        <div class="ee-actions">
          <button class="btn primary" id="pick-photos">Choose photos</button>
          <button class="btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled>Undo</button>
        </div>
      </div>`;
      /* the drop zone lives in the sidebar, which on a tablet is a closed
         drawer — so the empty state needs its own way to the file picker */
      document.getElementById('pick-photos').addEventListener('click', () => fileInput.click());
      // deleting the last scene removes the toolbar — the moment undo is needed most
      document.getElementById('undo-btn').addEventListener('click', undo);
      updateUndoButton();
      return;
    }
    if (!editorViewer) {
      pane.innerHTML = `
        <div class="toolbar">
          <button class="btn" id="add-link" title="Place a link hotspot (L)">+ Link</button>
          <button class="btn" id="add-info" title="Place an info hotspot (I)">+ Info</button>
          <button class="btn" id="add-url" title="Place a URL hotspot (U)">+ URL</button>
          <button class="btn defect" id="add-defect" title="Record a defect at a point in this photo (D)">+ Defect</button>
          <button class="btn" id="build-links" aria-pressed="false"
                  title="Pick where each link goes first, then click doorway after doorway">Build links</button>
          <button class="btn" id="set-view">Set start view from here</button>
          <button class="btn" id="undo-btn" title="Undo (Ctrl+Z)" disabled>Undo</button>
          <button class="btn" id="redo-btn" title="Redo (Ctrl+Shift+Z)" disabled>Redo</button>
          <button class="btn" id="open-map" title="Open the map full size (M)">Map</button>
          <button class="btn primary" id="start-tour" title="Walk your own tour (T)">Start tour</button>
          <button class="btn" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts">?</button>
          <span class="hint" id="hint"></span>
        </div>
        <div class="build-bar" id="build-bar">
          <span class="bb-label">Walk to</span>
          <div class="bb-chips" id="bb-chips"></div>
          <label class="bb-return"><input type="checkbox" id="bb-return" checked> Add the way back too</label>
        </div>
        <div id="edit-psv"></div>`;
      document.getElementById('build-links').addEventListener('click', toggleBuildMode);
      document.getElementById('bb-return').addEventListener('change', e => { buildReturn = e.target.checked; });
      document.getElementById('add-link').addEventListener('click', () => startPlacing('link'));
      document.getElementById('add-info').addEventListener('click', () => startPlacing('info'));
      document.getElementById('add-url').addEventListener('click', () => startPlacing('url'));
      document.getElementById('add-defect').addEventListener('click', () => startPlacing('defect'));
      document.getElementById('open-map').addEventListener('click', () => toggleMap());
      document.getElementById('start-tour').addEventListener('click', startTour);
      document.getElementById('undo-btn').addEventListener('click', undo);
      document.getElementById('redo-btn').addEventListener('click', redo);
      document.getElementById('help-btn').addEventListener('click', showHelpSheet);
      updateUndoButton();
      document.getElementById('set-view').addEventListener('click', () => {
        const s = curScene();
        if (!s) return;
        const p = editorViewer.getPosition();
        s.view = { yaw: +(p.yaw / DEG).toFixed(2), pitch: +(p.pitch / DEG).toFixed(2), zoom: Math.round(editorViewer.getZoomLevel()) };
        delete s.viewFrom; /* a person chose it, so stop calling it a guess */
        toast('Start view saved for this scene');
        scheduleSave();
        renderSceneShape();
      });
      editorViewer = new Viewer({
        container: document.getElementById('edit-psv'),
        panorama: fileUrl(doc.id, curScene().file),
        panoData: panoDataFor(curScene()),
        canvasBackground: sceneBackground(curScene()),
        loadingTxt: 'Loading scene…',
        navbar: ['zoom', 'move', 'fullscreen'],
        keyboard: 'always',
        plugins: [MarkersPlugin],
      });
      markers = editorViewer.getPlugin(MarkersPlugin);
      wireMarkerDrag();
      /* placing and dragging both own the mark's position for as long as they
         last, so the declutter stands down rather than pulling against them */
      wireDeclutter(editorViewer, markers, () => !!dragging || !!placing);
      editorViewer.addEventListener('panorama-error', () => {
        toast(`Could not load the photo for "${curScene()?.name || 'this scene'}"`, true);
      });
      editorViewer.addEventListener('click', ({ data }) => {
        if (!placing || data.rightclick) return;
        onPlace(+(data.yaw / DEG).toFixed(2), +(data.pitch / DEG).toFixed(2));
      });
      markers.addEventListener('select-marker', ({ marker }) => {
        if (placing) return;
        openHotspotPanel(marker.id);
      });
      editorViewer.addEventListener('ready', refreshMarkers, { once: true });
      // debug handle: openHotspot lets tests reach the panel without pointer hit-testing
      window.orbitEditor = {
        viewer: editorViewer, doc: () => doc, openHotspot: openHotspotPanel,
        place: onPlace, buildMode: toggleBuildMode, autoLink, addFiles: addScenes,
      };
      syncBuildMode();
    } else {
      if (!curScene()) curSceneId = doc.scenes[0].id;
      showCurrentScene();
    }
  }

  async function showCurrentScene() {
    const s = curScene();
    if (!s || !editorViewer) { renderMain(); return; }
    editorViewer.setOption('canvasBackground', sceneBackground(s));
    await editorViewer.setPanorama(fileUrl(doc.id, s.file), {
      transition: false,
      showLoader: true,
      panoData: panoDataFor(s),
    });
    refreshMarkers();
  }

  /* Re-show the current scene without a network round trip, for the coverage
     sliders: same file, new panoData, so PSV rebuilds the sphere geometry. */
  let reshapeTimer = null;
  function reshapeCurrentScene() {
    clearTimeout(reshapeTimer);
    reshapeTimer = setTimeout(() => { showCurrentScene(); }, 120);
  }

  function refreshMarkers() {
    if (!markers) return;
    const s = curScene();
    if (!s) return;
    markers.setMarkers((s.hotspots || []).map(h => {
      const px = hotspotSize(h);
      return {
        id: h.id,
        position: { yaw: (h.yaw || 0) * DEG, pitch: (h.pitch || 0) * DEG },
        /* a link left as the floor arrow still needs something to grab here,
           so the editor draws it as a badge even though the viewer will not */
        image: h.icon ? fileUrl(doc.id, h.icon) : (hotspotIcon(h) || hotspotIcon(h, 'circle')),
        size: { width: px, height: px },
        opacity: h.icon ? hotspotOpacity(h) : 1, /* a drawn shape is already faded */
        tooltip: esc(h.type === 'link'
          ? (h.label || doc.scenes.find(x => x.id === h.target)?.name || 'Not connected yet — click to choose a scene')
          : h.type === 'url' ? (h.label || h.url || 'Link')
          : h.type === 'defect' ? [h.code, h.defect, defectMeasure(h)].filter(Boolean).join(' · ')
          : (h.title || 'Info')),
      };
    }));
  }

  /* ----- hotspot placement + editing ----- */
  /* ----- the hotspot rides the cursor until you drop it -----
     Choosing what a hotspot connects to before deciding where it goes is
     backwards: you are looking at the doorway, not at a list of rooms. So
     placement comes first — the hotspot follows the pointer, you drop it where
     it belongs, and the panel then asks what it leads to. Build mode is the
     other way round on purpose, for laying out a whole floor at speed. */

  let ghost = null;
  /* an uploaded icon wins here as it does everywhere else, or Move would show
     a generic badge riding the cursor for a hotspot that does not look like one */
  const ghostIcon = h => (h.icon ? fileUrl(doc.id, h.icon)
    : hotspotShape(h) === 'arrow' ? ARROW_PREVIEW
      : hotspotIcon(h));

  function placingPreview(next) {
    if (typeof next === 'string') return { type: next, ...(lastStyle || {}) };
    if (typeof next === 'object' && next?.link) return { type: 'link', ...(lastStyle || {}) };
    if (next?.move) return curScene()?.hotspots?.find(x => x.id === next.move) || null;
    return null;
  }

  function setPlacing(next) {
    placing = next;
    ghost?.remove();
    ghost = null;
    const preview = placingPreview(next);
    if (preview) {
      const px = hotspotSize(preview);
      ghost = el(`<img class="place-ghost" alt="" src="${ghostIcon(preview)}"
        style="width:${px}px;height:${px}px;visibility:hidden">`);
      document.body.append(ghost);
    }
    /* the build bar reads straight off this state, so it has to be refreshed
       from the same choke point — otherwise reaching for "+ Info hotspot" with
       build mode armed leaves the bar open and a chip still claiming to be
       armed when nothing is */
    syncBuildMode();
  }

  function startPlacing(type) {
    closeHotspotPanel();
    setPlacing(type);
  }

  /* ----- walk the tour without leaving the editor -----
     Preview opens a tab, which is right for showing someone else. Testing your
     own links wants the opposite: stay put, click through, come back. The real
     viewer runs in a frame over the editor rather than a second copy of the
     viewer code, so what you walk is exactly what a visitor gets. */
  const closeTryout = () => document.querySelector('.tryout')?.remove();

  /* ----- the map, big -----
     The plan plate in the sidebar is where a tour gets stitched together, and
     at sidebar width it is a postage stamp. This lifts the SAME element into
     an overlay over the panorama — same DOM node, so renderPlan(), the drag
     handlers and Undo all keep working — and hands it back to the sidebar on
     close. renderPlan() re-runs after each move because the declutter pass
     spaces crowded dots in pixels, and the right spacing at 288px is not the
     right spacing at 900px. */
  const mapOpen = () => document.querySelector('.map-view');
  function toggleMap(want = !mapOpen()) {
    const plan = document.getElementById('plan-section');
    if (!plan) return;
    if (!want) {
      const ov = mapOpen();
      if (!ov) return;
      document.getElementById('link-summary').after(plan);
      ov.remove();
      renderPlan();
      document.getElementById('open-map')?.focus();
      return;
    }
    if (mapOpen()) return;
    const ov = el(`<div class="map-view" role="region" aria-label="Map">
      <header class="map-head">
        <h2>Map</h2>
        <ul class="map-legend">
          <li><span class="lg" aria-hidden="true"></span>GPS fix</li>
          <li><span class="lg lg-guess" aria-hidden="true"></span>guessed — drag it home</li>
          <li><span class="lg lg-manual" aria-hidden="true"></span>placed by hand</li>
          <li><span class="lg lg-on" aria-hidden="true"></span>the photo you are editing</li>
          <li><span class="lg lg-stray" aria-hidden="true"></span>not in the walk yet</li>
          <li><span class="lg lg-aim" aria-hidden="true"></span>which way it looks — drag to turn</li>
        </ul>
        <label class="map-opt">Labels
          <select aria-label="What each photo is labelled with">
            <option value="name">Name</option>
            <option value="stop">Photo stop</option>
            <option value="station">Station</option>
            <option value="none">None</option>
          </select>
        </label>
        <label class="map-opt" title="Dragging a photo onto another will not link them">
          <input type="checkbox" id="map-moveonly"> Move only
        </label>
        <label class="map-zoom" title="Pinch on a trackpad, or Ctrl+scroll, to zoom about the pointer">Zoom
          <input type="range" min="1" max="4" step="0.25" value="1" aria-label="Zoom the map">
        </label>
        <button class="btn map-close" title="Back to editing (Esc)">Back to editing</button>
      </header>
      <div class="map-scroll"><div class="map-sheet"></div></div>
    </div>`);
    ov.querySelector('.map-sheet').append(plan);
    plan.open = true;
    /* ----- zooming -----
       The plate is percentages all the way down, so zooming is one custom
       property and the scroll box handles the rest — no re-render, no
       re-layout of anything on it.

       Zoom about a POINT, though, or it is not zooming, it is resizing. The
       thing under the cursor has to still be under the cursor afterwards;
       without that the plate slides out from under the gesture and a pinch
       feels like somebody wired a trackpad to a slider. Worked in client
       coordinates against the plate itself rather than in scroll offsets,
       because .map-scroll centres its child until it overflows and then stops
       centring — so the child's position inside the scrolled content is not a
       constant there is any arithmetic to do with. Measure, apply, measure,
       correct. */
    const scroll = ov.querySelector('.map-scroll');
    const zoomInput = ov.querySelector('.map-zoom input');
    let mapZoom = 1;
    const setZoom = (want, ax, ay) => {
      const z = clamp(want, +zoomInput.min, +zoomInput.max);
      if (z === mapZoom) return;
      const plate = document.getElementById('plan-box');
      if (!plate) return;
      const was = plate.getBoundingClientRect();
      /* where the anchor sits on the plate, as a fraction of it — the one
         thing that must not change */
      const fx = was.width ? (ax - was.left) / was.width : 0.5;
      const fy = was.height ? (ay - was.top) / was.height : 0.5;
      mapZoom = z;
      ov.style.setProperty('--map-zoom', String(z));
      zoomInput.value = String(z); /* the slider is the readout as well as the control */
      const now = plate.getBoundingClientRect();
      scroll.scrollLeft += now.left - (ax - fx * now.width);
      scroll.scrollTop += now.top - (ay - fy * now.height);
    };
    /* dragging the slider has no pointer to zoom about, so it holds the middle
       of what you are looking at still, which is the next best anchor */
    zoomInput.addEventListener('input', e => {
      const r = scroll.getBoundingClientRect();
      setZoom(+e.target.value, r.left + r.width / 2, r.top + r.height / 2);
    });
    /* A trackpad pinch arrives as a wheel event with ctrlKey set: the browser
       synthesises it, and it is the same event Ctrl+wheel sends, so one handler
       is both gestures and neither had to be invented. Everything else stays
       the browser's — two fingers with no modifier is an ordinary scroll and
       .map-scroll pans on it for free, which is what every canvas does and what
       nobody has to be taught.

       passive:false because the default action here is zooming the whole PAGE,
       which is never what somebody pinching a map meant. Only over the plate,
       so a pinch on the header is still the browser's.

       ponytail: no touch-pinch handler. On a touchscreen the browser's own
       two-finger zoom already works and is the affordance people expect;
       intercepting it to reimplement it worse is the trade nobody wins. */
    scroll.addEventListener('wheel', e => {
      if (!e.ctrlKey && !e.metaKey) return;
      e.preventDefault();
      /* multiplicative, so a pinch covers the same visual distance per finger
         travel at 1x as at 4x. 0.012 puts one mouse-wheel notch near 12%. */
      setZoom(mapZoom * Math.exp(-e.deltaY * 0.012), e.clientX, e.clientY);
    }, { passive: false });
    /* The select opens showing what is actually on the plate, including the
       choice the crowd made for you — otherwise it reads "Name" over a plate
       with no names on it, and the first thing you do is prove it wrong. */
    const labelSel = ov.querySelector('.map-opt select');
    labelSel.value = planLabels ?? (doc.scenes.length > PLAN_LABEL_MAX ? 'none' : 'name');
    labelSel.addEventListener('change', e => { planLabels = e.target.value; renderPlan(); });
    ov.querySelector('#map-moveonly').addEventListener('change', e => {
      planMoveOnly = e.target.checked;
      renderPlan(); /* the dots' own aria-label says which of the two a drag will do */
    });
    ov.querySelector('.map-close').addEventListener('click', () => toggleMap(false));
    document.getElementById('main-pane').append(ov);
    renderPlan();
    ov.querySelector('.map-close').focus();
  }

  async function startTour() {
    while (saveInFlight) await new Promise(r => setTimeout(r, 120));
    if (dirty || saveTimer) {
      if (!await saveNow()) toast('Could not save — you are walking the last saved version', true);
    }
    closeTryout();
    toggleMap(false);
    setPlacing(null);
    closeHotspotPanel();
    const box = el(`<div class="tryout">
      <iframe src="/tour/view/${esc(doc.id)}" title="Walking through ${esc(doc.name)}"
        allow="gyroscope; accelerometer; fullscreen; xr-spatial-tracking"></iframe>
      <button class="btn tryout-close">Back to editing</button>
    </div>`);
    box.querySelector('.tryout-close').addEventListener('click', closeTryout);
    /* Once you click into the tour, its own document swallows the keystrokes
       and the editor's Escape never fires. Same origin, so we can listen from
       in there too and keep Escape meaning the same thing everywhere. */
    box.querySelector('iframe').addEventListener('load', e => {
      try {
        e.target.contentDocument.addEventListener('keydown', k => {
          if (k.key === 'Escape') closeTryout();
        });
      } catch { /* the button is always there if this is ever blocked */ }
    });
    document.getElementById('main-pane').append(box);
  }
  function updateHint() {
    const hint = document.getElementById('hint');
    if (!hint) return;
    if (armedTarget()) {
      const name = doc.scenes.find(s => s.id === armedTarget())?.name || 'that scene';
      hint.className = 'hint placing';
      hint.textContent = `Click where the way to "${name}" is (Esc stops)`;
    } else if (typeof placing === 'string') {
      hint.className = 'hint placing';
      hint.textContent = 'Click the panorama to place the hotspot (Esc cancels)';
    } else if (placing?.move) {
      hint.className = 'hint placing';
      hint.textContent = 'Click the new position (Esc cancels)';
    } else {
      hint.className = 'hint';
      hint.textContent = 'Click a hotspot to edit it';
    }
  }
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    /* A <dialog> closes itself on Escape, and the keydown still bubbles here.
       Without this, closing the help sheet would ALSO drop you out of build
       mode and silently discard the armed target. */
    if (modalOpen()) return;
    if (drawerOpen()) { setDrawer(false); return; }
    if (document.querySelector('.tryout')) { closeTryout(); return; }
    if (mapOpen()) { toggleMap(false); return; }
    if (armedTarget()) exitBuildMode();
    else if (placing) setPlacing(null);
    else closeHotspotPanel({ restore: true });
  });

  /* ----- keyboard shortcuts -----
     Letters and brackets only: PSV binds ArrowUp/Down/Left/Right, PageUp,
     PageDown, + and - on window with preventDefault (psv-core.module.js
     keyboardActions), and `keyboard: 'always'` means it owns them while the
     editor is open. Letters are free.
     Every placement key is gated on a viewer existing — on a tour with no
     scenes, startPlacing() would append a ghost to document.body whose move
     and hide handlers live on a viewer container that was never built, leaving
     an invisible, unplaceable element behind. */
  const SHORTCUTS = [
    ['L', 'Place a link hotspot'],
    ['I', 'Place an info hotspot'],
    ['D', 'Place a defect'],
    ['U', 'Place a URL hotspot'],
    ['[  ]', 'Previous / next scene'],
    ['M', 'Open the map full size'],
    ['T', 'Start the tour'],
    ['S', 'Save now'],
    ['Ctrl+Z', 'Undo'],
    ['Ctrl+Shift+Z', 'Redo'],
    ['Esc', 'Cancel placing, or close a panel'],
    ['Ctrl+K', 'Jump to a scene or defect'],
    ['?', 'This list'],
  ];
  function stepScene(delta) {
    if (doc.scenes.length < 2) return;
    const i = doc.scenes.findIndex(s => s.id === curSceneId);
    const next = doc.scenes[(i + delta + doc.scenes.length) % doc.scenes.length];
    if (next) selectScene(next.id);
  }
  /* ----- jump to anything -----
     Editor only, on purpose: the viewer already ships the gallery plugin, and a
     second way to pick a scene there would be two answers to one question. In
     the editor there is no gallery — only a flat rail that is fine at six
     scenes and a scroll at forty.
     Searches what a bridge is actually filed under: scene name, station,
     element, photo stop, and every defect code and type. */
  function paletteRows(q) {
    const needle = q.trim().toLowerCase();
    const rows = [];
    for (const s of doc.scenes) {
      rows.push({
        kind: 'scene', sceneId: s.id, label: s.name || 'Untitled',
        detail: [s.stop, s.element, s.station && `Sta ${s.station}`].filter(Boolean).join(' · '),
      });
      for (const h of s.hotspots || []) {
        if (h.type !== 'defect') continue;
        rows.push({
          kind: 'defect', sceneId: s.id, hotspotId: h.id,
          label: `${h.code || 'Defect'} — ${h.defect || ''}`.trim(),
          detail: [defectMeasure(h), s.name].filter(Boolean).join(' · '),
        });
      }
    }
    if (!needle) return rows.slice(0, 40);
    return rows.filter(r => `${r.label} ${r.detail}`.toLowerCase().includes(needle)).slice(0, 40);
  }

  function showPalette() {
    if (!doc.scenes.length) { toast('Nothing to jump to yet — drop some photos in first'); return; }
    document.getElementById('palette')?.remove();
    const dlg = el(`<dialog class="palette" id="palette" aria-label="Jump to a scene or defect">
      <input type="text" id="pal-q" placeholder="Jump to a scene, a station, or a defect code…"
             autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true"
             aria-controls="pal-list" aria-autocomplete="list">
      <ul class="pal-list" id="pal-list" role="listbox"></ul>
    </dialog>`);
    document.body.append(dlg);
    const q = dlg.querySelector('#pal-q');
    const list = dlg.querySelector('#pal-list');
    let rows = [];
    let active = 0;

    const draw = () => {
      rows = paletteRows(q.value);
      active = Math.min(active, Math.max(0, rows.length - 1));
      /* innerHTML rewrites on every keypress, which also resets scrollTop, so
         the active row has to be brought back after each draw or arrowing past
         the eleventh row highlights something off screen. */
      list.innerHTML = rows.length
        ? rows.map((r, i) => `<li id="pal-opt-${i}" role="option" aria-selected="${i === active}" class="${i === active ? 'on' : ''}">
            <span class="pal-kind ${r.kind}">${r.kind === 'defect' ? 'Defect' : 'Scene'}</span>
            <span class="pal-label">${esc(r.label)}</span>
            <span class="pal-detail">${esc(r.detail)}</span></li>`).join('')
        /* the query is user text and goes through esc(); a long paste would
           otherwise stretch the dialog, so it is trimmed for display too */
        : `<li class="pal-none">Nothing matches “${esc(q.value.trim().slice(0, 40))}”</li>`;
      list.children[active]?.scrollIntoView({ block: 'nearest' });
      /* without this a screen reader is told a listbox exists and never which
         row is current, so arrowing through it announces nothing at all */
      q.setAttribute('aria-activedescendant', rows.length ? `pal-opt-${active}` : '');
    };

    const go = () => {
      const r = rows[active];
      if (!r) return;
      dlg.close();
      const jump = () => {
        if (!r.hotspotId) return;
        /* selectScene restores the scene's stored start view, so without this a
           jump to D7 can land 180 degrees behind the defect it just opened. */
        const target = doc.scenes.find(x => x.id === r.sceneId)
          ?.hotspots?.find(x => x.id === r.hotspotId);
        if (target && editorViewer) {
          editorViewer.rotate({ yaw: (target.yaw || 0) * DEG, pitch: (target.pitch || 0) * DEG });
        }
        openHotspotPanel(r.hotspotId);
      };
      if (r.sceneId === curSceneId) jump();
      else Promise.resolve(selectScene(r.sceneId)).then(jump);
    };

    q.addEventListener('input', draw);
    dlg.addEventListener('keydown', e => {
      /* PSV binds keydown on WINDOW in the bubble phase (psv-core.module.js:
         `window.addEventListener("keydown", this, {passive:false})`) and
         preventDefaults every arrow while keyboard:'always' is set — which
         would steal them from this input. Stopping propagation here beats it
         to them, because a dialog is a descendant of body and bubbles first.
         Deliberately NOT stopKeyboardControl()/startKeyboardControl(): that
         needs the state put back on close, and hanging a dead-arrow-keys bug
         on one event firing is a worse trade than one line here. Escape still
         closes the dialog — that is a UA close request, not a listener. */
      e.stopPropagation();
      if (e.key === 'ArrowDown') { active = Math.min(active + 1, rows.length - 1); draw(); e.preventDefault(); }
      else if (e.key === 'ArrowUp') { active = Math.max(active - 1, 0); draw(); e.preventDefault(); }
      else if (e.key === 'Enter') { go(); e.preventDefault(); }
    });
    list.addEventListener('click', e => {
      const li = e.target.closest('li');
      if (!li || li.classList.contains('pal-none')) return;
      active = [...list.children].indexOf(li);
      go();
    });

    /* Tidy-up only — nothing here is load-bearing, so a browser that never
       delivered this event would still leave a working editor behind. */
    dlg.addEventListener('close', () => dlg.remove());

    draw();
    dlg.showModal();
  }

  function showHelpSheet() {
    document.getElementById('help-sheet')?.remove();
    const dlg = el(`<dialog class="help-sheet" id="help-sheet" aria-label="Keyboard shortcuts">
      <h4>Keyboard shortcuts</h4>
      <dl>${SHORTCUTS.map(([k, what]) => `<dt><kbd>${esc(k)}</kbd></dt><dd>${esc(what)}</dd>`).join('')}</dl>
      <form method="dialog"><button class="btn" autofocus>Close</button></form>
    </dialog>`);
    document.body.append(dlg);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.showModal();
  }
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      if (!modalOpen()) showPalette();
      return;
    }
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (isField(e) || modalOpen() || drawerOpen()) return;
    if (e.key === '?') { e.preventDefault(); showHelpSheet(); return; }
    if (!doc.scenes.length) return;
    const k = e.key.toLowerCase();
    if (k === 'l' && editorViewer) startPlacing('link');
    else if (k === 'i' && editorViewer) startPlacing('info');
    else if (k === 'd' && editorViewer) startPlacing('defect');
    else if (k === 'u' && editorViewer) startPlacing('url');
    else if (e.key === '[') stepScene(-1);
    else if (e.key === ']') stepScene(1);
    else if (k === 't') startTour();
    else if (k === 'm') toggleMap();
    else if (k === 's') saveNow();
    else return;
    e.preventDefault();
  });

  /* ----- drag a hotspot to where you want it -----
     PSV has no draggable markers, so this rides on top of it: catch the pointer
     before the viewer sees it, or the panorama spins instead of the hotspot
     moving. The document is written once on release, so one drag costs one
     Undo rather than one per pixel. Pointer events cover touch, and the Move
     button in the hotspot panel stays as the keyboard-reachable equivalent. */

  const MARKER_ID = 'psv-marker-';
  /* A 16px dot is almost impossible to press dead centre, and on a touchscreen
     even a 40px one is a coin toss. Grab anything within this ring of a
     hotspot instead of demanding a direct hit — roughly the 44px target size
     touch guidance asks for, on the smallest hotspot the editor allows. */
  const GRAB_SLACK = 18;
  let dragging = null;

  /* Nearest hotspot to the pointer, by where it actually sits on screen. Going
     through the rendered elements rather than re-projecting the angles means
     PSV's own visibility rules decide what is grabbable, so a hotspot behind
     the camera or off the covered part of a partial panorama is never picked. */
  function hotspotElementNear(clientX, clientY, host) {
    let best = null;
    for (const el of host.querySelectorAll('.psv-marker')) {
      if (!el.id.startsWith(MARKER_ID)) continue;
      const box = el.getBoundingClientRect();
      if (!box.width || !box.height) continue;
      const d = Math.hypot(clientX - (box.left + box.width / 2), clientY - (box.top + box.height / 2));
      if (d <= Math.max(box.width, box.height) / 2 + GRAB_SLACK && (!best || d < best.d)) best = { el, d };
    }
    return best?.el || null;
  }

  function wireMarkerDrag() {
    const host = editorViewer.container;

    const aimAt = e => {
      const rect = host.getBoundingClientRect();
      return editorViewer.dataHelper.viewerCoordsToSphericalCoords({
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
      });
    };

    /* the hotspot-to-be follows the pointer, and hides whenever it leaves the
       panorama so it never floats over the sidebar */
    host.addEventListener('pointermove', e => {
      if (!ghost) return;
      ghost.style.left = `${e.clientX}px`;
      ghost.style.top = `${e.clientY}px`;
      ghost.style.visibility = 'visible';
    });
    host.addEventListener('pointerleave', () => { if (ghost) ghost.style.visibility = 'hidden'; });

    /* PSV only raises its click when the ray lands on actual photo, and a
       partial panorama has no geometry outside its covered slice — so a click
       into the empty part is swallowed with no sign it happened. Say why. */
    host.addEventListener('click', e => {
      if (!placing || !isPartial(curScene())) return;
      if (!aimAt(e)) toast('Your photo does not reach that far — there is nothing there to pin a hotspot to', true);
    });

    host.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      const el = hotspotElementNear(e.clientX, e.clientY, host);
      if (!el) return;
      if (placing) {
        /* A marker sits between the pointer and the sphere, so pressing one
           while placing reached neither the drag nor the placement handler and
           did nothing at all. Place it here instead — the user aimed there. */
        const at = aimAt(e);
        if (!at) return;
        e.stopPropagation();
        e.preventDefault();
        onPlace(+wrap180(at.yaw / DEG).toFixed(2), +(at.pitch / DEG).toFixed(2));
        return;
      }
      const id = el.id.slice(MARKER_ID.length);
      const h = curScene()?.hotspots?.find(x => x.id === id);
      if (!h) return;
      e.stopPropagation();
      e.preventDefault();
      dragging = { h, id, moved: false };
      host.setPointerCapture(e.pointerId);
      host.classList.add('dragging-hotspot');
    }, true);

    host.addEventListener('pointermove', e => {
      if (!dragging) return;
      e.stopPropagation();
      const at = aimAt(e);
      /* the ray misses wherever the sphere has no photo on it, which on a
         partial panorama is most of it — leave the hotspot at the last spot
         that had one rather than flinging it somewhere invisible */
      if (!at) return;
      dragging.moved = true;
      dragging.h.yaw = +wrap180(at.yaw / DEG).toFixed(2);
      dragging.h.pitch = +(at.pitch / DEG).toFixed(2);
      markers.updateMarker({ id: dragging.id, position: { yaw: at.yaw, pitch: at.pitch } });
    }, true);

    const drop = e => {
      if (!dragging) return;
      e.stopPropagation();
      host.classList.remove('dragging-hotspot');
      const { moved, id } = dragging;
      dragging = null;
      if (moved) { scheduleSave(); return; }
      /* Pressed and released without moving: that is a click, and it has to
         still open the panel. Swallowing the pointer above means PSV never
         sees it, so its own select-marker never fires and the panel would
         otherwise be unreachable by the obvious gesture. */
      openHotspotPanel(id);
    };
    host.addEventListener('pointerup', drop, true);
    host.addEventListener('pointercancel', drop, true);
  }

  /* ----- build mode -----
     One armed target, as many clicks as there are doorways. The bar stays open
     between placements, so laying out a floor never means going back to a menu
     between arrows. */

  const otherScenes = () => doc.scenes.filter(s => s.id !== curSceneId);
  const hasLink = (scene, targetId) =>
    (scene.hotspots || []).some(h => h.type === 'link' && h.target === targetId);

  /* every hotspot is born wearing whatever the last one was styled as, so a
     look is chosen once rather than forty times */
  const styled = h => (lastStyle ? Object.assign(h, lastStyle) : h);

  function addLink(from, targetId, yaw, pitch) {
    from.hotspots = from.hotspots || [];
    from.hotspots.push(styled({ id: newId('h'), type: 'link', yaw, pitch, target: targetId, label: '' }));
  }

  function toggleBuildMode() {
    if (armedTarget()) { exitBuildMode(); return; }
    const others = otherScenes();
    if (!others.length) {
      toast('Add a second scene first — a link needs somewhere to go', true);
      return;
    }
    closeHotspotPanel();
    /* arm somewhere this scene cannot reach yet, so the common case is one click */
    const linked = new Set((curScene()?.hotspots || []).filter(h => h.type === 'link').map(h => h.target));
    setPlacing({ link: (others.find(s => !linked.has(s.id)) || others[0]).id });
  }

  function exitBuildMode() {
    setPlacing(null);
  }

  function syncBuildMode() {
    const on = Boolean(armedTarget());
    const btn = document.getElementById('build-links');
    document.getElementById('build-bar')?.classList.toggle('open', on);
    if (btn) {
      btn.classList.toggle('on', on);
      btn.setAttribute('aria-pressed', String(on));
      btn.textContent = on ? 'Done linking' : 'Build links';
    }
    const ret = document.getElementById('bb-return');
    if (ret) ret.checked = buildReturn;
    if (on) renderBuildChips();
    updateHint();
  }

  function renderBuildChips() {
    const host = document.getElementById('bb-chips');
    if (!host) return;
    host.innerHTML = '';
    const from = curScene();
    for (const s of otherScenes()) {
      const armed = armedTarget() === s.id;
      const done = from ? hasLink(from, s.id) : false;
      const chip = el(`<button class="bb-chip${armed ? ' on' : ''}" aria-pressed="${armed}"
          aria-label="Place a link to ${esc(s.name)}${done ? ', already linked from here' : ''}">
          <img src="${fileUrl(doc.id, s.thumb || s.file)}" alt="">
          <span class="nm">${esc(s.name)}</span>
          ${done ? '<span class="tick" aria-hidden="true">&check;</span>' : ''}
        </button>`);
      chip.addEventListener('click', () => {
        setPlacing({ link: s.id });
        renderBuildChips();
      });
      host.append(chip);
    }
  }

  /* Where the return arrow points — the one place that knows how to reverse a
     link, so every caller gets the same three tiers.

     A real bearing at both ends beats anything else. Failing that, "the other
     side of the same doorway" used to be it, and that quietly assumes the far
     photo is turned exactly the way this one is — which is only true if the
     inspector never pivoted between shots. The two photos can measure that
     turn between themselves off the landmarks they share, so ask them; when
     they cannot agree, yawBetween returns null and the old assumption stands. */
  function returnYaw(from, target, outgoingYaw) {
    /* Both ENDS need a fix, not merely a geo block: a photo aimed by hand on
       the plan carries a heading and no lat/lon, and bearing() on that pair
       returns NaN — which would be stored on the arrow and point nowhere. */
    const fixed = s => Number.isFinite(s?.geo?.lat) && Number.isFinite(s?.geo?.lon);
    if (fixed(from) && fixed(target) && Number.isFinite(target.geo.heading)) {
      return +wrap180(bearing(target.geo, from.geo) - target.geo.heading).toFixed(2);
    }
    const turn = yawBetween(from, target);
    return +wrap180(outgoingYaw + 180 + (turn?.degrees || 0)).toFixed(2);
  }

  function placeLink(from, targetId, yaw, pitch) {
    const target = doc.scenes.find(x => x.id === targetId);
    if (!target) { exitBuildMode(); return; }
    addLink(from, targetId, yaw, pitch);
    const back = buildReturn && target.id !== from.id && !hasLink(target, from.id);
    if (back) addLink(target, from.id, returnYaw(from, target, yaw), pitch);
    scheduleSave();
    refreshMarkers();
    renderBuildChips();
    renderSceneList();
    toast(back ? `Linked to "${target.name}", and back again` : `Linked to "${target.name}"`);
  }

  /* ----- the automatic guess -----
     Two tiers, and the sidebar says out loud which one ran. Photos carrying a
     GPS fix get arrows aimed at where the next scene actually stands; without
     one, the scenes chain in the order they were added, which is the order the
     walk was shot in. Either way every arrow stays draggable afterwards, and
     the whole run is one Ctrl+Z. */

  const AUTO_PITCH = -20;      /* arrows belong nearer the floor than eye level */
  const AUTO_NEIGHBOURS = 2;   /* onward and back; more turns a corridor into a web */
  const AUTO_MAX_METRES = 60;

  /* Two arrows on the same spot are one arrow as far as anybody clicking can
     tell, and the one underneath is unreachable. It happens constantly on a
     GPS tour: two scenes at similar bearings from here get the same computed
     yaw, and the second arrow lands exactly on the first.

     So an automatic arrow steps aside if its place is taken. Only automatic
     ones — a yaw somebody clicked is a decision and is never moved, which is
     why this lives here rather than in addLink, the function hand placement
     also goes through. The direction was already a guess the sidebar owns up
     to, so a few degrees to keep both arrows reachable costs nothing real. */
  const LINK_MIN_SEPARATION = 14;

  function freeYaw(scene, wanted, pitch) {
    const taken = (scene.hotspots || []).filter(h =>
      Math.abs(wrap180((h.pitch || 0) - pitch)) < LINK_MIN_SEPARATION);
    if (!taken.length) return +wrap180(wanted).toFixed(2);
    const clear = y => taken.every(h => Math.abs(wrap180(h.yaw - y)) >= LINK_MIN_SEPARATION);
    /* out from the wanted angle in both directions at once, so the arrow ends
       up as close to where it meant to point as the crowding allows */
    for (let step = 0; step <= 3; step++) {
      for (const y of (step ? [wanted + step * LINK_MIN_SEPARATION, wanted - step * LINK_MIN_SEPARATION] : [wanted])) {
        if (clear(wrap180(y))) return +wrap180(y).toFixed(2);
      }
    }
    return +wrap180(wanted).toFixed(2); /* wall to wall with arrows: keep the honest angle */
  }

  /* Link a pair both ways at once. A one-way arrow is a dead end from the far
     side, and nothing in the editor would show you that until you walked it. */
  function linkPair(from, to, outYaw, backYaw) {
    let made = 0;
    if (!hasLink(from, to.id)) { addLink(from, to.id, freeYaw(from, outYaw, AUTO_PITCH), AUTO_PITCH); made++; }
    if (!hasLink(to, from.id)) { addLink(to, from.id, freeYaw(to, backYaw, AUTO_PITCH), AUTO_PITCH); made++; }
    return made;
  }

  function autoLinkByGps(located) {
    /* GPS alone fixes WHICH scenes are neighbours; only a compass heading fixes
       WHERE to draw the arrow. Without one, fall back to the walking layout
       rather than inventing a bearing off an unknown rotation. */
    const aim = (from, to, fallback) => Number.isFinite(from.geo.heading)
      ? wrap180(bearing(from.geo, to.geo) - from.geo.heading)
      : fallback;
    let made = 0;
    for (const from of located) {
      located
        .filter(s => s !== from)
        .map(s => ({ s, d: metresBetween(from.geo, s.geo) }))
        .sort((a, b) => a.d - b.d)
        .filter(x => x.d <= AUTO_MAX_METRES)
        .slice(0, AUTO_NEIGHBOURS)
        .forEach(({ s }, i) => {
          /* a real bearing is better than anything the pixels can offer, so
             only the headingless fallback gets nudged onto an opening */
          const blind = snapToWay(wrap180((from.view?.yaw || 0) + i * 180), from.ways);
          const out = aim(from, s, blind);
          made += linkPair(from, s, out, aim(s, from, snapToWay(returnYaw(from, s, out), s.ways)));
        });
    }
    return made;
  }

  /* Chain scenes the way they were added, which is the order the walk was shot
     in. `seed` picks which scenes start a link; the far end always gets the
     matching arrow back, so a photo the GPS pass could not place is never left
     hanging off the end of the tour. */
  function autoLinkByOrder(scenes, seed = () => true) {
    let made = 0;
    scenes.forEach((here, i) => {
      if (!seed(here)) return;
      const facing = here.view?.yaw || 0; /* forward sits where the scene already looks */
      for (const [other, yaw] of [[scenes[i + 1], facing], [scenes[i - 1], facing + 180]]) {
        if (!other) continue;
        /* nudge both ends onto whatever each photo suggests is open */
        const out = snapToWay(wrap180(yaw), here.ways);
        made += linkPair(here, other, out, snapToWay(returnYaw(here, other, out), other.ways));
      }
    });
    return made;
  }

  function autoLink() {
    if (doc.scenes.length < 2) { toast('Add a second scene first', true); return; }
    const located = doc.scenes.filter(s => Number.isFinite(s.geo?.lat) && Number.isFinite(s.geo?.lon));
    const useGps = located.length >= 2;
    const aimed = located.filter(s => Number.isFinite(s.geo.heading)).length;
    let made = 0;
    let strays = 0;
    if (useGps) {
      made = autoLinkByGps(located);
      if (located.length < doc.scenes.length) {
        /* photos with location turned off would otherwise drop out of the tour
           without a word — chain them to whatever sits either side in the list */
        const placed = new Set(located);
        strays = autoLinkByOrder(doc.scenes, s => !placed.has(s));
        made += strays;
      }
    } else {
      made = autoLinkByOrder(doc.scenes);
    }
    if (!made) { toast('Every scene already reaches its neighbours'); return; }
    scheduleSave();
    refreshMarkers();
    renderSceneList();
    if (armedTarget()) renderBuildChips();

    const n = `${made} link${made === 1 ? '' : 's'}`;
    const k = doc.scenes.length - located.length;
    const tail = strays
      ? ` ${k} photo${k === 1 ? '' : 's'} carried no location, so ${k === 1 ? 'it was' : 'they were'} chained in list order instead.`
      : '';
    const solar = located.filter(s => s.geo.headingFrom === 'sun').length;
    const sunNote = solar
      ? ` ${solar} of ${solar === 1 ? 'them took its' : 'them took their'} bearing from where the sun`
        + ' sits in the photo, which no amount of steel can deflect.'
      : '';
    setLinkSummary((!useGps
      ? `Added ${n} by walking the scenes in the order you added them — these photos carry no GPS, so treat the directions as a starting point and drag any arrow that sits wrong.`
      : aimed
        ? `Added ${n} from the photos' own GPS and compass.${sunNote} Phone GPS is good to a few metres, so check each arrow and drag any that misses.`
        : `Added ${n}: GPS says which scenes are neighbours, but none of these photos recorded a compass heading, so the directions are guessed. Drag each arrow onto its doorway.`) + tail);
    toast(`Added ${n} — Ctrl+Z undoes the lot`);
  }

  function setLinkSummary(text) {
    const p = document.getElementById('link-summary');
    if (p) p.textContent = text || '';
  }

  /* ----- how much sphere this photo covers -----
     A phone sweep does not say how wide it is, so the upload guesses from the
     shape and this is where the guess gets corrected. Width is the only real
     knob: an equirectangular projection shares one degrees-per-pixel scale
     across both axes, so the height follows from it and cannot disagree. */

  /* ----- what this photo is OF -----
     Three fields, all optional and all additive, so every tour.json written
     before today still loads. `stop` is a closed list because it drives the
     coverage tally; `element` is free text with suggestions because element
     naming is a local dialect and a closed list would be wrong somewhere on
     the first day; `station` is free text because 2+50 is not a number. */
  function renderSceneMeta() {
    const box = document.getElementById('scene-meta');
    if (!box) return;
    const s = curScene();
    if (!s) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <div class="frow"><label for="sc-stop">Required photo stop</label>
        <select id="sc-stop"><option value="">Not assigned</option>${NBIS_STOPS.map(x =>
          `<option value="${esc(x)}"${x === s.stop ? ' selected' : ''}>${esc(x)}</option>`).join('')}</select></div>
      <div class="frow"><label for="sc-element">Element</label>
        <input type="text" id="sc-element" list="element-list" maxlength="60"
               value="${esc(s.element || '')}" placeholder="e.g. Bearing, elastomeric pad"></div>
      <div class="frow"><label for="sc-station">Station</label>
        <input type="text" id="sc-station" maxlength="20"
               value="${esc(s.station || '')}" placeholder="e.g. 2+50"></div>
      <p class="scene-note" id="sc-derived"></p>`;

    /* What was worked out about this photo rather than typed into it, and
       where each piece came from. An inspector writing "the fascia faces 118°"
       into a report needs to know whether that number came off a compass, off
       the sun, or out of an assumption. */
    const derived = [];
    const g = s.geo;
    if (Number.isFinite(g?.heading)) {
      const src = {
        sun: 'worked out from the sun',
        magnetic: 'from the camera’s magnetic compass',
        hand: 'aimed by hand on the map',
        match: 'carried over from a photo that shares this view',
        plan: 'worked out from where its links point on the map',
      }[g.headingFrom] || 'recorded by the camera';
      derived.push(`Centre of this photo faces ${Math.round(g.heading)}°, ${src}.`);
      /* A hand aim overwrites a measurement. Print what it replaced rather than
         letting the camera's own number disappear behind a drag — the same
         reason the sun and magnetic readings are both kept below. */
      if (Number.isFinite(g.headingWas)) {
        derived.push(`Before you aimed it, this photo's bearing was ${Math.round(g.headingWas)}°.`);
      }
      /* Both numbers exist and disagree: say so rather than silently preferring
         one. On a steel structure the magnetic one is the suspect — but it is
         the inspector standing there who knows whether they were beside a
         girder or out on the approach. */
      if (Number.isFinite(g.sunHeading)) {
        const off = Math.abs(wrap180(g.sunHeading - g.heading));
        if (off >= HEADING_DISPUTE) {
          derived.push(`The sun puts it at ${Math.round(g.sunHeading)}° instead, ${Math.round(off)}° away.`
            + ' Steel deflects a magnetic compass and the sun cannot be deflected, so prefer the sun'
            + ' if this photo was taken close to the structure.');
        }
      }
    }
    const guessedView = {
      person: 'Opens facing someone in hi-vis, on the assumption they are at whatever is being inspected.',
      facing: 'Nobody was standing out in this one, so it opens whichever way the person under the camera'
        + ' was looking, read off the top of their head at the base of the photo.',
    }[s.viewFrom];
    if (guessedView) {
      derived.push(`${guessedView} Turn to what you want and press “Set start view from here” to override.`);
    }
    box.querySelector('#sc-derived').textContent = derived.join(' ');

    box.querySelector('#sc-stop').addEventListener('change', e => {
      s.stop = e.target.value || undefined; scheduleSave(); renderCoverage(); renderSceneList();
    });
    box.querySelector('#sc-element').addEventListener('input', e => {
      s.element = e.target.value.trim() || undefined; scheduleSave();
    });
    box.querySelector('#sc-station').addEventListener('input', e => {
      s.station = e.target.value.trim() || undefined; scheduleSave();
    });
  }

  function renderSceneShape() {
    const section = document.getElementById('scene-section');
    const host = document.getElementById('scene-shape');
    if (!section || !host) return;
    const s = curScene();
    section.hidden = !s;
    /* rendered from here so every existing caller picks it up for free */
    renderSceneMeta();
    if (!s) return;
    const hFov = isPartial(s) ? s.pano.hFov : 360;
    const pitch = isPartial(s) ? (s.pano.pitch || 0) : 0;
    /* the two axes share one degrees-per-pixel scale, so a short photo cannot
       be stretched all the way round without its top and bottom meeting —
       cap the slider at the widest this shape can honestly be */
    const maxFov = s.size?.w ? Math.min(360, Math.floor(180 * s.size.w / s.size.h)) : 360;
    host.innerHTML = `
      <div class="range-row">
        <label for="sc-hfov">Width</label>
        <input type="range" id="sc-hfov" min="30" max="${maxFov}" step="1"
               value="${Math.round(Math.min(hFov, maxFov))}" aria-describedby="sc-note">
        <span class="val num" id="sc-hfov-val"></span>
      </div>
      <div class="range-row">
        <label for="sc-tilt">Tilt</label>
        <input type="range" id="sc-tilt" min="-80" max="80" step="1" value="${Math.round(pitch)}" aria-describedby="sc-note">
        <span class="val num" id="sc-tilt-val"></span>
      </div>
      <p class="scene-note" id="sc-note"></p>`;

    const hEl = host.querySelector('#sc-hfov');
    const tEl = host.querySelector('#sc-tilt');
    const note = host.querySelector('#sc-note');

    const describe = () => {
      const h = Number(hEl.value);
      host.querySelector('#sc-hfov-val').textContent = `${h}°`;
      host.querySelector('#sc-tilt-val').textContent = `${Number(tEl.value)}°`;
      /* written from here rather than a second listener: this already runs on
         every input, and "200" on its own tells a screen-reader user nothing */
      hEl.setAttribute('aria-valuetext', `${h} degrees across`);
      tEl.setAttribute('aria-valuetext', `${Number(tEl.value)} degrees of tilt`);
      const v = s.size?.w ? Math.round(vFovOf(h, s.size.w, s.size.h)) : null;
      const coverage = h >= 359.5
        ? 'Wraps all the way round — a full 360° photo.'
        : v
          ? `Covers ${h}° across and ${v}° up and down. The rest takes its sky and ground from the photo.`
          : `Covers ${h}° across. The rest takes its sky and ground from the photo.`;
      /* the photo itself is usually the limit on sharpness, not the viewer, so
         say what came off the camera rather than leaving it to be guessed at */
      const px = s.size?.w
        ? ` ${s.size.w} × ${s.size.h} pixels${s.converted ? ', converted to JPEG so every browser can read it.' : ', uploaded exactly as it came off the camera.'}`
        : '';
      const capped = s.size?.w > SYSTEM.maxTextureWidth
        ? ` Wider than this machine's graphics can hold (${SYSTEM.maxTextureWidth}px), so the viewer scales it down to fit.`
        : '';
      note.textContent = coverage + px + capped;
    };

    const commit = () => {
      const h = Number(hEl.value);
      const t = Number(tEl.value);
      if (h >= 359.5 && t === 0) delete s.pano; /* a clean full sphere carries no override */
      else s.pano = { hFov: h, pitch: t };
      scheduleSave();
      reshapeCurrentScene();
    };

    describe();
    for (const input of [hEl, tEl]) {
      input.addEventListener('input', describe);
      input.addEventListener('change', commit);
    }
  }

  function onPlace(yaw, pitch) {
    const s = curScene();
    if (!s) return;
    s.hotspots = s.hotspots || [];
    if (armedTarget()) { placeLink(s, armedTarget(), yaw, pitch); return; }
    if (placing?.move) {
      const h = s.hotspots.find(x => x.id === placing.move);
      if (h) { h.yaw = yaw; h.pitch = pitch; scheduleSave(); refreshMarkers(); }
      setPlacing(null);
      return;
    }
    const type = placing;
    setPlacing(null);
    /* a link is born connected to nothing: the panel that opens next is where
       you say where it goes, which is the point of placing first */
    const h = styled(
      type === 'link' ? { id: newId('h'), type: 'link', yaw, pitch, target: '', label: '' }
        : type === 'url' ? { id: newId('h'), type: 'url', yaw, pitch, url: '', label: '' }
          : type === 'defect'
            ? { id: newId('h'), type: 'defect', yaw, pitch, code: nextDefectCode(doc.scenes), defect: DEFECT_TYPES[0], note: '' }
            : { id: newId('h'), type: 'info', yaw, pitch, title: '', text: '' });
    s.hotspots.push(h);
    scheduleSave();
    refreshMarkers();
    renderSceneList();
    openHotspotPanel(h.id);
  }

  /* Focus goes back to whatever opened the panel, but ONLY when the panel is
     what the user just dismissed. closeHotspotPanel is also called from Build
     links, Undo, Start tour, deleting a scene and opening a different hotspot —
     restoring there would snatch focus off the control they just pressed. */
  let panelOpener = null;
  function closeHotspotPanel({ restore = false } = {}) {
    const panel = document.querySelector('.hs-panel');
    if (!panel) return;
    panel.remove();
    if (restore && panelOpener?.isConnected) panelOpener.focus();
    panelOpener = null;
  }

  function openHotspotPanel(hid) {
    const opener = document.activeElement;
    closeHotspotPanel();
    panelOpener = opener && opener !== document.body ? opener : null;
    const s = curScene();
    const h = s?.hotspots?.find(x => x.id === hid);
    if (!h) return;
    const pane = document.getElementById('main-pane');
    let inner;
    if (h.type === 'link') {
      const options = doc.scenes.filter(x => x.id !== s.id).map(x =>
        `<option value="${esc(x.id)}"${x.id === h.target ? ' selected' : ''}>${esc(x.name)}</option>`).join('');
      /* a freshly dropped link has nowhere to go yet, and saying so is better
         than quietly aiming it at whichever scene happened to be first */
      const unset = !doc.scenes.some(x => x.id === h.target);
      inner = `
        <h4>Link hotspot</h4>
        <div class="frow"><label for="hs-target">Goes to</label>
          <select id="hs-target">${options
            ? `${unset ? '<option value="" selected>Choose a scene&hellip;</option>' : ''}${options}`
            : '<option value="">(no other scenes yet)</option>'}</select></div>
        <div class="frow"><label for="hs-label">Label (optional)</label>
          <input type="text" id="hs-label" value="${esc(h.label || '')}" maxlength="80"></div>`;
    } else if (h.type === 'url') {
      inner = `
        <h4>URL hotspot</h4>
        <div class="frow"><label for="hs-url">Opens (https://&hellip;)</label>
          <input type="text" id="hs-url" value="${esc(h.url || '')}" maxlength="500" placeholder="https://example.com"
                 aria-describedby="hs-url-note">
          <span class="field-note" id="hs-url-note"></span></div>
        <div class="frow"><label for="hs-label">Label (optional)</label>
          <input type="text" id="hs-label" value="${esc(h.label || '')}" maxlength="80"></div>`;
    } else if (h.type === 'defect') {
      inner = `
        <h4>Defect <span class="num code-chip">${esc(h.code || '')}</span></h4>
        <div class="frow"><label for="hs-defect">Type</label>
          <select id="hs-defect">${DEFECT_TYPES.map(t =>
            `<option value="${esc(t)}"${t === h.defect ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select></div>
        <div id="hs-measure"></div>
        <div class="frow"><label for="hs-note">Note (location, extent, detail)</label>
          <textarea id="hs-note" maxlength="2000">${esc(h.note || '')}</textarea></div>
        <div class="frow"><label>Close-up photo (optional)</label><span id="hs-image-line"></span></div>`;
    } else {
      inner = `
        <h4>Info hotspot</h4>
        <div class="frow"><label for="hs-title">Title</label>
          <input type="text" id="hs-title" value="${esc(h.title || '')}" maxlength="120"></div>
        <div class="frow"><label for="hs-text">Text</label>
          <textarea id="hs-text" maxlength="4000">${esc(h.text || '')}</textarea></div>
        <div class="frow"><label>Image (optional)</label><span id="hs-image-line"></span></div>
        <div class="frow"><label>Audio clip (optional)</label><span id="hs-audio-line"></span></div>`;
    }
    /* only a link can lie flat on the floor as an arrow */
    const shapes = (h.type === 'link' ? ['arrow'] : []).concat('circle', 'square', 'diamond', 'ring', 'dot');
    const current = hotspotShape(h);
    inner += `
      <div class="frow"><label>Shape</label>
        <div class="shape-row" role="group" aria-label="Hotspot shape">${shapes.map(sh => `
          <button class="shape-btn${sh === current ? ' on' : ''}" data-shape="${sh}"
                  aria-pressed="${sh === current}" title="${SHAPE_NAMES[sh]}" aria-label="${SHAPE_NAMES[sh]}">
            <img src="${sh === 'arrow' ? ARROW_PREVIEW : hotspotIcon(h, sh)}" alt=""></button>`).join('')}
        </div>
      </div>
      <div class="range-row"><label for="hs-size">Size</label>
        <input type="range" id="hs-size" min="16" max="128" step="2" value="${hotspotSize(h)}">
        <span class="val num" id="hs-size-val"></span></div>
      <div class="range-row"><label for="hs-opacity">Opacity</label>
        <input type="range" id="hs-opacity" min="10" max="100" step="5" value="${Math.round(hotspotOpacity(h) * 100)}">
        <span class="val num" id="hs-opacity-val"></span></div>
      <div class="frow"><label>Custom icon (optional)</label><span id="hs-icon-line"></span></div>
      <div class="row">
        <button class="btn" id="hs-move">Move</button>
        <button class="btn danger-text" id="hs-delete">Delete</button>
        <button class="btn primary" id="hs-done" style="margin-left:auto">Done</button>
      </div>`;
    const panel = el(`<div class="hs-panel">${inner}</div>`);
    pane.append(panel);

    /* ponytail: a style change rebuilds every marker in the scene. Fine at the
       handful a room holds; switch to markers.updateMarker if a scene ever
       carries enough hotspots for the sliders to feel heavy. */
    const applyStyle = (key, value) => {
      h[key] = value;
      /* the next hotspot placed inherits this, so a look is chosen once */
      lastStyle = { shape: hotspotShape(h), size: hotspotSize(h), opacity: hotspotOpacity(h) };
      scheduleSave();
      refreshMarkers();
    };
    panel.querySelectorAll('.shape-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        for (const b of panel.querySelectorAll('.shape-btn')) {
          b.classList.toggle('on', b === btn);
          b.setAttribute('aria-pressed', String(b === btn));
        }
        applyStyle('shape', btn.dataset.shape);
      });
    });
    const sizeEl = panel.querySelector('#hs-size');
    const opacityEl = panel.querySelector('#hs-opacity');
    const showVals = () => {
      panel.querySelector('#hs-size-val').textContent = `${sizeEl.value}px`;
      panel.querySelector('#hs-opacity-val').textContent = `${opacityEl.value}%`;
      sizeEl.setAttribute('aria-valuetext', `${sizeEl.value} pixels`);
      opacityEl.setAttribute('aria-valuetext', `${opacityEl.value} per cent opaque`);
    };
    showVals();
    sizeEl.addEventListener('input', () => { showVals(); applyStyle('size', Number(sizeEl.value)); });
    opacityEl.addEventListener('input', () => { showVals(); applyStyle('opacity', Number(opacityEl.value) / 100); });

    if (h.type === 'link') {
      panel.querySelector('#hs-target').addEventListener('change', e => { h.target = e.target.value; scheduleSave(); refreshMarkers(); });
      panel.querySelector('#hs-label').addEventListener('input', e => { h.label = e.target.value; scheduleSave(); refreshMarkers(); });
    } else if (h.type === 'url') {
      const urlInput = panel.querySelector('#hs-url');
      const urlNote = panel.querySelector('#hs-url-note');
      const checkUrl = () => {
        const bad = h.url && !SAFE_URL(h.url);
        urlInput.classList.toggle('invalid', !!bad);
        urlNote.textContent = bad ? 'Must start with https:// — this link will not open.' : '';
      };
      urlInput.addEventListener('input', e => { h.url = e.target.value.trim(); checkUrl(); scheduleSave(); refreshMarkers(); });
      checkUrl();
      panel.querySelector('#hs-label').addEventListener('input', e => { h.label = e.target.value; scheduleSave(); refreshMarkers(); });
    } else if (h.type === 'defect') {
      const measure = panel.querySelector('#hs-measure');
      /* The measurement fields depend on the type, so they are redrawn rather
         than shown/hidden — a hidden depth input that still holds 2 in after
         you switch to Crack is how a register acquires a number nobody typed. */
      const drawMeasure = () => {
        const kind = DEFECT_MEASURE[h.defect] || '';
        const steps = kind === 'depth' ? DEPTH_STEPS : WIDTH_STEPS;
        const field = kind === 'depth' ? 'depthIn' : 'widthIn';
        measure.innerHTML = kind
          ? `<div class="frow"><label id="hs-measure-lbl">${kind === 'depth' ? 'Depth' : 'Width'}</label>
               <div class="seg" role="group" aria-labelledby="hs-measure-lbl">${steps.map(([v, label]) =>
                 `<button type="button" class="seg-btn${h[field] === v ? ' on' : ''}" data-v="${v}"
                    aria-pressed="${h[field] === v}">${esc(label)}</button>`).join('')}</div></div>
             <div class="range-row"><label for="hs-exact">Exact</label>
               <input type="number" id="hs-exact" min="0" max="99" step="${kind === 'depth' ? '0.25' : '0.0625'}"
                      value="${h[field] ?? ''}"><span class="val">in</span></div>`
          : `<p class="scene-note">Recorded by note and photo. The field sketch does not
             measure this type either, so neither does this.</p>`;
        if (h.defect === 'Spall') {
          measure.insertAdjacentHTML('beforeend',
            `<div class="field"><label for="hs-rebar">Reinforcement exposed</label>
               <input type="checkbox" id="hs-rebar"${h.rebar ? ' checked' : ''}></div>`);
          measure.querySelector('#hs-rebar').addEventListener('change', e => {
            h.rebar = e.target.checked; scheduleSave(); refreshMarkers();
          });
        }
        const exact = measure.querySelector('#hs-exact');
        const commit = v => {
          h[field] = v > 0 ? v : undefined;
          for (const b of measure.querySelectorAll('.seg-btn')) {
            const on = Number(b.dataset.v) === h[field];
            b.classList.toggle('on', on);
            b.setAttribute('aria-pressed', String(on));
          }
          if (exact && Number(exact.value) !== h[field]) exact.value = h[field] ?? '';
          scheduleSave(); refreshMarkers();
        };
        measure.querySelectorAll('.seg-btn').forEach(b =>
          b.addEventListener('click', () => commit(Number(b.dataset.v))));
        exact?.addEventListener('input', () => commit(Number(exact.value)));
      };
      drawMeasure();
