<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Tour</title>
<link rel="stylesheet" href="/tour/vendor/psv-core.css">
<link rel="stylesheet" href="/tour/vendor/psv-markers.css">
<link rel="stylesheet" href="/tour/vendor/psv-virtual-tour.css">

<style>
  :root {
    --canvas: #0B0B0E;
    --surface: #1C1C22;
    --hairline: rgba(255, 255, 255, 0.12);
    --hairline-strong: rgba(255, 255, 255, 0.20);
    --text: #F2F2F7;
    --text-2: rgba(255, 255, 255, 0.60);
    --text-3: rgba(255, 255, 255, 0.38);
    --accent: #0A84FF;
    --danger: #FF453A;
    --success: #30D158;
    --r-sm: 12px;
    --r-md: 16px;
    --r-lg: 24px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--canvas);
    color: var(--text);
    font: 15px/1.5 -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  button { font: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; font-family: ui-monospace, Consolas, monospace; }

  /* ---------- home ---------- */
  .home { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .home-head h1 { font-size: 28px; font-weight: 700; margin: 0; }
  .home-sub { color: var(--text-2); margin: 0 0 28px; }
  .btn {
    background: var(--surface); color: var(--text);
    border: 1px solid var(--hairline); border-radius: var(--r-sm);
    padding: 8px 16px; transition: transform 150ms ease-out, background 150ms ease-out;
  }
  .btn:hover { background: #26262e; }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.primary:hover { background: #2a94ff; }
  .btn.danger-text { color: var(--danger); }
  .btn.danger-solid { background: var(--danger); border-color: transparent; color: #fff; }
  .create-row { display: none; gap: 8px; margin-bottom: 20px; }
  .create-row.open { display: flex; }
  .text-input {
    flex: 1; max-width: 360px; background: var(--surface); color: var(--text);
    border: 1px solid var(--hairline-strong); border-radius: var(--r-sm);
    padding: 8px 14px; font: inherit;
  }
  .text-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--hairline-strong);
    border-radius: 999px; padding: 10px 20px; z-index: 100; font-size: 14px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .tour-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .tour-card {
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: var(--r-md); padding: 20px; display: flex; flex-direction: column; gap: 6px;
  }
  .tour-card h2 { margin: 0; font-size: 17px; font-weight: 600; overflow-wrap: anywhere; }
  .tour-card .cover {
    width: calc(100% + 40px); margin: -20px -20px 8px; height: 120px;
    object-fit: cover; border-radius: var(--r-md) var(--r-md) 0 0; display: block;
    background: var(--canvas);
  }
  .tour-card .meta { color: var(--text-2); font-size: 13px; }
  .tour-card .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .empty-card {
    grid-column: 1 / -1; text-align: center; padding: 56px 24px;
    border: 1px dashed var(--hairline-strong); border-radius: var(--r-md); color: var(--text-2);
  }
  .state-note { color: var(--text-2); padding: 24px 0; }
  .state-note.error { color: var(--danger); }

  /* ---------- viewer ---------- */
  .stage { position: fixed; inset: 0; }
  #psv { width: 100%; height: 100%; }
  .tour-title {
    position: absolute; top: 16px; left: 16px; z-index: 20;
    background: rgba(11, 11, 14, 0.72); backdrop-filter: blur(8px);
    border: 1px solid var(--hairline); border-radius: var(--r-sm);
    padding: 8px 14px; font-size: 14px; font-weight: 600; max-width: min(60vw, 480px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tour-logo {
    position: absolute; left: 16px; bottom: 56px; z-index: 20; display: block;
  }
  .tour-logo img { max-height: 56px; max-width: 160px; display: block; }
  /* stepping to the next scene: lean forward, then settle */
  .stage .psv-canvas-container { transition: transform 620ms cubic-bezier(0.32, 0, 0.24, 1); }
  .stage.stepping .psv-canvas-container { transform: scale(1.14); }
  @media (prefers-reduced-motion: reduce) {
    .stage .psv-canvas-container { transition: none; }
    .stage.stepping .psv-canvas-container { transform: none; }
  }
  .load-error {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 30;
    background: var(--surface); border: 1px solid var(--danger); color: var(--text);
    border-radius: var(--r-sm); padding: 14px 20px; max-width: 80%; text-align: center;
  }
  .center-note {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .center-note .big { font-size: 20px; font-weight: 600; }
  .center-note .sub { color: var(--text-2); }
  .center-note a { color: var(--accent); }
  .spin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--hairline-strong); border-top-color: var(--accent);
    animation: spin 800ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation-duration: 2s; }
    .btn { transition: none; }
  }

  /* ---------- editor ---------- */
  .editor { display: flex; height: 100vh; }
  .side {
    width: 320px; flex: none; background: var(--surface);
    border-right: 1px solid var(--hairline); display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .side-head { padding: 16px; border-bottom: 1px solid var(--hairline); }
  .side-head .back { color: var(--text-2); text-decoration: none; font-size: 13px; }
  .side-head .back:hover { color: var(--text); }
  .name-input {
    width: 100%; margin-top: 8px; background: transparent; color: var(--text);
    border: 1px solid transparent; border-radius: 8px; padding: 6px 8px;
    font-size: 17px; font-weight: 600;
  }
  .name-input:hover { border-color: var(--hairline); }
  .name-input:focus-visible { outline: none; border-color: var(--accent); background: var(--canvas); }
  .save-status { font-size: 12px; color: var(--text-3); margin-top: 4px; min-height: 16px; }
  .save-status.saving { color: var(--text-2); }
  .save-status.error { color: var(--danger); }
  .side-section { padding: 14px 16px; border-bottom: 1px solid var(--hairline); }
  .side-section h3 {
    margin: 0 0 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3);
  }
  .scene-row {
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 8px;
    border: 1px solid transparent;
  }
  .scene-row:hover { background: rgba(255, 255, 255, 0.04); }
  .scene-row.active { border-color: var(--accent); background: rgba(10, 132, 255, 0.10); }
  .scene-pick {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    background: none; border: none; color: inherit; padding: 0 6px 0 0; cursor: pointer; text-align: left;
  }
  .scene-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .scene-row img { width: 56px; height: 28px; object-fit: cover; border-radius: 4px; flex: none; }
  .scene-row .sn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  .start-btn {
    font-size: 10px; letter-spacing: 0.04em; border-radius: 4px; padding: 1px 5px; flex: none;
    background: none; border: 1px solid var(--hairline-strong); color: var(--text-3); cursor: pointer;
  }
  .start-btn:hover { color: var(--accent); border-color: var(--accent); }
  .start-btn.on { color: var(--accent); border-color: var(--accent); cursor: default; }
  .start-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn.armed { color: #fff; background: var(--danger); }
  .sn-input {
    flex: 1; min-width: 0; background: var(--canvas); color: var(--text);
    border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: 14px;
  }
  .icon-btn {
    background: none; border: none; color: var(--text-3); padding: 2px 4px;
    border-radius: 6px; font-size: 14px; line-height: 1; flex: none;
  }
  .icon-btn:hover { color: var(--text); background: rgba(255, 255, 255, 0.08); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); }
  .drop-zone {
    margin-top: 10px; border: 1px dashed var(--hairline-strong); border-radius: var(--r-sm);
    padding: 18px 12px; text-align: center; color: var(--text-2); font-size: 13px; cursor: pointer;
  }
  .drop-zone.drag { border-color: var(--accent); color: var(--accent); background: rgba(10, 132, 255, 0.08); }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; font-size: 14px; }
  .field label { color: var(--text-2); }
  .field input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  .field input[type="number"], .field input[type="url"], .field select {
    background: var(--canvas); color: var(--text); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 5px 8px; font: inherit; font-size: 13px; max-width: 150px;
  }
  .field .file-line { display: flex; align-items: center; gap: 6px; }
  .share-row { margin: 12px 0 0; }
  .share-row label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
  .share-row .copy { display: flex; gap: 6px; align-items: flex-start; }
  .share-row input, .share-row textarea {
    flex: 1; min-width: 0; background: var(--canvas); color: var(--text-2);
    border: 1px solid var(--hairline); border-radius: 8px; padding: 6px 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 11px; resize: vertical;
  }
  .share-row input:focus-visible, .share-row textarea:focus-visible { outline: 2px solid var(--accent); }
  .share-row .btn { padding: 5px 10px; font-size: 12px; flex: none; }
  a.btn { text-decoration: none; display: inline-block; }
  .main-pane { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    background: var(--surface); border-bottom: 1px solid var(--hairline); flex-wrap: wrap;
  }
  .toolbar .hint { color: var(--text-2); font-size: 13px; margin-left: auto; }
  .toolbar .hint.placing { color: var(--accent); }
  #edit-psv { flex: 1; min-height: 0; }
  .editor-empty {
    flex: 1; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; color: var(--text-2); text-align: center; padding: 24px;
  }
  .hs-panel {
    position: absolute; top: 60px; right: 14px; z-index: 30; width: 300px;
    background: var(--surface); border: 1px solid var(--hairline-strong);
    border-radius: var(--r-md); padding: 16px; box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  }
  .hs-panel h4 { margin: 0 0 10px; font-size: 14px; }
  .hs-panel .frow { margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .hs-panel .frow label { font-size: 12px; color: var(--text-2); }
  .hs-panel input[type="text"], .hs-panel textarea, .hs-panel select {
    background: var(--canvas); color: var(--text); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; width: 100%;
  }
  .hs-panel textarea { min-height: 64px; resize: vertical; }
  .hs-panel .row { display: flex; gap: 8px; margin-top: 12px; }
  .hs-panel input.invalid { border-color: var(--danger); }
  .field-note { font-size: 11px; color: var(--danger); min-height: 13px; }
  .icon-btn:disabled { opacity: 0.28; cursor: default; background: none; color: var(--text-3); }

  /* ---------- build mode: the link-laying bar ---------- */
  .btn.on { background: var(--accent); border-color: transparent; color: #fff; }
  .btn.on:hover { background: #2a94ff; }
  .build-bar {
    display: none; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 8px 14px; background: rgba(10, 132, 255, 0.10);
    border-bottom: 1px solid var(--hairline);
  }
  .build-bar.open { display: flex; }
  .bb-label {
    font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-3); flex: none;
  }
  .bb-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 120px; }
  .bb-chip {
    display: flex; align-items: center; gap: 7px; max-width: 210px;
    padding: 3px 11px 3px 3px; font-size: 13px; color: var(--text);
    background: var(--surface); border: 1px solid var(--hairline-strong); border-radius: 999px;
  }
  .bb-chip img { width: 30px; height: 18px; object-fit: cover; border-radius: 999px; flex: none; }
  .bb-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bb-chip .tick { color: var(--success); flex: none; font-size: 12px; }
  .bb-chip.on { border-color: var(--accent); background: rgba(10, 132, 255, 0.24); }
  .bb-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bb-return { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); flex: none; }
  .bb-return input { accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- scene coverage sliders ---------- */
  .range-row { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
  .range-row > label { font-size: 12px; color: var(--text-2); width: 58px; flex: none; }
  .range-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .range-row .val { font-size: 12px; color: var(--text-2); width: 46px; text-align: right; flex: none; }
  .scene-note { font-size: 12px; color: var(--text-3); margin: 4px 0 0; }

  /* the hotspot you are about to drop, riding the cursor until you place it */
  .place-ghost {
    position: fixed; z-index: 200; pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0.9;
    filter: drop-shadow(0 0 8px rgba(10, 132, 255, 0.95));
  }

  /* walking the tour without leaving the editor */
  .tryout { position: absolute; inset: 0; z-index: 60; background: var(--canvas); }
  .tryout iframe { display: block; width: 100%; height: 100%; border: 0; }
  .tryout-close {
    position: absolute; top: 14px; right: 14px; z-index: 61;
    background: rgba(11, 11, 14, 0.82); backdrop-filter: blur(8px);
  }

  /* hotspots are draggable in the editor only — in the viewer they are buttons */
  #edit-psv .psv-marker { cursor: grab; }
  /* nothing else says "you can pick this up", so hover has to */
  #edit-psv .psv-marker:hover { filter: drop-shadow(0 0 7px rgba(10, 132, 255, 0.95)); }
  #edit-psv.dragging-hotspot, #edit-psv.dragging-hotspot .psv-marker { cursor: grabbing; }
  #edit-psv.dragging-hotspot .psv-marker { filter: drop-shadow(0 0 9px rgba(10, 132, 255, 1)); }

  /* shape picker */
  .shape-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .shape-btn {
    width: 38px; height: 38px; padding: 4px; display: grid; place-items: center;
    background: var(--canvas); border: 1px solid var(--hairline); border-radius: 9px;
  }
  .shape-btn img { width: 26px; height: 26px; display: block; }
  .shape-btn.on { border-color: var(--accent); background: rgba(10, 132, 255, 0.18); }
  .shape-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hs-panel .range-row > label { width: 52px; }
  .orphan { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex: none; }

  /* PSV overrides to match the house style */
  .psv-navbar { background: rgba(11, 11, 14, 0.72); backdrop-filter: blur(8px); }
  .psv-panel { background: rgba(18, 18, 22, 0.96); color: var(--text); }
  .psv-panel-content h2 { margin-top: 0; }
</style>

<body>
<div id="app"></div>
<script type="module">
import { Viewer, SYSTEM } from '@photo-sphere-viewer/core';
import { MarkersPlugin } from '@photo-sphere-viewer/markers-plugin';
import { VirtualTourPlugin } from '@photo-sphere-viewer/virtual-tour-plugin';
import { GalleryPlugin } from '@photo-sphere-viewer/gallery-plugin';
import { AutorotatePlugin } from '@photo-sphere-viewer/autorotate-plugin';
import { GyroscopePlugin } from '@photo-sphere-viewer/gyroscope-plugin';
import { StereoPlugin } from '@photo-sphere-viewer/stereo-plugin';

const app = document.getElementById('app');
const DEG = Math.PI / 180;
const REDUCED_MOTION = matchMedia('(prefers-reduced-motion: reduce)').matches;

let toastEl = null;
let toastTimer = null;
function toast(msg, isError = false) {
  clearTimeout(toastTimer);
  toastEl?.remove();
  toastEl = el(`<div class="toast${isError ? ' error' : ''}" role="status"></div>`);
  document.body.append(toastEl);
  /* set text a beat after insertion so screen readers announce the live region */
  setTimeout(() => { if (toastEl) toastEl.textContent = msg; }, 20);
  toastTimer = setTimeout(() => { toastEl?.remove(); toastEl = null; }, 3200);
}

/* ---------- tiny helpers ---------- */

async function api(method, path, body) {
  const opts = { method, headers: {} };
  if (body !== undefined) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  const res = await fetch(path, opts);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || `${res.status}`);
  return data;
}

/* An exported tour is a static folder: no API, media sits in ./files/ */
const STATIC_TOUR = window.ORBIT_STATIC_TOUR || null;

function fileUrl(tourId, name) {
  const safe = encodeURIComponent(name);
  return STATIC_TOUR ? `files/${safe}` : `/api/tours/${tourId}/files/${safe}`;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function el(html) {
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

const fmtDate = iso => iso ? new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) : '';

/* --- pure helpers begin (tests/tour_pano_test.mjs lifts this whole block) --- */

const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));

/* ---------- panorama geometry ----------

   A scene with no `pano` block is a full 360x180 equirect, the Insta360 export
   this app started with. Everything else — a phone sweep panorama, a partial
   photo sphere, an ordinary snapshot — covers only a slice of the sphere, and
   `pano` records which slice:

     hFov   how many degrees wide the photo is (30..360)
     pitch  elevation of the photo's centre, 0 = horizon

   The vertical field of view is not stored because it is not free: an
   equirectangular projection has the same degrees-per-pixel on both axes, so
   vFov = hFov / (width / height). One number, not two, and they can never
   disagree.

   PSV wants this expressed as a crop out of a virtual full-sphere image, so
   panoDataFor scales the real pixel size up to what the whole sphere would
   have measured and centres the crop inside it. */

const isPartial = scene => scene?.pano?.hFov > 0 && scene.pano.hFov < 359.5;

const vFovOf = (hFov, width, height) => (width ? hFov * height / width : 0);

/* Always a function, never undefined: PSV keeps the last function-valued
   panoData on its config and reuses it whenever a later setPanorama passes
   none, so a full-sphere scene loaded after a partial one would silently
   inherit the partial one's crop. Handing it a fresh closure every time is
   what stops that. Values are snapshotted here rather than read through the
   scene object, which undo replaces wholesale. */
/* Every scene reports a pose of zero, deliberately. A photo carrying
   GPano:PoseHeadingDegrees would otherwise have its whole sphere silently
   spun round by that many degrees (dataHelper.cleanPanoramaPose -> renderer
   .setPanoramaPose), which moves where yaw 0 points. That would leave two
   different meanings of yaw in one tour — image-centre for ordinary photos,
   true north for photo spheres — and the auto-linker would mis-aim every
   arrow on exactly the files with the best metadata. One convention instead:
   yaw 0 is always the centre of the photo, and where that centre points lives
   in scene.geo.heading where the linker can see it. */
const NO_POSE = { poseHeading: 0, posePitch: 0, poseRoll: 0 };

function panoDataFor(scene) {
  const p = isPartial(scene) ? { hFov: scene.pano.hFov, pitch: scene.pano.pitch || 0 } : null;
  return img => {
    /* the crop still comes from XMP when we have not overridden it */
    if (!p) return { ...NO_POSE };
    const { hFov, pitch } = p;
    const fullWidth = Math.round(img.width * 360 / hFov);
    const fullHeight = Math.round(fullWidth / 2);
    /* pitch is the elevation of the strip's centre: 0 puts the horizon halfway
       down the image, +20 means the photo was aimed 20 degrees up */
    const croppedY = Math.round(fullHeight * (90 - pitch) / 180 - img.height / 2);
    return {
      fullWidth,
      fullHeight,
      croppedWidth: img.width,
      croppedHeight: img.height,
      croppedX: Math.round((fullWidth - img.width) / 2),
      croppedY: clamp(croppedY, 0, Math.max(0, fullHeight - img.height)),
      ...NO_POSE,
    };
  };
}

/* ---------- reading what the camera wrote ----------

   Two things are worth pulling out of an uploaded photo, and both live in the
   first few dozen KB: the GPano XMP block (which states the covered slice
   exactly, so we never have to guess) and the EXIF GPS fix (which lets the
   auto-linker aim hotspots at where the next scene actually is).

   ponytail: hand-rolled instead of vendoring an EXIF library — this reads six
   XMP numbers and four EXIF tags and nothing else. Reach for a real parser
   only if we ever need lens data, timestamps, or maker notes. */

const META_SCAN_BYTES = 256 * 1024;

const xmpNumber = (text, tag) => {
  const m = text.match(new RegExp(`GPano:${tag}(?:>|=")\\s*(-?[\\d.]+)`));
  return m ? parseFloat(m[1]) : null;
};

/* GPano states the crop in pixels of the notional full sphere, which is
   exactly what we need — no guessing, no slider. */
function gpanoCoverage(text) {
  const fullW = xmpNumber(text, 'FullPanoWidthPixels');
  const fullH = xmpNumber(text, 'FullPanoHeightPixels');
  const cropW = xmpNumber(text, 'CroppedAreaImageWidthPixels');
  const cropH = xmpNumber(text, 'CroppedAreaImageHeightPixels');
  const cropY = xmpNumber(text, 'CroppedAreaTopPixels');
  if (!(fullW > 0 && fullH > 0 && cropW > 0 && cropH > 0)) return null;
  const hFov = 360 * cropW / fullW;
  const centreFromTop = (cropY ?? (fullH - cropH) / 2) + cropH / 2;
  /* PoseHeadingDegrees is defined exactly as EXIF GPSImgDirection is — the
     compass heading of the centre of the image — so it stands in when the
     EXIF tag is missing, which it often is on a photo sphere. */
  const heading = xmpNumber(text, 'PoseHeadingDegrees');
  return {
    hFov,
    pitch: 90 - 180 * centreFromTop / fullH,
    ...(Number.isFinite(heading) ? { heading: ((heading % 360) + 360) % 360 } : {}),
  };
}

/* The three containers reached the editor by different routes and each hides
   the same TIFF block somewhere else. Each walk returns the offset of that
   block, or null. */

const EXIF_MAGIC = 0x45786966; /* "Exif", followed by two zero bytes */

const fourCC = (view, at) =>
  String.fromCharCode(view.getUint8(at), view.getUint8(at + 1), view.getUint8(at + 2), view.getUint8(at + 3));

/* JPEG: a chain of APP segments, big-endian lengths that include themselves. */
function jpegTiff(view) {
  let off = 2;
  while (off + 4 <= view.byteLength) {
    if (view.getUint8(off) !== 0xFF) return null;
    const marker = view.getUint8(off + 1);
    if (marker === 0xDA || marker === 0xD9) return null; /* scan data starts; no EXIF */
    const size = view.getUint16(off + 2);
    if (size < 2) return null;
    if (marker === 0xE1 && off + 10 <= view.byteLength && view.getUint32(off + 4) === EXIF_MAGIC) {
      return off + 10; /* skip "Exif\0\0" */
    }
    off += 2 + size;
  }
  return null;
}

/* PNG: length-prefixed chunks; EXIF rides in `eXIf` as a bare TIFF block. */
function pngTiff(view) {
  let off = 8; /* past the signature */
  while (off + 12 <= view.byteLength) {
    const size = view.getUint32(off);
    if (fourCC(view, off + 4) === 'eXIf') return off + 8;
    if (fourCC(view, off + 4) === 'IDAT') return null; /* pixels start; nothing left to find */
    off += 12 + size; /* length + type + data + crc */
  }
  return null;
}

/* WebP: RIFF chunks, little-endian sizes, padded to even. Some writers keep
   the JPEG-style "Exif\0\0" prefix inside the chunk and some do not. */
function webpTiff(view) {
  let off = 12; /* past "RIFF" + size + "WEBP" */
  while (off + 8 <= view.byteLength) {
    const size = view.getUint32(off + 4, true);
    if (fourCC(view, off) === 'EXIF') {
      const start = off + 8;
      return start + 6 <= view.byteLength && view.getUint32(start) === EXIF_MAGIC ? start + 6 : start;
    }
    off += 8 + size + (size % 2); /* odd payloads carry a pad byte */
  }
  return null;
}

function findExifTiff(view) {
  if (view.byteLength < 16) return null;
  if (view.getUint16(0) === 0xFFD8) return jpegTiff(view);
  if (view.getUint32(0) === 0x89504E47 && view.getUint32(4) === 0x0D0A1A0A) return pngTiff(view);
  if (fourCC(view, 0) === 'RIFF' && fourCC(view, 8) === 'WEBP') return webpTiff(view);
  return null;
}

function readGps(buffer) {
  const view = new DataView(buffer);
  const base = findExifTiff(view);
  if (base === null || base + 8 > view.byteLength) return null;
  const le = view.getUint16(base) === 0x4949;
  const u16 = o => view.getUint16(o, le);
  const u32 = o => view.getUint32(o, le);
  if (u16(base + 2) !== 42) return null;

  /* every offset in a TIFF IFD is relative to `base`, and a truncated read
     would send us anywhere — bounds-check before every dereference */
  const entriesOf = ifd => {
    if (ifd + 2 > view.byteLength) return [];
    const n = u16(ifd);
    const out = [];
    for (let i = 0; i < n && ifd + 2 + i * 12 + 12 <= view.byteLength; i++) out.push(ifd + 2 + i * 12);
    return out;
  };
  let gpsIfd = null;
  for (const e of entriesOf(base + u32(base + 4))) {
    if (u16(e) === 0x8825) { gpsIfd = base + u32(e + 8); break; }
  }
  if (gpsIfd === null) return null;

  const rational = o => (o + 8 <= view.byteLength ? u32(o) / (u32(o + 4) || 1) : NaN);
  const dms = o => rational(o) + rational(o + 8) / 60 + rational(o + 16) / 3600;
  const out = {};
  for (const e of entriesOf(gpsIfd)) {
    const tag = u16(e);
    const at = base + u32(e + 8); /* rationals never fit the 4-byte inline slot */
    if (tag === 1 || tag === 3) out[tag === 1 ? 'latRef' : 'lonRef'] = String.fromCharCode(view.getUint8(e + 8));
    else if (tag === 2) out.lat = dms(at);
    else if (tag === 4) out.lon = dms(at);
    else if (tag === 17) out.heading = rational(at);
  }
  if (!Number.isFinite(out.lat) || !Number.isFinite(out.lon)) return null;
  const geo = {
    lat: +((out.latRef === 'S' ? -out.lat : out.lat).toFixed(7)),
    lon: +((out.lonRef === 'W' ? -out.lon : out.lon).toFixed(7)),
  };
  if (Number.isFinite(out.heading)) geo.heading = +(((out.heading % 360) + 360) % 360).toFixed(2);
  return geo;
}

/* Initial bearing from a to b, degrees clockwise from true north. */
function bearing(a, b) {
  const rad = Math.PI / 180;
  const dLon = (b.lon - a.lon) * rad;
  const lat1 = a.lat * rad;
  const lat2 = b.lat * rad;
  const y = Math.sin(dLon) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  return ((Math.atan2(y, x) / rad) + 360) % 360;
}

/* Equirectangular approximation — metres. Fine at tour scale (tens of metres). */
function metresBetween(a, b) {
  const rad = Math.PI / 180;
  const x = (b.lon - a.lon) * rad * Math.cos((a.lat + b.lat) / 2 * rad);
  const y = (b.lat - a.lat) * rad;
  return Math.hypot(x, y) * 6371000;
}

const wrap180 = deg => ((((deg + 180) % 360) + 360) % 360) - 180;

/* ---------- guessing where you can walk ----------

   Placing an arrow at the middle of the photo is a guess that knows nothing
   about the photo. This knows a little.

   The signal is not darkness. A doorway into an unlit room is darker than the
   wall around it, but a doorway onto a sunlit deck is brighter — so scoring
   raw brightness only works indoors and inverts outdoors. What both cases
   share is that an opening does not look like the wall either side of it. So
   each column is scored on how far it departs from the local average across
   its neighbours, which catches a dark gap in a bright wall and a bright gap
   in a dark one with the same arithmetic.

   The sun, and any window or lamp bright enough to bloom, is excluded first:
   it is the one bright thing that is reliably not somewhere you can walk.

   ponytail: brightness contrast on a 256x128 thumbnail, a few hundred
   microseconds and no dependencies. The real answer is a per-column
   floor-boundary regression (HorizonNet and its descendants), which needs a
   neural network — worth revisiting only if this proves too noisy in the
   field. Every angle it returns is a draggable suggestion, never a decision. */

const NAV_MIN_SEPARATION = 45;  /* PSV dims arrows closer than this anyway */
const NAV_MIN_SCORE = 18;       /* below this the scene is too flat to read */
/* Comparing a column against its neighbourhood leaves a weak echo either side
   of a real opening, because the neighbourhood average is dragged toward the
   opening while the column itself is not. Those echoes are always far weaker
   than what caused them, so a suggestion has to hold its own against the
   strongest thing in the photo — otherwise one doorway sprouts three arrows. */
const NAV_MIN_RELATIVE = 0.45;

function guessNavigableYaws(image, { count = 3, hFov = 360, tilt = 0 } = {}) {
  const W = image.width;
  const H = image.height;
  const d = image.data;
  if (!W || !H) return [];
  const vFov = hFov * H / W; /* one degrees-per-pixel scale on both axes */

  const lum = (x, y) => {
    const i = (y * W + x) * 4;
    return 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
  };
  const rowAt = deg => clamp(Math.round(H * (0.5 - (deg - tilt) / vFov)), 0, H - 1);

  /* a band either side of eye level, where an opening shows as a silhouette,
     and a second lower band that only corroborates — a puddle should not on
     its own decide where the tour walks */
  const columnMeans = (topDeg, botDeg) => {
    const top = rowAt(topDeg);
    const bot = Math.max(top + 1, rowAt(botDeg));
    const out = new Float64Array(W);
    for (let x = 0; x < W; x++) {
      let sum = 0;
      for (let y = top; y < bot; y++) sum += lum(x, y);
      out[x] = sum / (bot - top);
    }
    return out;
  };
  /* circular: a panorama has no left or right edge */
  const smooth = (arr, radius) => {
    const out = new Float64Array(W);
    for (let x = 0; x < W; x++) {
      let sum = 0;
      for (let k = -radius; k <= radius; k++) sum += arr[(x + k + W) % W];
      out[x] = sum / (2 * radius + 1);
    }
    return out;
  };

  const wall = smooth(columnMeans(20, -15), 3);
  const floor = smooth(columnMeans(-20, -50), 3);
  const wallBase = smooth(wall, Math.max(1, Math.round(W * 0.19)));
  const floorBase = smooth(floor, Math.max(1, Math.round(W * 0.19)));

  const score = new Float64Array(W);
  for (let x = 0; x < W; x++) {
    score[x] = Math.abs(wall[x] - wallBase[x]) + 0.5 * Math.abs(floor[x] - floorBase[x]);
  }

  /* Knock out the sun, and anything else blooming, plus a margin for glare.
     A sun is a bright thing that STANDS OUT from the sky around it, not merely
     the brightest thing present — under a flat overcast the brightest pixel is
     just sky, and treating it as glare would blank the whole panorama and
     leave the feature silently doing nothing on a dull day. So the exclusion
     only runs when something is genuinely brighter than the sky it sits in. */
  const skyTop = rowAt(85);
  const skyBot = Math.max(skyTop + 1, rowAt(25));
  const hist = new Uint32Array(256);
  for (let x = 0; x < W; x++) for (let y = skyTop; y < skyBot; y++) hist[lum(x, y) | 0]++;
  const total = W * (skyBot - skyTop);
  const percentile = fraction => {
    let seen = 0;
    for (let v = 255; v > 0; v--) {
      seen += hist[v];
      if (seen >= total * fraction) return v;
    }
    return 0;
  };
  const hot = percentile(0.005);
  const SUN_CONTRAST = 40;
  if (hot - percentile(0.5) >= SUN_CONTRAST) {
    const bloom = Math.max(1, Math.round(W * 0.023));
    for (let x = 0; x < W; x++) {
      let glaring = false;
      for (let y = skyTop; y < skyBot && !glaring; y++) if (lum(x, y) >= hot) glaring = true;
      if (glaring) for (let k = -bloom; k <= bloom; k++) score[(x + k + W) % W] = 0;
    }
  }

  const gap = Math.round(W * NAV_MIN_SEPARATION / 360);
  const apart = (a, b) => { const n = Math.abs(a - b) % W; return Math.min(n, W - n); };
  const floorScore = Math.max(NAV_MIN_SCORE, Math.max(...score) * NAV_MIN_RELATIVE);
  const picked = [];
  for (const x of [...score.keys()].sort((a, b) => score[b] - score[a])) {
    if (score[x] < floorScore || picked.length === count) break;
    if (!picked.some(p => apart(p, x) < gap)) picked.push(x);
  }
  return picked.map(x => +wrap180((x + 0.5) / W * hFov - hFov / 2).toFixed(2));
}

/* Nudge a direction we already believe in onto the nearest thing the photo
   suggests. Keeps the topology the GPS or the capture order decided, and only
   sharpens the angle — so a photo with nothing to say costs nothing. */
function snapToWay(yaw, ways, tolerance = 90) {
  if (!ways?.length) return yaw;
  let best = null;
  for (const w of ways) {
    const off = Math.abs(wrap180(w - yaw));
    if (off <= tolerance && (best === null || off < best.off)) best = { w, off };
  }
  return best ? best.w : yaw;
}

/* --- pure helpers end --- */

/* ---------- how a hotspot looks (no emoji, per house rules) ----------

   Shape, size and transparency live on the hotspot itself, so the editor and
   the viewer read the same three fields and cannot drift apart. All three are
   optional; a hotspot that has never been styled looks exactly as it always
   did.

   'arrow' is special: it means the viewer's own arrow lying flat on the floor,
   which is the right default for a link and is not something drawn here. Every
   other shape is generated below. */

const HOTSPOT_SHAPES = {
  arrow: null,
  circle: '<circle cx="20" cy="20" r="18" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2"/>',
  square: '<rect x="3" y="3" width="34" height="34" rx="8" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2"/>',
  diamond: '<path d="M20 1.5 38.5 20 20 38.5 1.5 20Z" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2"/>',
  ring: '<circle cx="20" cy="20" r="16.5" fill="none" stroke="#F2F2F7" stroke-width="3.5"/>',
  dot: '<circle cx="20" cy="20" r="9" fill="#F2F2F7" stroke="rgba(11,11,14,0.75)" stroke-width="2"/>',
};

const HOTSPOT_GLYPHS = {
  /* points up, not right: an arrow on a hotspot reads as "go this way", and
     the way is forward from where you are standing */
  link: '<path d="M20 27V14m0 0l-4.8 4.8M20 14l4.8 4.8" stroke="#F2F2F7" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  info: '<rect x="18.5" y="17" width="3" height="12" rx="1.5" fill="#F2F2F7"/><circle cx="20" cy="12" r="2.2" fill="#F2F2F7"/>',
  url: '<path d="M15 25L25 15M25 15h-7M25 15v7" stroke="#F2F2F7" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
};

const DEFAULT_SHAPE = { link: 'square', info: 'circle', url: 'circle' };
const DEFAULT_SIZE = 40;

const hotspotShape = h => {
  const shape = h.shape && HOTSPOT_SHAPES[h.shape] !== undefined ? h.shape : (DEFAULT_SHAPE[h.type] || 'circle');
  /* only a link can wear the floor arrow; anything else falls back to a badge */
  return shape === 'arrow' && h.type !== 'link' ? 'circle' : shape;
};
const hotspotSize = h => clamp(Math.round(h.size || DEFAULT_SIZE), 16, 128);
const hotspotOpacity = h => clamp(h.opacity ?? 1, 0.1, 1);

/* Returns null only for a link left as the floor arrow — the caller then lets
   the viewer draw its own. `dot` is deliberately bare: a glyph inside a 9px
   circle is a smudge.

   Transparency is painted INTO the drawing rather than set on the element,
   because the viewer rewrites the opacity of any two arrows that overlap, on
   every frame, to show which is nearer. An element-level fade would flicker
   away the moment two doorways came within 45 degrees of each other; a fade
   inside the picture survives, and the viewer's own dimming then reads on top
   of it as it was meant to. */
function hotspotIcon(h, forceShape) {
  const shape = forceShape || hotspotShape(h);
  const body = HOTSPOT_SHAPES[shape];
  if (!body) return null;
  const glyph = shape === 'dot' ? '' : (HOTSPOT_GLYPHS[h.type] || '');
  const fade = hotspotOpacity(h);
  const open = fade < 1 ? `<g opacity="${fade}">` : '';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">` +
    `${open}${body}${glyph}${open ? '</g>' : ''}</svg>`);
}

/* The viewer's stock arrow paints itself with the element's CSS colour, which
   nothing else touches — so for a link left as an arrow the fade rides in the
   alpha channel. 0.8 is the stock alpha, kept so full opacity still looks
   exactly like an untouched tour. */
const arrowColour = h => `rgba(255,255,255,${(0.8 * hotspotOpacity(h)).toFixed(3)})`;

/* What shows through where a partial panorama has no photo. Black reads as a
   broken viewer; sky above and ground below reads as a photo that simply did
   not reach that far, which is the truth. Kuula solves it the same way and
   for the same reason. Screen-space rather than sphere-space, which is exactly
   right when you tilt up or down and only approximate when you turn behind
   you — still far better than a hole. */
const sceneBackground = scene =>
  scene?.fill ? `linear-gradient(${scene.fill.top}, ${scene.fill.bottom})` : '#000';

/* Standing upright, a link arrow lives in the same visual space as a marker
   and one stored number means the same size on both. This was 2 while arrows
   lay on the floor at 80px against a marker's 40px. */
const ARROW_SCALE = 1;

const SHAPE_NAMES = {
  arrow: 'Arrow on the floor', circle: 'Circle', square: 'Square',
  diamond: 'Diamond', ring: 'Ring', dot: 'Dot',
};

/* shown only in the shape picker: the real one is drawn by the viewer in 3D */
const ARROW_PREVIEW = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">' +
  '<path d="M20 5 34 31H6Z" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2.4" stroke-linejoin="round"/></svg>');

const SAFE_URL = u => /^https?:\/\//i.test(u || '');

const NAV_PLANET_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6.5"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-18 12 12)"/></svg>';
const NAV_AUDIO_ON_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';
const NAV_AUDIO_OFF_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';

/* ---------- router ---------- */

const viewMatch = location.pathname.match(/^\/tour\/view\/([^/]+)/);
const editId = new URLSearchParams(location.search).get('edit');
if (STATIC_TOUR) {
  renderViewer(STATIC_TOUR.id);
} else if (viewMatch) {

} else if (editId) {

      <div id="tour-list" class="state-note">Loading tours&hellip;</div>

  });
  createRow.addEventListener('submit', async e => {
    e.preventDefault();
    const submitBtn = createRow.querySelector('[type=submit]');
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    try {
      const tour = await api('POST', '/api/tours', { name: createName.value.trim() || 'untitled tour' });

    } catch (err) {
      toast(`Could not create tour: ${err.message}`, true);
      submitBtn.disabled = false;
    }
  });

  const list = document.getElementById('tour-list');
  let tours;
  try {
    ({ tours } = await api('GET', '/api/tours'));
  } catch (err) {
    list.className = 'state-note error';
    list.textContent = `Could not load tours: ${err.message}. Is server.py running?`;

  list.className = 'tour-grid';
  list.innerHTML = '';
  if (!tours.length) {

    const first = (t.scenes || [])[0];

    const card = el(`

    card.querySelector('[data-act=edit]').addEventListener('click', () => location.href = `/tour?edit=${t.id}`);
    const dupBtn = card.querySelector('[data-act=duplicate]');
    dupBtn.addEventListener('click', async () => {
      dupBtn.disabled = true;
      try {
        const copy = await api('POST', `/api/tours/${t.id}/duplicate`);
        toast(`Created "${copy.name}"`);
        renderHome();
      } catch (err) {
        toast(`Duplicate failed: ${err.message}`, true);
        dupBtn.disabled = false;
      }
    });

    const delBtn = card.querySelector('[data-act=delete]');
    let armTimer = null;
    delBtn.addEventListener('click', async () => {
      if (!delBtn.classList.contains('danger-solid')) {
        /* two-step confirm: first click arms, second within 4s deletes */
        delBtn.classList.replace('danger-text', 'danger-solid');
        delBtn.textContent = 'Confirm delete?';
        armTimer = setTimeout(() => {
          delBtn.classList.replace('danger-solid', 'danger-text');
          delBtn.textContent = 'Delete';
        }, 4000);
        return;
      }
      clearTimeout(armTimer);
      try {
        await api('DELETE', `/api/tours/${t.id}`);
        card.remove();
        toast(`Deleted "${t.name}"`);
        if (!list.querySelector('.tour-card')) renderHome();
      } catch (err) {
        toast(`Delete failed: ${err.message}`, true);
        delBtn.classList.replace('danger-solid', 'danger-text');
        delBtn.textContent = 'Delete';
      }
    });
    list.append(card);
  }
}

/* ---------- viewer ---------- */

function sceneToNode(tour, scene) {
  const hotspots = scene.hotspots || [];
  return {
    id: scene.id,
    panorama: fileUrl(tour.id, scene.file),
    panoData: panoDataFor(scene),
    thumbnail: fileUrl(tour.id, scene.thumb || scene.file),
    name: esc(scene.name), /* gallery + arrow tooltips inject this via innerHTML */
    caption: `${esc(tour.name)} &mdash; ${esc(scene.name)}`,
    links: hotspots
      .filter(h => h.type === 'link' && tour.scenes.some(s => s.id === h.target)) /* dangling links must not brick the tour */
      .map(h => {
        /* a custom uploaded icon wins, then a chosen shape, then nothing at all
           — which leaves the viewer to draw its own arrow on the floor */
        const image = h.icon ? fileUrl(tour.id, h.icon) : hotspotIcon(h);
        const px = hotspotSize(h) * ARROW_SCALE;
        return {
          nodeId: h.target,
          position: { yaw: h.yaw * DEG, pitch: h.pitch * DEG },
          ...(h.label ? { name: esc(h.label) } : {}),
          arrowStyle: {
            ...(image ? { image } : {}),
            size: { width: px, height: px },
            /* a shape we drew already carries its fade; the stock arrow takes
               it through colour; only an uploaded icon has nowhere else to put
               it and must risk the viewer's own overlap dimming */
            style: h.icon ? { opacity: String(hotspotOpacity(h)) }
              : image ? {} : { color: arrowColour(h) },
          },
        };
      }),
    markers: hotspots.filter(h => h.type === 'info' || h.type === 'url').map(h => {
      const px = hotspotSize(h);
      const common = {
        id: h.id,
        position: { yaw: h.yaw * DEG, pitch: h.pitch * DEG },
        image: h.icon ? fileUrl(tour.id, h.icon) : hotspotIcon(h),
        size: { width: px, height: px },
        opacity: h.icon ? hotspotOpacity(h) : 1, /* a drawn shape is already faded */
      };
      if (h.type === 'url') {
        return {
          ...common,
          tooltip: esc(h.label || h.url || 'Open link'),
          data: SAFE_URL(h.url) ? { url: h.url } : {},
        };
      }
      const parts = [];
      if (h.image) parts.push(`<img src="${fileUrl(tour.id, h.image)}" alt="${esc(h.title || '')}" style="max-width:100%;border-radius:8px">`);
      if (h.text) parts.push(`<p style="white-space:pre-wrap">${esc(h.text)}</p>`);
      if (h.audio) parts.push(`<audio controls src="${fileUrl(tour.id, h.audio)}" style="width:100%"></audio>`);
      return {
        ...common,
        tooltip: esc(h.title || 'Info'),
        ...(parts.length ? { content: `<h2>${esc(h.title || '')}</h2>${parts.join('')}` } : {}),
      };
    }),
  };
}

async function renderViewer(tourId) {
  const embed = new URLSearchParams(location.search).has('embed');
  app.innerHTML = `<div class="center-note"><div class="spin"></div><div class="sub">Loading tour&hellip;</div></div>`;

  let tour;
  try {
    const res = STATIC_TOUR ? null : await fetch(`/api/tours/${tourId}`);
    if (res && res.status === 404) {
      app.innerHTML = `<div class="center-note">
        <div class="big">Tour not found</div>
        <div class="sub">It may have been deleted.</div>
        <a href="/tour">Back to your tours</a></div>`;
      return;
    }
    if (res && !res.ok) throw new Error(`server replied ${res.status}`);
    tour = STATIC_TOUR || await res.json();
  } catch (err) {
    app.innerHTML = `<div class="center-note">
      <div class="big">Could not load this tour</div>
      <div class="sub">${esc(err.message)}. Is server.py running?</div>
      <button class="btn" id="retry-btn">Try again</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', () => location.reload());
    return;
  }
  document.title = `${tour.name} — Orbit Tour`;

  if (!(tour.scenes || []).length) {
    app.innerHTML = `<div class="center-note">
      <div class="big">${esc(tour.name)}</div>
      <div class="sub">This tour has no scenes yet.${STATIC_TOUR ? '' : ' Open the editor and add 360&deg; photos.'}</div>
      ${STATIC_TOUR ? '' : `<a href="/tour?edit=${esc(tour.id)}">Open editor</a>`}</div>`;
    return;
  }

  const settings = tour.settings || {};
  app.innerHTML = `<div class="stage"><div id="psv"></div></div>`;
  const stage = app.firstElementChild;

  if (!embed) {
    stage.append(el(`<div class="tour-title">${esc(tour.name)}</div>`));
  }
  if (settings.logo) {
    const img = `<img src="${fileUrl(tour.id, settings.logo)}" alt="${esc(tour.name)}">`;
    stage.append(el(settings.logoLink
      ? `<a class="tour-logo" href="${esc(settings.logoLink)}" target="_blank" rel="noopener">${img}</a>`
      : `<div class="tour-logo">${img}</div>`));
  }

  /* background audio (starts on first gesture — browsers block autoplay) */
  let audioEl = null;
  let audioWanted = Boolean(settings.audio);
  if (settings.audio) {
    audioEl = new Audio(fileUrl(tour.id, settings.audio));
    audioEl.loop = true;
    const startOnce = () => { if (audioWanted) audioEl.play().catch(() => {}); };
    stage.addEventListener('pointerdown', startOnce, { once: true });
  }

  const nodes = tour.scenes.map(s => sceneToNode(tour, s));
  const startNodeId = tour.scenes.some(s => s.id === settings.startScene)
    ? settings.startScene
    : tour.scenes[0].id;

  /* reduced motion: no planet intro, no self-starting rotation — manual controls stay.
     A partial panorama has no nadir to look down into, so the planet intro would
     unfold onto empty sphere — skip it there whatever the setting says. */
  const startScene = tour.scenes.find(s => s.id === startNodeId);
  const littlePlanet = settings.littlePlanetIntro !== false && !REDUCED_MOTION && !isPartial(startScene);
  const autorotate = settings.autorotate === true && !REDUCED_MOTION;

  const navbar = [
    'autorotate',
    'zoom',
    {
      id: 'planet',
      title: 'Little planet',
      content: NAV_PLANET_SVG,
      onClick(viewer) {
        planetOn = !planetOn;
        viewer.setOption('fisheye', planetOn ? 2 : false);
      },
    },
  ];
  if (audioEl) {
    navbar.push({
      id: 'audio',
      title: 'Sound',
      content: NAV_AUDIO_ON_SVG,
      onClick(viewer) {
        audioWanted = !audioWanted;
        if (audioWanted) audioEl.play().catch(() => {}); else audioEl.pause();
        /* .content is getter-only on AbstractButton — write the DOM directly */
        viewer.navbar.getButton('audio').container.innerHTML = audioWanted ? NAV_AUDIO_ON_SVG : NAV_AUDIO_OFF_SVG;
      },
    });
  }
  navbar.push('gallery', 'caption', 'gyroscope', 'stereo', 'fullscreen');

  let planetOn = littlePlanet;

  const viewer = new Viewer({
    container: document.getElementById('psv'),
    loadingTxt: 'Loading panorama&hellip;',
    touchmoveTwoFingers: embed,
    mousewheelCtrlKey: embed,
    keyboard: embed ? 'fullscreen' : 'always',
    fisheye: littlePlanet ? 2 : false,
    canvasBackground: sceneBackground(startScene),
    defaultYaw: ((tour.scenes.find(s => s.id === startNodeId)?.view?.yaw) || 0) * DEG,
    defaultPitch: littlePlanet ? -90 * DEG : ((tour.scenes.find(s => s.id === startNodeId)?.view?.pitch) || 0) * DEG,
    navbar,
    plugins: [
      MarkersPlugin,
      [AutorotatePlugin, autorotate
        ? { autostartDelay: 4000, autorotateSpeed: `${settings.autorotateSpeed || 0.7}rpm`, autostartOnIdle: true }
        : { autostartDelay: null, autostartOnIdle: false, autorotateSpeed: '0.7rpm' }],
      [GalleryPlugin, { visibleOnLoad: false, thumbnailSize: { width: 120, height: 60 } }],
      GyroscopePlugin,
      StereoPlugin,
      [VirtualTourPlugin, {
        positionMode: 'manual',
        /* '3d' lays each arrow flat on the ground, which reads as a sticker
           stuck to the path and skews with the floor. '2d' stands them up
           facing the viewer, the way Street View does, so an arrow saying
           "forward" actually points up the screen. */
        renderMode: '2d',
        preload: true,
        /* rotation: the camera swinging round to face the link before the
           crossfade, which lands as a spin. Off — you walk forward, you do
           not pirouette. */
        transitionOptions: { effect: 'fade', rotation: false, speed: '20rpm', showLoader: true },
        nodes,
        startNodeId,
      }],
    ],
  });

  const virtualTour = viewer.getPlugin(VirtualTourPlugin);
  window.orbitTour = { viewer, virtualTour, tour }; // debug/editor handle

  /* a missing or unreadable panorama file should say so, not sit blank */
  viewer.addEventListener('panorama-error', () => {
    stage.querySelector('.load-error')?.remove();
    /* on a first-load failure the node never lands, so fall back to the start scene */
    let nodeId;
    try { nodeId = virtualTour.getCurrentNode()?.id; } catch { nodeId = null; }
    const scene = tour.scenes.find(s => s.id === (nodeId || startNodeId));
    stage.append(el(`<div class="load-error" role="alert">
      Could not load the photo for &ldquo;${esc(scene?.name || 'this scene')}&rdquo;.
    </div>`));
  });
  virtualTour.addEventListener('node-changed', () => stage.querySelector('.load-error')?.remove());

  /* URL hotspots open in a new tab */
  viewer.getPlugin(MarkersPlugin).addEventListener('select-marker', ({ marker }) => {
    if (SAFE_URL(marker.data?.url)) open(marker.data.url, '_blank', 'noopener');
  });

  /* little planet intro: unfold to normal view once loaded */
  let introPending = littlePlanet;
  if (littlePlanet) {
    const unfold = () => {
      if (!introPending) return;
      introPending = false;
      const start = performance.now();
      const D = 1400;
      const scene0 = tour.scenes.find(s => s.id === startNodeId);
      const targetPitch = (scene0?.view?.pitch ?? 0) * DEG;
      const startPitch = viewer.getPosition().pitch;
      const tick = now => {
        const t = Math.min(1, (now - start) / D);
        const e = 1 - Math.pow(1 - t, 3); /* ease-out cubic */
        viewer.setOption('fisheye', 2 * (1 - e) || false);
        viewer.rotate({ yaw: viewer.getPosition().yaw, pitch: startPitch + (targetPitch - startPitch) * e });
        if (t < 1) { requestAnimationFrame(tick); } else {
          planetOn = false;
          if (scene0?.view?.zoom != null) viewer.zoom(scene0.view.zoom);
        }
      };
      requestAnimationFrame(tick);
    };
    viewer.addEventListener('ready', () => setTimeout(unfold, 1100), { once: true });
    viewer.container.addEventListener('pointerdown', unfold, { once: true });
  }

  /* face each scene's stored initial view on entry (the intro owns the start pose) */
  /* Street View pushes forward into the way you picked rather than turning to
     look at it. Done as a CSS scale on the canvas rather than the viewer's own
     zoom animation: it rides the compositor, so it cannot be starved by the
     render loop the crossfade is already using, and it costs nothing when the
     browser would rather not animate. The class comes off on arrival and the
     same transition eases it back, which reads as settling into the new spot. */
  stage.addEventListener('click', e => {
    if (e.target.closest?.('.psv-virtual-tour-link')) stage.classList.add('stepping');
  }, true);

  virtualTour.addEventListener('node-changed', ({ node }) => {
    stage.classList.remove('stepping');
    const scene = tour.scenes.find(s => s.id === node.id);
    /* each scene brings its own sky and ground for the parts it does not cover */
    viewer.setOption('canvasBackground', sceneBackground(scene));
    if (introPending && node.id === startNodeId) return;
    /* always settle the zoom, or the push above would accumulate scene by scene */
    viewer.zoom(scene?.view?.zoom ?? 50);
    if (scene?.view) {
      viewer.rotate({ yaw: (scene.view.yaw || 0) * DEG, pitch: (scene.view.pitch || 0) * DEG });
    }
  });
}

/* ---------- editor ---------- */

/* The server answers a bad upload with its own list of file extensions, and a
   dead server answers with whatever fetch throws. Neither means anything to
   someone who just picked a photo. */
function uploadReason(err) {
  const msg = err?.message || String(err);
  if (/expected one of/i.test(msg)) {
    return 'that kind of file cannot be used here. Pictures need to be JPG, PNG or WebP; sound needs to be MP3, M4A or OGG.';
  }
  if (/fetch|network|load failed|failed to fetch/i.test(msg)) {
    return 'could not reach the server — is server.py still running?';
  }
  return msg;
}

const uploadProblem = (name, err) => `${name}: ${uploadReason(err)}`;

async function uploadFile(tourId, file) {
  const form = new FormData();
  form.append('file', file);
  const res = await fetch(`/api/tours/${tourId}/files`, { method: 'POST', body: form });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || `${res.status}`);
  return data.file;
}

const WEB_SAFE_IMAGE = file =>
  /^image\/(jpeg|png|webp)$/.test(file.type) || /\.(jpe?g|png|webp)$/i.test(file.name);

/* Never re-encode wider than this card can actually hold as a texture: past it
   the viewer scales the photo down anyway, so the extra pixels are weight with
   no picture in them. 16384 is both the usual hardware ceiling and the one
   Kuula enforced. Only the re-encode path is affected — a JPEG, PNG or WebP is
   uploaded byte for byte as it came off the camera. */
const MAX_PANO_WIDTH = Math.min(16384, SYSTEM.maxTextureWidth || 16384);

/* Big enough to stay sharp on the tour cards at 2x pixel density; the gallery
   strip only ever asks for 120. Costs about 80KB a scene. */
const THUMB_WIDTH = 1024;

/* Average the top and bottom strips of the photo, so the empty part of the
   sphere can wear the sky and ground the photo actually had. */
function edgeColours(bmp, aspect) {
  const w = 64;
  const h = Math.max(4, Math.round(w / aspect));
  const ctx = drawTo(bmp, w, h).getContext('2d');
  const band = Math.max(1, Math.round(h * 0.1));
  const mean = y0 => {
    const { data } = ctx.getImageData(0, y0, w, band);
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; }
    const n = data.length / 4;
    return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
  };
  return { top: mean(0), bottom: mean(h - band) };
}

function drawTo(bmp, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return canvas;
}

/* Read a dropped photo and work out what it is. Nothing is turned away for its
   shape any more: a 2:1 equirect, a phone sweep panorama and an ordinary
   snapshot all become scenes, they just cover different amounts of sphere.
   Returns the file to actually upload, the slice it covers (null = full 360),
   its GPS fix if it has one, and a thumbnail. */
async function preparePano(file) {
  const head = await file.slice(0, META_SCAN_BYTES).arrayBuffer();
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) {
    /* the caller names the file — repeating it here would double it up in the
       one-line-per-reason summary */
    throw new Error(/heic|heif/i.test(`${file.type} ${file.name}`)
      ? 'this browser cannot open HEIC photos. On iPhone, Settings > Camera > Formats > Most Compatible saves JPEGs instead, or share the photo through Files to convert it.'
      : 'that file is not an image this browser can open.');
  }
  const { width, height } = bmp;
  const aspect = width / height;

  /* latin1 never throws on binary, and every value we want is ASCII */
  const text = new TextDecoder('latin1').decode(head);
  const stated = text.includes('GPano:') ? gpanoCoverage(text) : null;
  let pano = null;
  if (stated) {
    /* the camera said exactly what it covered — no guessing needed */
    if (stated.hFov < 359.5) pano = { hFov: +stated.hFov.toFixed(1), pitch: +stated.pitch.toFixed(1) };
  } else if (Math.abs(aspect - 2) > 0.04) {
    /* ponytail: nothing to read, so guess from shape. A phone sees roughly 60
       degrees vertically whether it is sweeping a panorama or taking a plain
       photo, and an equirect shares its scale between both axes, so the width
       follows from the aspect ratio. It is only a guess, which is why the
       editor puts a slider next to it. Replace with a real estimate only if
       one ever becomes available from metadata. */
    pano = { hFov: clamp(Math.round(60 * aspect), 30, Math.min(360, Math.round(180 * aspect))), pitch: 0 };
  }

  /* read the photo once, while it is decoded and in hand, rather than
     re-fetching every panorama later when the linker runs */
  let ways = [];
  try {
    /* aspect has to survive the downscale — the band-to-pitch mapping is
       derived from it, so squashing a 5:1 strip into a 2:1 box would aim
       every band at the wrong part of the photo */
    const nw = 256;
    const nh = Math.max(8, Math.round(nw / aspect));
    const nav = drawTo(bmp, nw, nh).getContext('2d').getImageData(0, 0, nw, nh);
    ways = guessNavigableYaws(nav, { hFov: pano?.hFov ?? 360, tilt: pano?.pitch ?? 0 });
  } catch { ways = []; }

  let geo = null;
  try { geo = readGps(head); } catch { geo = null; }
  /* a photo sphere usually records its compass heading in XMP and not in EXIF */
  if (geo && !Number.isFinite(geo.heading) && Number.isFinite(stated?.heading)) {
    geo.heading = +stated.heading.toFixed(2);
  }

  /* a decoded 60-megapixel photo is a few hundred MB — release it even when
     the re-encode below gives up */
  try {
    const thumb = await new Promise(r =>
      drawTo(bmp, THUMB_WIDTH, Math.max(1, Math.round(THUMB_WIDTH / aspect))).toBlob(r, 'image/jpeg', 0.86));

    /* The author's browser opened this, but a visitor's may not — HEIC renders
       on Apple devices and nowhere else. Re-encode anything outside the three
       formats every browser reads. The covered slice is already measured, so
       losing the XMP in the round trip costs nothing. */
    let upload = file;
    if (!WEB_SAFE_IMAGE(file)) {
      const scale = Math.min(1, MAX_PANO_WIDTH / width);
      const jpeg = await new Promise(r =>
        drawTo(bmp, Math.round(width * scale), Math.round(height * scale)).toBlob(r, 'image/jpeg', 0.95));
      if (!jpeg) throw new Error('it could not be converted to a JPEG this browser can share.');
      upload = new File([jpeg], `${file.name.replace(/\.[^.]+$/, '')}.jpg`, { type: 'image/jpeg' });
    }
    return { thumb, pano, geo, ways, upload, width, height, converted: upload !== file, fill: edgeColours(bmp, aspect) };
  } finally {
    bmp.close();
  }
}

async function renderEditor(tourId) {
  app.innerHTML = `<div class="center-note"><div class="spin"></div><div class="sub">Loading editor&hellip;</div></div>`;
  let doc;
  try {
    doc = await api('GET', `/api/tours/${tourId}`);
  } catch {
    app.innerHTML = `<div class="center-note">
      <div class="big">Tour not found</div>
      <a href="/tour">Back to your tours</a></div>`;
    return;
  }
  document.title = `Editing ${doc.name} — Orbit Tour`;
  doc.settings = doc.settings || {};

  /* ----- state ----- */
  let curSceneId = doc.scenes[0]?.id || null;
  let placing = null;        // 'info' | 'url' | {move: hotspotId} | {link: sceneId} | null
  /* Never test `placing?.link` directly: when `placing` is the STRING 'link',
     `'link'.link` resolves to String.prototype.link — a legacy method that
     exists and is therefore truthy — so a plain link placement would be
     mistaken for an armed build-mode target and quietly refuse to place. */
  const armedTarget = () => (placing && typeof placing === 'object' ? placing.link : null) || null;
  let buildReturn = true;    // build mode: also lay the arrow back
  let lastStyle = null;      // shape/size/opacity the next hotspot inherits
  let saveTimer = null;
  let saveInFlight = false;
  let dirty = false;
  let editorViewer = null;   // created lazily when a scene exists
  let markers = null;

  const curScene = () => doc.scenes.find(s => s.id === curSceneId) || null;
  const newId = p => `${p}${Date.now().toString(36)}${Math.floor(Math.random() * 1e4).toString(36)}`;

  /* ----- undo -----
     Every mutation in this editor ends in scheduleSave(), so snapshotting the
     PREVIOUS state there catches all of them from one place instead of
     sprinkling snapshot() calls through every handler. */
  const UNDO_LIMIT = 40;
  const UNDO_COALESCE_MS = 700;
  const undoStack = [];
  const stateStr = () => JSON.stringify({ name: doc.name, settings: doc.settings, scenes: doc.scenes });
  let lastState = stateStr();
  let lastPushAt = -Infinity;

  function undo() {
    const prev = undoStack.pop();
    if (!prev) { toast('Nothing to undo'); return; }
    Object.assign(doc, JSON.parse(prev));
    lastState = prev; /* so scheduleSave below does not re-push what we just undid */
    if (!doc.scenes.some(s => s.id === curSceneId)) curSceneId = doc.scenes[0]?.id || null;
    closeHotspotPanel();
    setPlacing(null);
    scheduleSave();
    syncSettingsInputs();
    renderSceneList();
    renderMain();
    renderSceneShape();
    syncBuildMode();
    showCurrentScene();
    updateUndoButton();
    setLinkSummary('');
    toast('Undone');
  }

  function updateUndoButton() {
    const btn = document.getElementById('undo-btn');
    if (btn) btn.disabled = !undoStack.length;
  }

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
      if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return; /* let fields undo their own text */
      e.preventDefault();
      undo();
    }
  });

  /* ----- autosave ----- */
  function scheduleSave() {
    const now = stateStr();
    if (now !== lastState) {
      /* typing fires this per keystroke: within the coalesce window keep the
         snapshot already on the stack (the state before the burst began), so
         one Undo reverts the whole edit and typing cannot evict structural
         history from the 40-slot stack */
      const at = performance.now();
      if (at - lastPushAt > UNDO_COALESCE_MS) {
        undoStack.push(lastState);
        if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        lastPushAt = at;
      }
      lastState = now;
      updateUndoButton();
    }
    dirty = true;
    setStatus('saving', 'Unsaved changes…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 800);
  }
  async function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (saveInFlight) { scheduleSave(); return false; }
    saveInFlight = true;
    setStatus('saving', 'Saving…');
    try {
      const saved = await api('POST', `/api/tours/${doc.id}`, doc);
      doc.updated = saved.updated;
      dirty = false;
      setStatus('', 'Saved');
      return true;
    } catch (err) {
      setStatus('error', `Save failed: ${err.message} — retrying`);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 3000);
      return false;
    } finally {
      saveInFlight = false;
    }
  }
  window.addEventListener('beforeunload', e => {
    if (dirty || saveTimer) { e.preventDefault(); e.returnValue = ''; }
  });
  function setStatus(cls, txt) {
    const s = document.getElementById('save-status');
    if (s) { s.className = `save-status ${cls}`; s.textContent = txt; }
  }

  /* ----- layout ----- */
  app.innerHTML = `
    <div class="editor">
      <div class="side">
        <div class="side-head">
          <a class="back" href="/tour">&larr; All tours</a>
          <input class="name-input" id="tour-name" value="${esc(doc.name)}" maxlength="80" aria-label="Tour name">
          <div class="save-status" id="save-status">Saved</div>
        </div>
        <div class="side-section">
          <h3>Scenes</h3>
          <div id="scene-list"></div>
          <p class="scene-note" id="reach-notice"></p>
