     Shown as a bearing and a cardinal rather than a spinning rose: on a
     structure the useful sentence is "the fascia faces 118°", and a bearing is
     what gets written down. */
  if (tour.scenes.some(s => Number.isFinite(s.geo?.heading))) {
    const compass = el(`<div class="compass" role="img">
      <svg viewBox="0 0 40 40" width="34" height="34" aria-hidden="true">
        <circle cx="20" cy="20" r="17" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1.5"/>
        <g id="cmp-needle" style="transform-origin:20px 20px">
          <path d="M20 5 L24.6 21 L20 18.2 L15.4 21 Z" fill="#FF6B5E"/>
          <path d="M20 35 L15.4 19 L20 21.8 L24.6 19 Z" fill="rgba(255,255,255,.6)"/>
        </g>
      </svg><span class="cmp-read num"></span></div>`);
    stage.append(compass);
    const needle = compass.querySelector('#cmp-needle');
    const read = compass.querySelector('.cmp-read');
    const CARDINALS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    const updateCompass = () => {
      let nodeId;
      try { nodeId = virtualTour.getCurrentNode()?.id; } catch { nodeId = null; }
      const scene = tour.scenes.find(s => s.id === (nodeId || startNodeId));
      const h = scene?.geo?.heading;
      /* a scene with no heading in a tour that has some: say nothing rather
         than show the previous scene's bearing as if it were this one's */
      compass.hidden = !Number.isFinite(h);
      if (compass.hidden) return;
      const facing = (((h + viewer.getPosition().yaw / DEG) % 360) + 360) % 360;
      needle.style.transform = `rotate(${-facing}deg)`;
      read.textContent = `${Math.round(facing)}° ${CARDINALS[Math.round(facing / 45) % 8]}`;
      compass.setAttribute('aria-label', `Facing ${Math.round(facing)} degrees, ${CARDINALS[Math.round(facing / 45) % 8]}`);
    };
    viewer.addEventListener('position-updated', updateCompass);
    virtualTour.addEventListener('node-changed', updateCompass);
    viewer.addEventListener('ready', updateCompass, { once: true });
  }

  /* little planet intro: unfold to normal view once loaded */
  let introPending = littlePlanet;
  if (littlePlanet) {
    const unfold = () => {
      if (!introPending) return;
      introPending = false;
      const start = performance.now();
      const D = 1400;
      const scene0 = tour.scenes.find(s => s.id === startNodeId);
      const targetPitch = (scene0?.view?.pitch ?? 0) * DEG;
      const startPitch = viewer.getPosition().pitch;
      const tick = now => {
        const t = Math.min(1, (now - start) / D);
        const e = 1 - Math.pow(1 - t, 3); /* ease-out cubic */
        viewer.setOption('fisheye', 2 * (1 - e) || false);
        viewer.rotate({ yaw: viewer.getPosition().yaw, pitch: startPitch + (targetPitch - startPitch) * e });
        if (t < 1) { requestAnimationFrame(tick); } else {
          planetOn = false;
          if (scene0?.view?.zoom != null) viewer.zoom(scene0.view.zoom);
        }
      };
      requestAnimationFrame(tick);
    };
    viewer.addEventListener('ready', () => setTimeout(unfold, 1100), { once: true });
    viewer.container.addEventListener('pointerdown', unfold, { once: true });
  }

  /* face each scene's stored initial view on entry (the intro owns the start pose) */
  /* Street View pushes forward into the way you picked rather than turning to
     look at it. Done as a CSS scale on the canvas rather than the viewer's own
     zoom animation: it rides the compositor, so it cannot be starved by the
     render loop the crossfade is already using, and it costs nothing when the
     browser would rather not animate. The class comes off on arrival and the
     same transition eases it back, which reads as settling into the new spot. */
  stage.addEventListener('click', e => {
    if (e.target.closest?.('.psv-virtual-tour-link')) stage.classList.add('stepping');
  }, true);

  if (!embed) {
    addEventListener('hashchange', () => {
      const id = sceneIdFromHash();
      let current;
      try { current = virtualTour.getCurrentNode()?.id; } catch { current = null; }
      if (id && id !== current && tour.scenes.some(s => s.id === id)) virtualTour.setCurrentNode(id);
    });
  }

  virtualTour.addEventListener('node-changed', ({ node }) => {
    stage.classList.remove('stepping');
    /* replaceState, not pushState: this viewer runs inside an iframe both for
       Start tour and for every ?embed=1 on someone else's page, and pushing
       from a frame writes into the PARENT's history — so Back would step
       through scenes instead of leaving the page it is embedded on. The
       plugin also fires this once on init, which replaceState makes harmless. */
    if (!embed) history.replaceState(null, '', `#s=${encodeURIComponent(node.id)}`);
    const scene = tour.scenes.find(s => s.id === node.id);
    /* each scene brings its own sky and ground for the parts it does not cover */
    viewer.setOption('canvasBackground', sceneBackground(scene));
    if (introPending && node.id === startNodeId) return;
    /* always settle the zoom, or the push above would accumulate scene by scene */
    viewer.zoom(scene?.view?.zoom ?? 50);
    if (scene?.view) {
      viewer.rotate({ yaw: (scene.view.yaw || 0) * DEG, pitch: (scene.view.pitch || 0) * DEG });
    }
  });
}

/* ---------- editor ---------- */

/* The server answers a bad upload with its own list of file extensions, and a
   dead server answers with whatever fetch throws. Neither means anything to
   someone who just picked a photo. */
function uploadReason(err) {
  const msg = err?.message || String(err);
  if (/expected one of/i.test(msg)) {
    return 'that kind of file cannot be used here. Pictures need to be JPG, PNG or WebP; sound needs to be MP3, M4A or OGG.';
  }
  if (/fetch|network|load failed|failed to fetch/i.test(msg)) {
    return 'could not reach the server — is server.py still running?';
  }
  return msg;
}

const uploadProblem = (name, err) => `${name}: ${uploadReason(err)}`;

async function uploadFile(tourId, file) {
  const form = new FormData();
  form.append('file', file);
  const res = await fetch(`/api/tours/${tourId}/files`, { method: 'POST', body: form });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.detail || data.error || `${res.status}`);
  return data.file;
}

const WEB_SAFE_IMAGE = file =>
  /^image\/(jpeg|png|webp)$/.test(file.type) || /\.(jpe?g|png|webp)$/i.test(file.name);

/* Never re-encode wider than this card can actually hold as a texture: past it
   the viewer scales the photo down anyway, so the extra pixels are weight with
   no picture in them. 16384 is both the usual hardware ceiling and the one
   Kuula enforced. Only the re-encode path is affected — a JPEG, PNG or WebP is
   uploaded byte for byte as it came off the camera. */
const MAX_PANO_WIDTH = Math.min(16384, SYSTEM.maxTextureWidth || 16384);

/* Big enough to stay sharp on the tour cards at 2x pixel density; the gallery
   strip only ever asks for 120. Costs about 80KB a scene. */
const THUMB_WIDTH = 1024;

/* Average the top and bottom strips of the photo, so the empty part of the
   sphere can wear the sky and ground the photo actually had. */
function edgeColours(bmp, aspect) {
  const w = 64;
  const h = Math.max(4, Math.round(w / aspect));
  const ctx = drawTo(bmp, w, h).getContext('2d');
  const band = Math.max(1, Math.round(h * 0.1));
  const mean = y0 => {
    const { data } = ctx.getImageData(0, y0, w, band);
    let r = 0, g = 0, b = 0;
    for (let i = 0; i < data.length; i += 4) { r += data[i]; g += data[i + 1]; b += data[i + 2]; }
    const n = data.length / 4;
    return `rgb(${Math.round(r / n)},${Math.round(g / n)},${Math.round(b / n)})`;
  };
  return { top: mean(0), bottom: mean(h - band) };
}

function drawTo(bmp, w, h) {
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
  return canvas;
}

/* Read a dropped photo and work out what it is. Nothing is turned away for its
   shape any more: a 2:1 equirect, a phone sweep panorama and an ordinary
   snapshot all become scenes, they just cover different amounts of sphere.
   Returns the file to actually upload, the slice it covers (null = full 360),
   its GPS fix if it has one, and a thumbnail. */
async function preparePano(file) {
  const head = await file.slice(0, META_SCAN_BYTES).arrayBuffer();
  const bmp = await createImageBitmap(file).catch(() => null);
  if (!bmp) {
    /* the caller names the file — repeating it here would double it up in the
       one-line-per-reason summary */
    throw new Error(/heic|heif/i.test(`${file.type} ${file.name}`)
      ? 'this browser cannot open HEIC photos. On iPhone, Settings > Camera > Formats > Most Compatible saves JPEGs instead, or share the photo through Files to convert it.'
      : 'that file is not an image this browser can open.');
  }
  const { width, height } = bmp;
  const aspect = width / height;

  /* latin1 never throws on binary, and every value we want is ASCII */
  const text = new TextDecoder('latin1').decode(head);
  const stated = text.includes('GPano:') ? gpanoCoverage(text) : null;
  let pano = null;
  if (stated) {
    /* the camera said exactly what it covered — no guessing needed */
    if (stated.hFov < 359.5) pano = { hFov: +stated.hFov.toFixed(1), pitch: +stated.pitch.toFixed(1) };
  } else if (Math.abs(aspect - 2) > 0.04) {
    /* ponytail: nothing to read, so guess from shape. A phone sees roughly 60
       degrees vertically whether it is sweeping a panorama or taking a plain
       photo, and an equirect shares its scale between both axes, so the width
       follows from the aspect ratio. It is only a guess, which is why the
       editor puts a slider next to it. Replace with a real estimate only if
       one ever becomes available from metadata. */
    pano = { hFov: clamp(Math.round(60 * aspect), 30, Math.min(360, Math.round(180 * aspect))), pitch: 0 };
  }

  /* read the photo once, while it is decoded and in hand, rather than
     re-fetching every panorama later when the linker runs */
  let ways = [];
  let profile = null;
  try {
    /* aspect has to survive the downscale — the band-to-pitch mapping is
       derived from it, so squashing a 5:1 strip into a 2:1 box would aim
       every band at the wrong part of the photo */
    const nw = 256;
    const nh = Math.max(8, Math.round(nw / aspect));
    const nav = drawTo(bmp, nw, nh).getContext('2d').getImageData(0, 0, nw, nh);
    profile = panoProfile(nav, { hFov: pano?.hFov ?? 360, tilt: pano?.pitch ?? 0 });
    ways = guessNavigableYaws(profile);
  } catch { profile = null; ways = []; }

  let geo = null;
  try { geo = readGps(head); } catch { geo = null; }
  /* read separately from the GPS, because a photo can carry a timestamp and no
     fix and readGps returns null for the whole thing when there is no fix */
  let shot = null;
  try { shot = readShotTime(head); } catch { shot = null; }
  /* a photo sphere usually records its compass heading in XMP and not in EXIF */
  if (geo && !Number.isFinite(geo.heading) && Number.isFinite(stated?.heading)) {
    geo.heading = +stated.heading.toFixed(2);
    geo.headingRef = 'T'; /* GPano defines PoseHeadingDegrees against true north */
  }

  /* The sun goes last, because it only ever fills a gap or raises a doubt — it
     never quietly replaces a heading the camera recorded. Where the camera
     wrote a MAGNETIC bearing the two are both kept: a magnetic reading taken
     beside a steel girder can be tens of degrees out, and the inspector is the
     one who should decide which to believe, having been shown both. */
  if (geo) {
    const solar = solarHeading(profile?.sun, geo);
    if (Number.isFinite(geo.heading)) {
      geo.headingFrom = geo.headingRef === 'M' ? 'magnetic' : 'recorded';
      if (solar !== null) geo.sunHeading = solar;
    } else if (solar !== null) {
      geo.heading = solar;
      geo.headingFrom = 'sun';
    }
  }

  /* a decoded 60-megapixel photo is a few hundred MB — release it even when
     the re-encode below gives up */
  try {
    const thumb = await new Promise(r =>
      drawTo(bmp, THUMB_WIDTH, Math.max(1, Math.round(THUMB_WIDTH / aspect))).toBlob(r, 'image/jpeg', 0.86));

    /* The author's browser opened this, but a visitor's may not — HEIC renders
       on Apple devices and nowhere else. Re-encode anything outside the three
       formats every browser reads. The covered slice is already measured, so
       losing the XMP in the round trip costs nothing. */
    let upload = file;
    if (!WEB_SAFE_IMAGE(file)) {
      const scale = Math.min(1, MAX_PANO_WIDTH / width);
      const jpeg = await new Promise(r =>
        drawTo(bmp, Math.round(width * scale), Math.round(height * scale)).toBlob(r, 'image/jpeg', 0.95));
      if (!jpeg) throw new Error('it could not be converted to a JPEG this browser can share.');
      upload = new File([jpeg], `${file.name.replace(/\.[^.]+$/, '')}.jpg`, { type: 'image/jpeg' });
    }
    return {
      thumb, pano, geo, shot, ways, upload, width, height,
      converted: upload !== file, fill: edgeColours(bmp, aspect),
      prof: packProfile(profile), open: openingView(profile),
      vehicle: profile?.vehicle || null,
    };
  } finally {
    bmp.close();
  }
}

async function renderEditor(tourId) {
  app.innerHTML = `<div class="center-note"><div class="spin"></div><div class="sub">Loading editor&hellip;</div></div>`;
  let doc;
  try {
    doc = await api('GET', `/api/tours/${tourId}`);
  } catch {
    app.innerHTML = `<div class="center-note">
      <div class="big">Tour not found</div>
      <a href="/tour">Back to your tours</a></div>`;
    return;
  }
  document.title = `Editing ${doc.name} — Orbit Tour`;
  doc.settings = doc.settings || {};

  /* ----- state -----
     The tour already has a URL (/tour?edit=<id>), so a refresh keeps you in the
     editor. What it did not keep was WHICH photo you were on, which on a
     forty-scene bridge is most of the cost of a reload. The scene rides in the
     fragment: it never reaches the server, so no route has to learn about it,
     and the standalone export keeps scene ids byte-for-byte, so a link shared
     from the editor still resolves inside the exported site. */
  const sceneFromHash = () => {
    const want = sceneIdFromHash();
    return doc.scenes.some(s => s.id === want) ? want : null;
  };
  let curSceneId = sceneFromHash() || doc.scenes[0]?.id || null;
  let placing = null;        // 'info' | 'url' | {move: hotspotId} | {link: sceneId} | null
  /* Never test `placing?.link` directly: when `placing` is the STRING 'link',
     `'link'.link` resolves to String.prototype.link — a legacy method that
     exists and is therefore truthy — so a plain link placement would be
     mistaken for an armed build-mode target and quietly refuse to place. */
  const armedTarget = () => (placing && typeof placing === 'object' ? placing.link : null) || null;
  let buildReturn = true;    // build mode: also lay the arrow back
  let lastStyle = null;      // shape/size/opacity the next hotspot inherits
  let saveTimer = null;
  let saveInFlight = false;
  let dirty = false;
  let editorViewer = null;   // created lazily when a scene exists
  let markers = null;

  const curScene = () => doc.scenes.find(s => s.id === curSceneId) || null;
  /* which scene groups the user has folded away, so a re-render keeps them shut */
  const collapsedStops = new Set();
  const newId = p => `${p}${Date.now().toString(36)}${Math.floor(Math.random() * 1e4).toString(36)}`;

  /* ----- undo -----
     Every mutation in this editor ends in scheduleSave(), so snapshotting the
     PREVIOUS state there catches all of them from one place instead of
     sprinkling snapshot() calls through every handler. */
  const UNDO_LIMIT = 40;
  const UNDO_COALESCE_MS = 700;
  const undoStack = [];
  const stateStr = () => JSON.stringify({ name: doc.name, settings: doc.settings, scenes: doc.scenes });
  let lastState = stateStr();
  let lastPushAt = -Infinity;

  /* Redo rides the same snapshot stack. It matters more than it sounds: undo
     alone means a mistaken Ctrl+Z is unrecoverable, which is the scarier half.
     The redo stack is cleared by a genuine new edit only — see scheduleSave,
     where the clear sits inside the `now !== lastState` branch, so replaying
     history does not wipe the future. */
  const redoStack = [];

  function applyState(str, message) {
    Object.assign(doc, JSON.parse(str));
    lastState = str; /* so scheduleSave below does not re-push what we just replayed */
    if (!doc.scenes.some(s => s.id === curSceneId)) curSceneId = doc.scenes[0]?.id || null;
    closeHotspotPanel();
    setPlacing(null);
    scheduleSave();
    syncSettingsInputs();
    renderSceneList();
    renderMain();
    renderSceneShape();
    syncBuildMode();
    showCurrentScene();
    updateUndoButton();
    setLinkSummary('');
    toast(message);
  }

  function undo() {
    const prev = undoStack.pop();
    if (!prev) { toast('Nothing to undo'); return; }
    redoStack.push(stateStr());
    applyState(prev, 'Undone');
  }

  function redo() {
    const next = redoStack.pop();
    if (!next) { toast('Nothing to redo'); return; }
    undoStack.push(stateStr());
    applyState(next, 'Redone');
  }

  function updateUndoButton() {
    const u = document.getElementById('undo-btn');
    if (u) u.disabled = !undoStack.length;
    const r = document.getElementById('redo-btn');
    if (r) r.disabled = !redoStack.length;
  }

  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (k !== 'z' && k !== 'y') return;
    if (isTextField(e)) return; /* let text fields undo their own text */
    e.preventDefault();
    if (k === 'y' || e.shiftKey) redo(); else undo();
  });

  /* ----- autosave ----- */
  function scheduleSave() {
    const now = stateStr();
    if (now !== lastState) {
      /* typing fires this per keystroke: within the coalesce window keep the
         snapshot already on the stack (the state before the burst began), so
         one Undo reverts the whole edit and typing cannot evict structural
         history from the 40-slot stack */
      const at = performance.now();
      if (at - lastPushAt > UNDO_COALESCE_MS) {
        undoStack.push(lastState);
        if (undoStack.length > UNDO_LIMIT) undoStack.shift();
        lastPushAt = at;
      }
      lastState = now;
      /* preflight is derived from the whole document, and measuring a defect or
         deleting one only calls scheduleSave — so this is the choke point that
         keeps the check honest between structural re-renders */
      renderPreflight();
      /* Inside this branch on purpose: a real edit invalidates the future, but
         undo() and redo() both set lastState before calling here, so replaying
         history lands outside it and the stacks survive. */
      redoStack.length = 0;
      updateUndoButton();
    }
    dirty = true;
    setStatus('saving', 'Unsaved changes…');
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 800);
  }
  async function saveNow() {
    clearTimeout(saveTimer); saveTimer = null;
    if (saveInFlight) { scheduleSave(); return false; }
    saveInFlight = true;
    setStatus('saving', 'Saving…');
    try {
      const saved = await api('POST', `/api/tours/${doc.id}`, doc);
      doc.updated = saved.updated;
      dirty = false;
      setStatus('', 'Saved');
      return true;
    } catch (err) {
      /* Someone else saved this tour since we loaded it. Retrying would just
         lose one of the two sets of edits, so stop the loop and hand the
         decision over — nothing local is discarded either way. Adopting the
         server's stamp means the NEXT save goes through, so "save again" is a
         deliberate overwrite rather than a fight with the retry timer. */
      if (err.status === 409) {
        const fresh = await api('GET', `/api/tours/${doc.id}`).catch(() => null);
        if (fresh) doc.updated = fresh.updated;
        clearTimeout(saveTimer); saveTimer = null;
        setStatus('error', 'Changed in another tab — your edits are safe. Save again to overwrite.');
        toast('This tour was edited somewhere else. Your changes are still here — press S to overwrite, or reload to take theirs.', true);
        return false;
      }
      setStatus('error', `Save failed: ${err.message} — retrying`);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(saveNow, 3000);
      return false;
    } finally {
      saveInFlight = false;
    }
  }
  window.addEventListener('beforeunload', e => {
    if (dirty || saveTimer) { e.preventDefault(); e.returnValue = ''; }
  });
  function setStatus(cls, txt) {
    const s = document.getElementById('save-status');
    /* Guarded: scheduleSave fires per keystroke and writing the identical
       string back still mutates the node, so a polite live region announced
       "Unsaved changes…" once per character typed. */
    if (s && s.textContent !== txt) { s.className = `save-status ${cls}`; s.textContent = txt; }
    else if (s) s.className = `save-status ${cls}`;
  }

  /* ----- layout ----- */
  app.innerHTML = `
    <div class="editor">
      <a class="skip" href="#main-pane">Skip to the panorama</a>
      <button class="btn drawer-toggle" id="drawer-toggle" aria-expanded="false" aria-controls="side-panel">Panels</button>
      <div class="drawer-scrim" id="drawer-scrim"></div>
      <div class="side" id="side-panel">
        <div class="side-head">
          <a class="back" href="/tour">&larr; All tours</a>
          <input class="name-input" id="tour-name" value="${esc(doc.name)}" maxlength="80" aria-label="Tour name">
          <div class="save-status" id="save-status" role="status" aria-live="polite">Saved</div>
        </div>
        <details class="side-section insp" id="insp-section">
          <summary>Inspection<span class="insp-tally num" id="insp-tally"></span></summary>
          <div class="frow"><label for="insp-structure">Structure ID</label>
            <input type="text" id="insp-structure" maxlength="60" placeholder="e.g. 12-0034-0250-1234"></div>
          <div class="frow"><label for="insp-date">Inspection date</label>
            <input type="date" id="insp-date"></div>
          <div class="frow"><label for="insp-by">Inspected by</label>
            <input type="text" id="insp-by" maxlength="80"></div>
          <div class="frow"><label for="insp-sheet">Sheet</label>
            <input type="text" id="insp-sheet" maxlength="20" placeholder="1 of 1"></div>
          <h4 class="cov-head">Required photo stops</h4>
          <ul class="cov" id="cov-list"></ul>
          <p class="scene-note">A tick means a photo is <em>filed</em> against that stop — not that it
            shows it. This supplements the inspection record; it does not replace hands-on judgement.</p>
        </details>
        <div class="side-section">
          <h3>Scenes</h3>
          <div id="scene-list" role="navigation" aria-label="Scenes"></div>
          <p class="scene-note" id="reach-notice"></p>
          <div class="drop-zone" id="drop-zone" role="button" tabindex="0">
            <span id="drop-label">Drop photos here<br>or click to choose</span>
            <input type="file" id="file-input" accept="image/*,.heic,.heif" multiple hidden>
          </div>
          <p class="scene-note" id="drop-notice"></p>
          <button class="btn" id="auto-link" style="width:100%;margin-top:10px">Connect scenes for me</button>
          <button class="btn" id="sort-shot" style="width:100%;margin-top:8px" hidden>Order by capture time</button>
          <p class="scene-note" id="link-summary"></p>
          <details class="plan" id="plan-section" open>
            <summary>Plan view<span class="plan-span num" id="plan-span"></span><button
              type="button" class="icon-btn" id="plan-expand" title="Open full size (M)"
              aria-label="Open the map full size">&#x2922;</button></summary>
            <p class="scene-note plan-how" id="plan-how"></p>
            <div class="plan-box" id="plan-box"></div>
            <p class="scene-note" id="plan-note"></p>
            <button class="btn" id="plan-aim" hidden>Work out the missing bearings</button>
            <button class="btn" id="plan-reset" hidden>Undo my placements</button>
          </details>
        </div>
        <div class="side-section" id="scene-section" hidden>
          <h3>This scene</h3>
          <div id="scene-meta"></div>
          <div id="scene-shape"></div>
        </div>
        <datalist id="element-list">${ELEMENT_SUGGESTIONS.map(x => `<option value="${esc(x)}">`).join('')}</datalist>
        <div class="side-section">
          <h3>Tour settings</h3>
          <div class="field"><label for="set-autorotate">Autorotate</label><input type="checkbox" id="set-autorotate"></div>
          <div class="field"><label for="set-speed">Speed (rpm)</label><input type="number" id="set-speed" min="0.1" max="3" step="0.1"></div>
          <div class="field"><label for="set-planet">Little planet intro</label><input type="checkbox" id="set-planet"></div>
          <div class="field"><label>Logo</label><span class="file-line" id="logo-line"></span></div>
          <div class="field"><label for="set-logolink">Logo link</label><input type="url" id="set-logolink" placeholder="https://"></div>
          <div class="field"><label>Background audio</label><span class="file-line" id="audio-line"></span></div>
        </div>
        <div class="side-section">
          <h3>Share</h3>
          <details class="preflight" id="preflight">
            <summary>Check before sharing<span class="pf-count num" id="pf-count"></span></summary>
            <ul class="pf-list" id="pf-list"></ul>
          </details>
          <button class="btn" id="preview-btn">Preview tour</button>
          <div class="share-row">
            <label for="share-link">Link</label>
            <div class="copy">
              <input id="share-link" readonly value="${esc(location.origin)}/tour/view/${esc(doc.id)}">
              <button class="btn" id="copy-link" aria-label="Copy tour link">Copy</button>
            </div>
          </div>
          <div class="share-row">
            <label for="embed-code">Embed on a website</label>
            <div class="copy">
              <textarea id="embed-code" readonly rows="4"></textarea>
              <button class="btn" id="copy-embed" aria-label="Copy embed code">Copy</button>
            </div>
          </div>
          <div class="share-row">
            <a class="btn" id="export-btn" href="/api/tours/${esc(doc.id)}/export.zip" download>Download standalone site</a>
          </div>
          <div class="share-row">
            <button class="btn" id="register-btn">Download defect register (CSV)</button>
            <p class="scene-note" id="register-note"></p>
          </div>
          <div class="share-row">
            <button class="btn" id="print-btn">Print photo log</button>
          </div>
        </div>
      </div>
      <div class="main-pane" id="main-pane" tabindex="-1"></div>
    </div>`;

  /* ----- the sidebar becomes a drawer on a tablet -----
     Deliberately a class rather than the popover attribute. The UA sheet for
     [popover] sets height, margin, padding, border and color unconditionally
     at every width, so keeping the desktop layout would mean re-resetting all
     of them; and `querySelector(':popover-open')` throws SyntaxError on an
     engine that lacks it — an iPad on iOS 16, which is exactly the tablet this
     is for, and it would take Escape and Undo down with it. Eight lines and a
     class work everywhere. */
  const editorRoot = app.querySelector('.editor');
  const drawerBtn = document.getElementById('drawer-toggle');
  /* Gated on the toggle being on screen. The class alone outlived the
     breakpoint — open the drawer on a tablet, attach a keyboard or rotate to a
     width where the toggle is display:none, and every shortcut stayed dead with
     no way left to clear it. */
  const drawerOpen = () => editorRoot.classList.contains('panels-open')
    && getComputedStyle(drawerBtn).display !== 'none';
  function setDrawer(open) {
    editorRoot.classList.toggle('panels-open', open);
    drawerBtn.setAttribute('aria-expanded', String(open));
  }
  drawerBtn.addEventListener('click', () => setDrawer(!drawerOpen()));

  /* Pasting a colleague's deep link into an already-open tab changes only the
     fragment, which fires no navigation — without this the address bar updated
     and the editor stayed where it was. Guarded on a real change so the
     replaceState in selectScene cannot loop back through here. */
  addEventListener('hashchange', () => {
    const id = sceneFromHash();
    if (id && id !== curSceneId) selectScene(id);
  });
  document.getElementById('drawer-scrim').addEventListener('click', () => setDrawer(false));

  /* Shared keyboard guards. Split rather than one selector list on purpose:
     a single querySelector('dialog[open], .side:popover-open') raises on an
     engine missing either component and kills every shortcut at once. */
  const isField = e => !!e?.target?.closest?.('input, textarea, select, [contenteditable]');
  /* Narrower on purpose. A <select> belongs in isField — a bare letter there is
     type-ahead, not a shortcut — but it has no text undo of its own, so
     blocking Ctrl+Z inside one just makes Undo dead with a dropdown focused. */
  const isTextField = e => !!e?.target?.closest?.('input, textarea, [contenteditable]');
  const modalOpen = () => !!document.querySelector('dialog[open]');

  /* ----- the title block, and the coverage it drives -----
     Same four fields the field-sketch tool asks for in its title modal, so the
     two deliverables for one structure carry the same header. */
  doc.inspection = doc.inspection || {};
  for (const [id, key] of [['insp-structure', 'structureId'], ['insp-date', 'date'],
    ['insp-by', 'by'], ['insp-sheet', 'sheet']]) {
    const input = document.getElementById(id);
    input.value = doc.inspection[key] || '';
    input.addEventListener('input', () => {
      doc.inspection[key] = input.value.trim() || undefined;
      scheduleSave();
      renderPreflight();
    });
  }

  /* Free, because a stop is one field on a scene rather than a set: the tally
     is a derivation, not a second thing to keep in step. */
  function renderCoverage() {
    const list = document.getElementById('cov-list');
    if (!list) return;
    let covered = 0;
    list.innerHTML = NBIS_STOPS.map(stop => {
      const n = doc.scenes.filter(s => s.stop === stop).length;
      if (n) covered++;
      return `<li class="${n ? 'on' : ''}">
        <span class="cov-mark" aria-hidden="true">${n ? '&check;' : ''}</span>
        <span class="cov-name">${esc(stop)}</span>
        <span class="sr-only">${n ? `covered by ${n} photo${n > 1 ? 's' : ''}` : 'no photo yet'}</span>
        <span class="cov-n num" aria-hidden="true">${n || ''}</span></li>`;
    }).join('');
    const tally = document.getElementById('insp-tally');
    if (tally) {
      tally.textContent = `${covered}/${NBIS_STOPS.length}`;
      tally.className = `insp-tally num${covered === NBIS_STOPS.length ? ' done' : ''}`;
    }
  }

  /* ----- tour name ----- */
  const nameInput = document.getElementById('tour-name');
  nameInput.addEventListener('change', () => {
    doc.name = nameInput.value.trim() || 'untitled tour';
    nameInput.value = doc.name;
    document.title = `Editing ${doc.name} — Orbit Tour`;
    scheduleSave();
  });

  document.getElementById('preview-btn').addEventListener('click', async () => {
    while (saveInFlight) await new Promise(r => setTimeout(r, 120));
    let ok = true;
    if (dirty || saveTimer) ok = await saveNow();
    if (!ok) toast('Could not save — the preview shows the last saved version', true);
    open(`/tour/view/${doc.id}`, '_blank');
  });

  /* a drop that misses the drop zone must not navigate away from the editor */
  window.addEventListener('dragover', e => e.preventDefault());
  window.addEventListener('drop', e => e.preventDefault());

  /* ----- share ----- */
  const embedBox = document.getElementById('embed-code');
  embedBox.value = `<iframe src="${location.origin}/tour/view/${doc.id}?embed=1"\n  width="640" height="400" style="border:0" allowfullscreen\n  allow="gyroscope; accelerometer; fullscreen; xr-spatial-tracking"></iframe>`;
  const wireCopy = (btnId, srcId) => {
    document.getElementById(btnId).addEventListener('click', async () => {
      const field = document.getElementById(srcId);
      try {
        await navigator.clipboard.writeText(field.value);
      } catch {
        field.select(); /* clipboard blocked (insecure origin) — selection lets Ctrl+C work */
        toast('Press Ctrl+C to copy', true);
        return;
      }
      toast('Copied to clipboard');
    });
  };
  wireCopy('copy-link', 'share-link');
  wireCopy('copy-embed', 'embed-code');

  /* ----- the two paper deliverables -----
     CSV rather than a real .xlsx: xlsx from the Python stdlib is a zipfile of
     XML and about sixty lines, and buys nothing here — Excel, Numbers, Sheets
     and every asset-management system read CSV, and this way the file is built
     in the browser, so it works from a standalone export where there is no
     server at all. */
  const allDefects = () => tourDefects(doc);

  /* ----- what is worth knowing before this becomes the record -----
     Every finding is ADVISORY. Nothing here blocks an export, and that is a
     decision rather than an omission: a tour is often shared deliberately
     half-finished — mid-inspection, or to ask a colleague about one bearing —
     and a tool that refused would be wrong more often than it was right. It
     also cannot know whether a missing measurement was an oversight or a
     defect that does not take one. So it counts, it does not gate. */
  function preflight() {
    const out = [];
    if (!doc.scenes.length) return ['There are no photos in this tour yet.'];
    const stranded = strandedScenes(doc);
    if (stranded.length) {
      out.push(`${stranded.length} scene${stranded.length > 1 ? 's' : ''} nothing links to — ` +
        `${stranded.length > 1 ? 'they' : 'it'} cannot be reached in the finished tour.`);
    }
    const dangling = doc.scenes.reduce((n, s) =>
      n + (s.hotspots || []).filter(h => h.type === 'link' && !doc.scenes.some(x => x.id === h.target)).length, 0);
    if (dangling) out.push(`${dangling} link hotspot${dangling > 1 ? 's have' : ' has'} no destination chosen.`);

    const noView = doc.scenes.filter(s => !s.view).length;
    if (noView) out.push(`${noView} scene${noView > 1 ? 's open' : ' opens'} facing wherever the photo happened to start.`);

    const unmeasured = allDefects().filter(({ h }) => defectNeedsMeasure(h));
    if (unmeasured.length) {
      out.push(`${unmeasured.length} defect${unmeasured.length > 1 ? 's' : ''} with no measurement ` +
        `(${unmeasured.map(({ h }) => h.code).filter(Boolean).slice(0, 6).join(', ')}${unmeasured.length > 6 ? '…' : ''}).`);
    }
    const untagged = doc.scenes.filter(s => !s.stop).length;
    if (untagged) out.push(`${untagged} photo${untagged > 1 ? 's are' : ' is'} not assigned to a required stop.`);

    const missingHeader = [['structure ID', 'structureId'], ['inspection date', 'date'], ['inspector', 'by']]
      .filter(([, k]) => !doc.inspection?.[k]).map(([label]) => label);
    if (missingHeader.length) {
      /* "a structure ID" joined behind "has no " read "has no a structure ID" */
      const last = missingHeader.pop();
      const list = missingHeader.length ? `${missingHeader.join(', ')} or ${last}` : last;
      out.push(`The title block has no ${list}.`);
    }
    return out;
  }

  function renderPreflight() {
    const list = document.getElementById('pf-list');
    const count = document.getElementById('pf-count');
    if (!list || !count) return;
    const found = preflight();
    count.textContent = found.length ? String(found.length) : '✓';
    count.className = `pf-count num${found.length ? '' : ' clear'}`;
    list.innerHTML = found.length
      ? found.map(f => `<li>${esc(f)}</li>`).join('')
      : '<li class="pf-ok">Nothing outstanding. Every scene is reachable, every link goes somewhere, ' +
        'and the title block is filled in.</li>';
  }

  /* Past this many dots the plate is a dartboard, not a map: the dots stay so
     the shape of the walk still reads, but picking moves to Ctrl+K, where a
     target is a word instead of a four-pixel gap. The selected dot stays live
     regardless — see renderPlan. */
  const PLAN_PICKABLE_MAX = 24;
  /* Wide enough for a long viaduct and its approaches, far short of a bad fix. */
  const PLAN_MAX_SPAN_M = 5000;
  /* Past this many dots the names under them stop being labels and become a
     smear: at twenty photos on a 500px plate, seven pairs of them overlap and
     none of the seven can be read. So they switch themselves off, and the
     control in the map header switches them back on — or onto something
     shorter, which is usually the better answer anyway. */
  const PLAN_LABEL_MAX = 12;

  /* How the map is being WORKED, as opposed to what it contains. Deliberately
     not in doc.settings: none of it describes the tour, and a colleague opening
     the same tour should not inherit somebody else's label choice. Lives as
     long as the editor is open. */
  let planLabels = null;     /* null = decide from the crowd, else name|stop|station|none */
  let planMoveOnly = false;  /* true = a drag always moves, and never links */

  function renderPlan() {
    const box = document.getElementById('plan-box');
    const note = document.getElementById('plan-note');
    const spanEl = document.getElementById('plan-span');
    const resetBtn = document.getElementById('plan-reset');
    const aimBtn = document.getElementById('plan-aim');
    const how = document.getElementById('plan-how');
    if (!box || !note || !spanEl) return;
    box.innerHTML = '';
    /* cleared up here, not where it is set: every early return below leaves the
       plate on screen, and a metre grid left over from the last render would
       still be ruled at a scale this one has decided it cannot state */
    box.style.removeProperty('--plan-grid');
    const plan = planPositions(doc.scenes);
    const moved = doc.scenes.filter(s => s.plan).length;
    if (resetBtn) resetBtn.hidden = !moved;
    if (aimBtn) aimBtn.hidden = true; /* set properly below, once the plan is known */
    if (!plan) {
      spanEl.textContent = '';
      if (how) how.textContent = '';
      note.textContent = 'Add a second photo and a plan of the walk appears here.';
      return;
    }
    const span = Math.round(plan.span);
    /* readGps only checks Number.isFinite, and zeroed EXIF rationals parse as
       lat 0 / lon 0 — a fix in the Gulf of Guinea. One of those makes the span
       thousands of kilometres, stacks every real photo into a single pixel, and
       prints the distance as a stated fact. That is exactly the confident wrong
       map this refuses to draw, arriving through the one input it did not
       sanity-check. */
    if (plan.scaled && span > PLAN_MAX_SPAN_M) {
      spanEl.textContent = '';
      note.textContent = `These photos claim to be ${span.toLocaleString()} m apart, which is not one `
        + 'structure — most likely a photo carrying a zeroed or stale GPS fix. No plan drawn.';
      return;
    }
    spanEl.textContent = plan.scaled ? `${span} m` : 'not to scale';

    /* Rule the grid at a round number of metres instead of at a quarter of
       whatever the span happens to be. Same pixels, but now a cell is a
       distance you can count in rather than a decoration. Without a scale
       there is nothing honest to rule it at, so the plate falls back to the
       plain quarters it always had. */
    const step = plan.scaled ? niceMetres(plan.span) : 0;
    if (step) box.style.setProperty('--plan-grid', `${(step / plan.span * 100).toFixed(4)}%`);

    /* The structure first, then the photos around it. Drawn from the long axis
       of whatever is actually pinned down, so it is the walk's own line rather
       than a bridge shape invented out of nothing — on a site with no GPS at
       all it is simply the line the photos are laid along, and dragging any
       photo off it bends the line to follow. preserveAspectRatio="none" over a
       0-100 viewBox makes the coordinates read as percentages, which is what
       the dots already use. */
    const d = plan.deck;
    const x1 = d.from.u * 100, y1 = d.from.v * 100, x2 = d.to.u * 100, y2 = d.to.v * 100;
    /* the deck's own normal, half a deck wide, for the kerb lines and the
       abutment ticks. The box is square, so a unit here is a unit either way. */
    const len = Math.hypot(x2 - x1, y2 - y1) || 1;
    const nx = -(y2 - y1) / len * 3, ny = (x2 - x1) / len * 3;
    const seg = (ax, ay, bx, by, cls) => `<line class="${cls}" x1="${ax.toFixed(2)}" y1="${ay.toFixed(2)}"
      x2="${bx.toFixed(2)}" y2="${by.toFixed(2)}"${cls === 'band' ? '' : ' vector-effect="non-scaling-stroke"'}/>`;
    const edges = planEdges(doc.scenes, plan.pts);
    const oneWay = edges.filter(e => !e.both).length;

    /* Past the cap the plate is a dartboard and clicking a four-pixel gap is
       hopeless — but the photo you are ON is never ambiguous, so it stays
       draggable at any count. Otherwise a forty-photo bridge, which is exactly
       the tour that needs correcting, would be the one you cannot correct.
       Every dot carries its id either way: a dot too crowded to pick is still a
       perfectly good place to DROP one, so linking never hits the cap.
       Read up here as well as at the dots, because the arrows below answer to
       the same cap for the same reason. */
    const pickable = plan.pts.length <= PLAN_PICKABLE_MAX;

    /* ----- which way each photo looks -----
       One arrow per photo, and every one of them is a handle: drag the head
       round, or focus it and press the arrow keys, and that photo's compass
       heading follows. This replaces the single accent wedge — the question
       "which pier is THIS a shot of" is still answered on the photo being
       edited, in accent, and now the other thirty-nine answer it too, quietly,
       and all of them are correctable.

       Drawn for any photo that HAS a bearing; drawn hollow, and only on the
       photos you can currently take hold of, for the ones that do not. A
       handle nobody can reach is noise, and a filled arrow on a photo that never
       recorded a heading would be the plate asserting a direction it does not
       know — the exact claim the old code drew no wedge rather than make. */
    const aimMark = (p, bear, live) => {
      const s = doc.scenes.find(x => x.id === p.id);
      const name = s?.name || 'this photo';
      const said = bear === null
        ? `${name} has no bearing yet. Drag this arrow, or press the arrow keys, to say which way it looks.`
        : `${name} looks ${Math.round(bear)} degrees. Drag this arrow, or press the arrow keys, to change it.`;
      const hand = bear === null ? '' : ` ${s?.geo?.headingFrom === 'hand' ? 'aimed by hand' : 'from its own compass'}`;
      /* one rotation, no path arithmetic: the dart is drawn pointing north and
         a bearing IS its angle, so turning one mid-drag is a single transform */
      const mark = el(`<button class="plan-aim${p.id === curSceneId ? ' on' : ''}${bear === null ? ' unset' : ''}"
        data-aim-id="${esc(p.id)}" ${live
          ? `role="slider" aria-valuemin="0" aria-valuemax="359" aria-valuenow="${Math.round(bear ?? 0)}"
             aria-label="${esc(said)}" title="${esc(bear === null
               ? 'Not aimed yet — drag to turn' : `${Math.round(bear)}°${hand} — drag to turn`)}"`
          : 'tabindex="-1" aria-hidden="true"'}
        style="left:${(p.u * 100).toFixed(2)}%;top:${(p.v * 100).toFixed(2)}%"
        ><svg viewBox="0 0 100 100" aria-hidden="true"><path d="${AIM_DART}"/></svg></button>`);
      mark.style.transform = `translate(-50%, -50%) rotate(${bear ?? 0}deg)`;
      return mark;
    };

    box.append(el(`<svg class="plan-lines" viewBox="0 0 100 100" preserveAspectRatio="none">
      <defs aria-hidden="true"><marker id="plan-arrow" class="plan-arrow" viewBox="0 0 8 8" refX="7" refY="4"
        markerUnits="userSpaceOnUse" markerWidth="4" markerHeight="4" orient="auto">
        <path d="M0 0 L8 4 L0 8 Z"/></marker></defs>
      <g class="plan-deck" aria-hidden="true">
        ${seg(x1, y1, x2, y2, 'band')}
        ${seg(x1 + nx, y1 + ny, x2 + nx, y2 + ny, 'edge')}
        ${seg(x1 - nx, y1 - ny, x2 - nx, y2 - ny, 'edge')}
        ${seg(x1 + nx, y1 + ny, x1 - nx, y1 - ny, 'abut')}
        ${seg(x2 + nx, y2 + ny, x2 - nx, y2 - ny, 'abut')}
        ${seg(x1, y1, x2, y2, 'mid')}
      </g>
      <g class="plan-edges" aria-hidden="true">${edges.map(e => {
        /* pulled back off both dots so the line does not grow out of the middle
           of a photo, and so the arrowhead lands in the open where it reads */
        const ex = (e.to.u - e.from.u) * 100, ey = (e.to.v - e.from.v) * 100;
        const l = Math.hypot(ex, ey);
        const ux = l ? ex / l * 2.6 : 0, uy = l ? ey / l * 2.6 : 0;
        const lit = e.a.id === curSceneId || e.b.id === curSceneId;
        /* two photos on the same fix have no line between them to draw, and an
           arrowhead on a line of no length is just a mark floating on a dot */
        const cls = [e.both ? '' : 'one', lit ? 'on' : ''].filter(Boolean).join(' ');
        return `<line class="${cls}"
          x1="${((e.from.u * 100) + ux).toFixed(2)}" y1="${((e.from.v * 100) + uy).toFixed(2)}"
          x2="${((e.to.u * 100) - ux).toFixed(2)}" y2="${((e.to.v * 100) - uy).toFixed(2)}"
          ${e.both || !l ? '' : 'marker-end="url(#plan-arrow)"'} vector-effect="non-scaling-stroke"/>`;
      }).join('')}</g>
      <g class="plan-cuts" aria-hidden="true">${edges.map(e => `<line data-a="${esc(e.a.id)}" data-b="${esc(e.b.id)}"
        x1="${(e.a.u * 100).toFixed(2)}" y1="${(e.a.v * 100).toFixed(2)}"
        x2="${(e.b.u * 100).toFixed(2)}" y2="${(e.b.v * 100).toFixed(2)}"
        vector-effect="non-scaling-stroke"><title>Cut this link</title></line>`).join('')}</g>
      <line class="plan-band" vector-effect="non-scaling-stroke" aria-hidden="true" hidden/>
    </svg>`));

    /* You can draw a link on this plate, so you can cut one on it. A wrong
       arrow is visible here long before anybody walks the tour and discovers
       it, and the fix belonged where the evidence is.
       ponytail: pointer only — the same link is deletable from the hotspot
       panel, which is the keyboard path; giving forty hairlines a tab stop
       each would cost more than it bought. */
    box.querySelector('.plan-cuts')?.addEventListener('click', ev => {
      const line = ev.target.closest?.('line[data-a]');
      if (line) cutLink(line.dataset.a, line.dataset.b);
    });

    /* Arrows before dots, so a defect badge is never buried under one — and
       they answer to the same crowding cap the dots do, since a plate too
       packed to pick from is not one you can aim without mis-hitting. */
    for (const p of plan.pts) {
      const bear = facingBearing(doc.scenes.find(x => x.id === p.id));
      const live = pickable || p.id === curSceneId;
      if (bear === null && !live) continue;
      const mark = aimMark(p, bear, live);
      box.append(mark);
      if (live) makeAimable(mark, box, p);
    }

    const defects = defectCounts(doc);
    const stray = new Set(strandedScenes(doc));
    /* What the dots wear under themselves. Names are the right answer for six
       photos and the wrong one for twenty, and on a bridge the useful caption
       is often the station or the photo stop rather than "IMG_0412" — so this
       is a choice, with a default that reads the crowd. */
    const labelMode = planLabels ?? (plan.pts.length > PLAN_LABEL_MAX ? 'none' : 'name');
    for (const p of plan.pts) {
      const s = doc.scenes.find(x => x.id === p.id);
      const on = p.id === curSceneId;
      const live = pickable || on;
      const label = [s?.name, s?.station && `Sta ${s.station}`].filter(Boolean).join(' — ');
      /* the caption is a display choice; `label` above stays the full thing, so
         turning captions off never takes the name away from a screen reader */
      const caption = { name: s?.name, stop: s?.stop, station: s?.station && `Sta ${s.station}` }[labelMode] || '';
      const named = caption ? ` data-name="${esc(caption)}"` : '';
      const where = { gps: 'from GPS', manual: 'placed by hand', guess: 'guessed' }[p.kind];
      const pos = `left:${(p.u * 100).toFixed(2)}%;top:${(p.v * 100).toFixed(2)}%`;
      /* The register is a flat list of findings with no map in it. This is the
         same findings put back on the ground they were found on, which is what
         anybody reading the report after the site is gone actually needs. */
      const nd = defects.get(p.id) || 0;
      const lost = doc.scenes.length > 1 && stray.has(p.id);
      const cls = `plan-dot k-${p.kind}${on ? ' on' : ''}${lost ? ' stray' : ''}`;
      const said = [
        `${label}, ${where}`,
        nd ? `${nd} defect${nd === 1 ? '' : 's'}` : '',
        lost ? 'nothing links to it' : '',
      ].filter(Boolean).join('. ');
      const badge = nd ? `<span class="plan-def num">${nd > 9 ? '9+' : nd}</span>` : '';
      const dot = el(live
        ? `<button class="${cls}" data-plan-id="${esc(p.id)}"${named} title="${esc(said)}"
             aria-label="${esc(said)}. Go to it, drag to move it${planMoveOnly ? '' : ', or drop it on another photo to connect them'}."
             aria-current="${on}" style="${pos}">${badge}</button>`
        : `<span class="${cls}" data-plan-id="${esc(p.id)}"${named}
             aria-hidden="true" style="${pos}">${badge}</span>`);
      if (live) {
        dot.addEventListener('click', () => { if (!dot.dataset.dragged) selectScene(p.id); });
        makeDraggable(dot, box, plan, p.id);
        makeNudgeable(dot, plan, p);
      }
      box.append(dot);
    }

    /* Drawn last so it sits over the deck line, and as a distinct mark rather
       than a fourth kind of dot: it is not a photo, and the plan should not
       invite anyone to click it as though it were one. */
    if (plan.vehicle) {
      const v = plan.vehicle;
      box.append(el(`<svg class="plan-truck" viewBox="0 0 26 14" role="img"
        aria-label="Plant on the deck, crossed from ${v.from} photo${v.from === 1 ? '' : 's'}"
        style="left:${(v.u * 100).toFixed(2)}%;top:${(v.v * 100).toFixed(2)}%">
        <path d="M1 2h13v8H1z"/><path d="M14 5h4l4 3v2h-8z"/>
        <circle cx="5" cy="11" r="1.6"/><circle cx="11" cy="11" r="1.6"/><circle cx="19" cy="11" r="1.6"/>
      </svg>`));
    }

    /* North was only ever asserted in a source comment, and the grid was ruled
       at a quarter of an arbitrary span. Both are cheap to make true: the bar
       is one cell of the grid, labelled, so a distance on this plate can be
       stepped off against it instead of guessed at. Only when honest, though:
       with no GPS fix anywhere the frame has no north, so no N is worn. */
    if (plan.oriented) box.append(el(`<span class="plan-north" aria-hidden="true">N</span>`));
    if (step) {
      box.append(el(`<span class="plan-scale" aria-hidden="true"
        style="width:${(step / plan.span * 100).toFixed(4)}%">${+step.toFixed(2)} m</span>`));
    }

    const counts = plan.pts.reduce((a, p) => (a[p.kind]++, a), { gps: 0, manual: 0, guess: 0 });
    const aimed = plan.pts.filter(p => facingBearing(doc.scenes.find(s => s.id === p.id)) !== null).length;
    /* Offered only when there is a gap AND something to fill it from: one
       bearing to carry along shared views, or a link between two photos that
       are really placed. Otherwise the button could only disappoint, and the
       note below says what is missing instead. */
    if (aimBtn) {
      const real = new Set(plan.pts.filter(p => p.kind !== 'guess').map(p => p.id));
      const linked = doc.scenes.some(s => real.has(s.id)
        && (s.hotspots || []).some(h => h.type === 'link' && real.has(h.target)));
      aimBtn.hidden = !(aimed < plan.pts.length && (aimed > 0 || linked));
    }
    const handAimed = doc.scenes.filter(s => s.geo?.headingFrom === 'hand').length;
    const marked = [...defects.values()].reduce((a, n) => a + n, 0);
    const lostCount = doc.scenes.length > 1 ? stray.size : 0;
    /* What you can DO is a different kind of sentence from what the plate is
       telling you, and running the two together made one long paragraph nobody
       finishes. The instructions sit above the map, the findings below it. */
    if (how) {
      how.textContent = (planMoveOnly
        ? 'Drag a photo to where it stood; move-only is on, so dropping it on another will not link them. '
          + 'Click a link to cut it. '
        : 'Drag a photo to where it stood, drop it on another to connect the two, or click a link to cut it. ')
        + 'Each photo carries an arrow for the way it looks — drag the arrow to turn it. '
        + 'The arrow keys nudge a selected photo and turn a selected arrow; hold Shift for bigger steps.';
    }
    note.textContent = [
      plan.scaled
        ? `Sized by GPS: about ${span} m across — each grid square is ${+step.toFixed(2)} m.`
        : counts.gps
          ? `${counts.gps} from GPS — two fixes are needed to size the site, so this is its shape, not its size.`
          : 'No photo here carries a GPS fix, so this is the shape of the walk, not its size, and the grid is only a grid.',
      counts.guess ? `${counts.guess} placed by capture order — drag ${counts.guess > 1 ? 'them' : 'it'} onto the right spot.` : '',
      counts.manual ? `${counts.manual} moved by hand.` : '',
      edges.length
        ? `${edges.length} link${edges.length === 1 ? '' : 's'} drawn between them${oneWay
          ? `, ${oneWay} of ${oneWay === 1 ? 'which walks' : 'which walk'} one way only — dashed, with the arrow on the end that works.`
          : '.'}`
        : 'Nothing is linked yet — connect them here, or use "Connect scenes for me".',
      lostCount
        ? `${lostCount} in red — nothing links to ${lostCount === 1 ? 'it' : 'them'}, so ${lostCount === 1 ? 'it is' : 'they are'} in the record but not in the walk.`
        : '',
      marked ? `${marked} defect${marked === 1 ? '' : 's'} counted on the photos that carry them.` : '',
      /* the arrows are only worth a sentence while some of them are still
         unanswered questions — once every photo is aimed, they speak for
         themselves and this is one more line of text over the plate */
      aimed < plan.pts.length
        ? `Bearing known on ${aimed} of ${plan.pts.length} photos — turn a dashed arrow to aim another`
          + `${aimBtn && !aimBtn.hidden ? ', or work the rest out from it below' : ''}. `
          + 'Once a photo has one, the compass in the finished tour starts working too.'
        : 'Every photo knows which way it faces — turn an arrow to change one.',
      handAimed ? `${handAimed} aimed by hand.` : '',
      plan.vehicle
        ? `The truck is plant on the deck, crossed from ${plan.vehicle.from} photos that saw it — a guess at a big bright object, so check it is a truck and not a skip.`
        : '',
      pickable ? '' : 'Too many to pick up at this size — use Ctrl+K to jump, then drag the highlighted dot. Any dot can still be dropped on.',
      /* said once, when it happens, rather than left as a silent disappearance */
      planLabels === null && labelMode === 'none'
        ? `Names are off above ${PLAN_LABEL_MAX} photos because they overlap into a smear — the map header puts them back, or swaps them for the station or the photo stop.`
        : '',
      counts.gps ? 'Phone GPS is good to a few metres, so treat this as a sketch.' : '',
    ].filter(Boolean).join(' ');
  }

  /* Cutting a link is the other half of drawing one. Both directions go: half
     a cut pair leaves a one-way link nobody asked for, which is the exact
     shape of dead end the plate is meant to expose. scheduleSave enrols it in
     the undo stack, so Ctrl+Z puts the pair back without anything extra. */
  function cutLink(aId, bId) {
    const a = doc.scenes.find(s => s.id === aId), b = doc.scenes.find(s => s.id === bId);
    if (!a || !b) return;
    const drop = (from, toId) => {
      const before = (from.hotspots || []).length;
      from.hotspots = (from.hotspots || []).filter(h => !(h.type === 'link' && h.target === toId));
      return before - from.hotspots.length;
    };
    if (!(drop(a, b.id) + drop(b, a.id))) return;
    scheduleSave();
    refreshMarkers();
    renderSceneList();
    if (armedTarget()) renderBuildChips();
    toast(`Cut the link between "${a.name}" and "${b.name}" — Ctrl+Z puts it back`);
  }

  /* How near a drop has to land to count as "on that photo" rather than "at
     that spot". The dot is 11px (20 on a touch screen), so this is the dot and
     a little forgiveness, not a magnet that swallows nearby placements. */
  const PLAN_SNAP_PX = 18;
  /* ----- move a photo without a mouse -----
     Dragging is pointer-only, so until now a plan could only be corrected with
     a pointer — the same gap the hotspot panel's Move button fills for
     hotspots. Two things make this more than an addEventListener:

     PSV binds the arrow keys on window to rotate the panorama (`keyboard:
     'always'`, bubble phase, `psv-core.module.js` keyHandler), so without
     stopPropagation a nudge would also spin the view behind the plate.

     And renderPlan() rebuilds every dot, which throws away the focused
     element mid-keystroke — so focus is put back on the same photo afterwards,
     or the second press of an arrow key would land on nothing. Undo coalescing
     in scheduleSave() means a burst of presses costs one Ctrl+Z, not twenty. */
  const NUDGE_KEYS = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
  function makeNudgeable(dot, plan, p) {
    dot.addEventListener('keydown', e => {
      const d = NUDGE_KEYS[e.key];
      if (!d || e.ctrlKey || e.metaKey || e.altKey) return;
      const s = doc.scenes.find(x => x.id === p.id);
      if (!s) return;
      e.preventDefault();
      e.stopPropagation();
      const by = e.shiftKey ? 0.05 : 0.01; /* fractions of the plate, so a nudge means the same at either size */
      s.plan = plan.toMetres(clamp(p.u + d[0] * by, 0, 1), clamp(p.v + d[1] * by, 0, 1));
      scheduleSave();
      renderPlan();
      document.querySelector(`.plan-dot[data-plan-id="${CSS.escape(p.id)}"]`)?.focus();
    });
  }

  /* ----- aim a photo by turning its arrow -----

     A bearing is the one thing on this plate that the pixels cannot supply and
     the camera very often did not record: no GPSImgDirection, no photo sphere
     XMP, no sun in the frame, and the tour has no idea which way any of its
     photos face. The inspector standing on the deck does know, and until now
     had nowhere to say it.

     What gets stored is the camera's own heading — where the MIDDLE of the file
     points — worked back out of the direction the arrow was left in, which is
     where the OPENING VIEW points. Everything downstream already reads that
     field: the viewer's compass needle, the plan's link bearings, the vehicle
     crossing. So one drag here fixes all of them at once, and a photo aimed by
     hand is worth exactly as much to them as one that recorded a bearing.

     ponytail: no separate "hand bearing" field. Reusing geo.heading is what
     makes the drag worth doing at all — a parallel field would have to be
     taught to every one of those readers. */
  const AIM_STEP = 5;     /* degrees per arrow key; Shift multiplies it */
  const AIM_STEP_BIG = 15;

  function setAim(s, aim) {
    if (!s) return;
    s.geo = s.geo || {};
    /* A bearing the camera measured is a fact, and a drag must not silently
       delete it. Kept alongside the way a solar heading is kept beside a
       magnetic one, so the scene panel can show both and the inspector can see
       what they overruled — first overwrite only, since after that the number
       being replaced is their own. */
    if (Number.isFinite(s.geo.heading) && s.geo.headingFrom !== 'hand'
      && !Number.isFinite(s.geo.headingWas)) {
      s.geo.headingWas = s.geo.heading;
    }
    s.geo.heading = headingForAim(s, aim);
    s.geo.headingFrom = 'hand';
    scheduleSave();
  }

  /* Turning is drawn straight onto the element mid-gesture and committed on
     release, for the same reason dragging a dot is: renderPlan() rebuilds every
     node, so re-rendering per pointermove would delete the element the pointer
     is captured on and the gesture would end on its first move. */
  function makeAimable(g, box, p) {
    const scene = () => doc.scenes.find(x => x.id === p.id);
    const drawAt = deg => {
      g.style.transform = `translate(-50%, -50%) rotate(${deg.toFixed(1)}deg)`;
      g.classList.remove('unset'); /* it fills in the moment it is aimed */
      g.setAttribute('aria-valuenow', String(Math.round(deg)));
    };

    g.addEventListener('pointerdown', ev => {
      if (ev.pointerType === 'mouse' && ev.button !== 0) return;
      ev.preventDefault();
      ev.stopPropagation(); /* or the plate reads this as the start of a link */
      const rect = box.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      try { g.setPointerCapture(ev.pointerId); } catch { /* the turn still works */ }
      g.classList.add('turning');
      let aim = null;
      const move = e => {
        aim = aimFromPoint(p, {
          u: (e.clientX - rect.left) / rect.width,
          v: (e.clientY - rect.top) / rect.height,
        });
        drawAt(aim);
      };
      const up = () => {
        g.removeEventListener('pointermove', move);
        g.removeEventListener('pointerup', up);
        g.removeEventListener('pointercancel', up);
        g.classList.remove('turning');
        if (aim === null) return;
        setAim(scene(), aim);
        renderPlan();
        renderSceneMeta();
        box.querySelector(`.plan-aim[data-aim-id="${CSS.escape(p.id)}"]`)?.focus();
      };
      g.addEventListener('pointermove', move);
      g.addEventListener('pointerup', up);
      g.addEventListener('pointercancel', up);
    });

    /* Same reasoning as makeNudgeable: PSV binds the arrow keys on window to
       spin the panorama, so without stopPropagation aiming a photo would also
       turn the view behind the plate. */
    g.addEventListener('keydown', e => {
      const dir = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key];
      if (!dir || e.ctrlKey || e.metaKey || e.altKey) return;
      e.preventDefault();
      e.stopPropagation();
      const s = scene();
      const now = facingBearing(s) ?? 0;
      setAim(s, (now + dir * (e.shiftKey ? AIM_STEP_BIG : AIM_STEP) + 360) % 360);
      renderPlan();
      renderSceneMeta();
      box.querySelector(`.plan-aim[data-aim-id="${CSS.escape(p.id)}"]`)?.focus();
    });
  }

  const planNodeNear = (pts, at, rect, skipId) => {
    let best = null, nearest = PLAN_SNAP_PX;
    for (const p of pts) {
      if (p.id === skipId) continue;
      const away = Math.hypot((at.u - p.u) * rect.width, (at.v - p.v) * rect.height);
      if (away < nearest) { nearest = away; best = p; }
    }
    return best;
  };

  /* Connect two photos from the plan. Both ways, because a one-way arrow is a
     dead end from the far side — the same reason linkPair exists.

     The plan knows where these two stand, so the outgoing arrow can be aimed at
     the real bearing between them whenever the photo also knows which way it was
     facing. Without a heading there is no way to turn a map bearing into a
     direction inside the photo, so it falls back to the same opening-finding the
     automatic pass uses, and the arrow is draggable afterwards either way. */
  function connectOnPlan(plan, fromId, toId) {
    const from = doc.scenes.find(s => s.id === fromId);
    const to = doc.scenes.find(s => s.id === toId);
    if (!from || !to || from === to) return;
    if (hasLink(from, to.id) && hasLink(to, from.id)) {
      toast(`"${from.name}" and "${to.name}" are already connected`);
      return;
    }
    const here = plan.pts.find(p => p.id === fromId), there = plan.pts.find(p => p.id === toId);
    const out = Number.isFinite(from.geo?.heading)
      ? +wrap180(planBearing(here, there) - from.geo.heading).toFixed(2)
      : snapToWay(wrap180(from.view?.yaw || 0), from.ways);
    const made = linkPair(from, to, out, snapToWay(returnYaw(from, to, out), to.ways));
    scheduleSave();
    refreshMarkers();
    renderSceneList();
    if (armedTarget()) renderBuildChips();
    toast(`${made > 1 ? 'Linked' : 'Linked back'} "${from.name}" and "${to.name}" — Ctrl+Z undoes it`);
  }

  /* One drag, two meanings, told apart by where it ends: let go over another
     photo and the two get connected; let go anywhere else and this photo moves
     to where you dropped it. No mode to remember, and the plate says which one
     is about to happen — over a photo, the dot springs home and a line follows
     the cursor instead.

     A move is committed in metres, not in box fractions, so a later photo
     widening the site rescales the plate without sliding everything somebody
     already corrected.
     The plate re-fits after each drop, so dragging a dot beyond the current
     extent does shift the others — unavoidable when the view auto-fits, and
     preferable to a plan that runs off its own edge. */
  function makeDraggable(dot, box, plan, id) {
    dot.addEventListener('pointerdown', ev => {
      if (ev.pointerType === 'mouse' && ev.button !== 0) return;
      ev.preventDefault();
      const rect = box.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      const home = plan.pts.find(p => p.id === id);
      const band = box.querySelector('.plan-band');
      let onto = null;
      /* Capture keeps the events coming when the cursor leaves the dot, which
         it does immediately. It is an improvement, not a requirement — and
         when it throws (no active pointer with that id) an unguarded call
         takes the whole drag down with it before a single listener is bound. */
      try { dot.setPointerCapture(ev.pointerId); } catch { /* drag still works */ }
      let at = null;
      const move = e => {
        at = {
          u: clamp((e.clientX - rect.left) / rect.width, 0, 1),
          v: clamp((e.clientY - rect.top) / rect.height, 0, 1),
        };
        /* Move-only turns the second meaning off. The no-mode default is still
           right for six photos — you can see what you are about to hit — but at
           twenty the dots are close enough that a move keeps landing on a
           neighbour and drawing a link nobody asked for. */
        onto = planMoveOnly ? null : planNodeNear(plan.pts, at, rect, id);
        for (const other of box.querySelectorAll('.plan-dot.target')) other.classList.remove('target');
        if (onto) box.querySelector(`.plan-dot[data-plan-id="${CSS.escape(onto.id)}"]`)?.classList.add('target');
        dot.classList.add('dragging');
        /* over a photo this is a link, not a move: put the dot back where it
           belongs and let the rubber band carry the gesture instead */
        const to = onto && home ? home : at;
        dot.style.left = `${(to.u * 100).toFixed(2)}%`;
        dot.style.top = `${(to.v * 100).toFixed(2)}%`;
        if (band && home) {
          band.toggleAttribute('hidden', !onto);
          band.setAttribute('x1', (home.u * 100).toFixed(2));
          band.setAttribute('y1', (home.v * 100).toFixed(2));
          band.setAttribute('x2', (at.u * 100).toFixed(2));
          band.setAttribute('y2', (at.v * 100).toFixed(2));
        }
      };
      const up = () => {
        dot.removeEventListener('pointermove', move);
        dot.removeEventListener('pointerup', up);
        dot.removeEventListener('pointercancel', up);
        dot.classList.remove('dragging');
        band?.toggleAttribute('hidden', true);
        for (const other of box.querySelectorAll('.plan-dot.target')) other.classList.remove('target');
        if (!at) return;
        /* the click that follows this pointer sequence would otherwise also
           jump the editor to the scene, which is not what a drag asked for */
        dot.dataset.dragged = '1';
        if (onto) { connectOnPlan(plan, id, onto.id); return; }
        const s = doc.scenes.find(x => x.id === id);
        if (s) {
          s.plan = plan.toMetres(at.u, at.v);
          scheduleSave();
        }
        renderPlan();
      };
      dot.addEventListener('pointermove', move);
      dot.addEventListener('pointerup', up);
      dot.addEventListener('pointercancel', up);
    });
  }

  function refreshRegisterNote() {
    const note = document.getElementById('register-note');
    if (!note) return;
    const n = allDefects().length;
    const unmeasured = allDefects().filter(({ h }) => defectNeedsMeasure(h)).length;
    note.textContent = !n ? 'No defects recorded yet.'
      : `${n} defect${n > 1 ? 's' : ''}${unmeasured ? `, ${unmeasured} with no measurement` : ''}.`;
  }

  document.getElementById('register-btn').addEventListener('click', () => downloadRegister(doc));
  document.getElementById('print-btn').addEventListener('click', () => printPhotoLog(doc));

  document.getElementById('export-btn').addEventListener('click', async e => {
    e.preventDefault();
    while (saveInFlight) await new Promise(r => setTimeout(r, 120));
    if (dirty || saveTimer) await saveNow();
    location.href = `/api/tours/${doc.id}/export.zip`;
  });

  /* ----- uploads ----- */
  const dropZone = document.getElementById('drop-zone');
  const fileInput = document.getElementById('file-input');
  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileInput.click(); } });
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault(); dropZone.classList.remove('drag');
    addScenes([...e.dataTransfer.files]);
  });
  fileInput.addEventListener('change', () => { addScenes([...fileInput.files]); fileInput.value = ''; });
  document.getElementById('auto-link').addEventListener('click', autoLink);
  /* a button inside a <summary> would otherwise also toggle the fold */
  document.getElementById('plan-expand').addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation(); toggleMap(true);
  });
  document.getElementById('plan-reset')?.addEventListener('click', () => {
    for (const s of doc.scenes) delete s.plan;
    scheduleSave();
    renderPlan();
    toast('Placements cleared — back to GPS and capture order');
  });

  /* Fill in the bearings the camera never recorded, from the two means that do
     not need it to have — see deriveHeadings. A button rather than something
     automatic: it correlates every pair of photos, which is a second of work on
     a big tour, and it writes to every scene at once, which is the kind of
     thing that should happen because somebody asked. */
  document.getElementById('plan-aim')?.addEventListener('click', () => {
    const found = deriveHeadings(doc.scenes, planPositions(doc.scenes)?.pts);
    if (!found.length) {
      toast('Nothing could be worked out. Aim one photo by hand on the map first, '
        + 'or place links between photos you have positioned.', true);
      return;
    }
    for (const f of found) {
      const s = doc.scenes.find(x => x.id === f.id);
      if (!s) continue;
      s.geo = s.geo || {};
      s.geo.heading = f.heading;
      s.geo.headingFrom = f.from;
    }
    scheduleSave();
    renderPlan();
    renderSceneMeta();
    const byMatch = found.filter(f => f.from === 'match').length;
    const how = [
      byMatch ? `${byMatch} carried along shared views` : '',
      found.length - byMatch ? `${found.length - byMatch} off the plan` : '',
    ].filter(Boolean).join(', ');
    toast(`Worked out ${found.length} bearing${found.length === 1 ? '' : 's'} — ${how}. `
      + 'Check the arrows, turn any that look wrong, Ctrl+Z undoes the lot');
  });

  /* One persistent line rather than a toast per file. A toast erases the one
     before it, so a folder of HEICs — every single one of which fails on
     Windows — used to flash a dozen messages and leave nothing behind but an
     empty scene list. */
  function setDropNotice(failures) {
    const line = document.getElementById('drop-notice');
    if (!line) return;
    line.style.whiteSpace = 'pre-line';
    if (!failures.length) { line.textContent = ''; return; }
    /* group by REASON, not by file — a folder of HEICs fails the same way
       forty times over and saying so forty times helps nobody */
    const reasons = [...new Set(failures.map(f => f.reason))];
    line.textContent = failures.length === 1
      ? `${failures[0].name}: ${failures[0].reason}`
      : reasons.length === 1
        ? `${failures.length} photos could not be added — ${reasons[0]}`
        : `${failures.length} photos could not be added:\n• ${reasons.slice(0, 3).join('\n• ')}`;
  }

  async function addScenes(files) {
    /* write into the label span only — clobbering dropZone's children would
       detach the hidden file input mid-upload */
    const dropLabel = document.getElementById('drop-label');
    const failures = [];
    const arrivedAt = doc.scenes.length;
    const total = files.length;
    let done = 0;
    setDropNotice([]);
    for (const file of files) {
      /* A bridge walk arrives as one drop of thirty or forty photos, and each
         one costs a decode, a re-encode and two uploads. "Uploading IMG_0312"
         with no count reads as stuck. <progress> is the native answer. */
      dropLabel.innerHTML = total > 1
        ? `Uploading <span class="num">${done + 1}</span> of <span class="num">${total}</span>` +
          `<br><span class="up-name">${esc(file.name)}</span>` +
          `<progress max="${total}" value="${done}"></progress>`
        : `Uploading ${esc(file.name)}…`;
      try {
        const { thumb, pano, geo, shot, ways, upload, width, height, converted, fill, prof, open, vehicle } = await preparePano(file);
        const panoName = await uploadFile(doc.id, upload);
        const thumbName = await uploadFile(doc.id, new File([thumb], 'thumb.jpg', { type: 'image/jpeg' }));
        const scene = {
          id: newId('s'),
          name: file.name.replace(/\.[^.]+$/, ''),
          file: panoName,
          thumb: thumbName,
          /* openingView decides; recorded as a guess so the scene panel can say
             which reading it came from and offer to forget it */
          view: open ? { yaw: open.yaw, pitch: open.pitch } : { yaw: 0, pitch: 0 },
          hotspots: [],
        };
        if (open) scene.viewFrom = open.from;
        if (pano) scene.pano = pano;
        if (geo) scene.geo = geo;
        if (shot) scene.shot = shot;
        scene.size = { w: width, h: height }; /* so the coverage note can do its arithmetic */
        if (converted) scene.converted = true;
        scene.fill = fill; /* what the empty part of the sphere wears */
        if (ways?.length) scene.ways = ways; /* directions the photo suggests are open */
        if (prof) scene.prof = prof; /* the two bands, for matching this photo against its neighbours */
        if (vehicle) scene.vehicle = vehicle; /* which way the plant on the deck lies from here */
        doc.scenes.push(scene);
        if (doc.scenes.length === 1) {
          doc.settings.startScene = scene.id;
          curSceneId = scene.id;
        }
        scheduleSave();
        renderSceneList();
        if (doc.scenes.length === 1) { renderMain(); renderSceneShape(); }
        if (armedTarget()) renderBuildChips();
      } catch (err) {
        failures.push({ name: file.name, reason: uploadReason(err) });
      }
      done++;
    }
    dropLabel.innerHTML = 'Drop photos here<br>or click to choose';
    setDropNotice(failures);
    /* Photos with no way to walk between them are not a tour yet. Connect them
       straight away rather than leaving it behind a button the user has to
       find — the summary says what it did and Ctrl+Z takes it back.
       The test is whether THIS batch arrived unconnected, not whether the tour
       has any link at all: coming back later to add a fifth room should get
       the same treatment the first four did. */
    const arrived = doc.scenes.slice(arrivedAt);
    const stranded = arrived.some(s => !(s.hotspots || []).some(h => h.type === 'link'));
    if (doc.scenes.length > 1 && stranded) autoLink();
    /* The date the shutter fired is the inspection date, and it is already in
       the file. Only filled when the field is still empty, so it can never
       overwrite a date somebody typed on purpose. */
    if (!doc.inspection.date) {
      const earliest = doc.scenes.map(s => s.shot).filter(Boolean).sort()[0];
      if (earliest) {
        doc.inspection.date = earliest.slice(0, 10);
        const input = document.getElementById('insp-date');
        if (input) input.value = doc.inspection.date;
        renderPreflight();
        scheduleSave();
      }
    }
    syncSortButton();
  }

  /* A bridge walk is a sequence — deck loop, elevations, then the underside —
     so capture order IS the walk order. A folder drop arrives in whatever order
     the OS felt like, which is only sometimes the same thing. */
  function syncSortButton() {
    const b = document.getElementById('sort-shot');
    if (b) b.hidden = doc.scenes.filter(s => s.shot).length < 2;
