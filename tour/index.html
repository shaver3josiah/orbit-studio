<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Tour</title>
<link rel="stylesheet" href="/tour/vendor/psv-core.css">
<link rel="stylesheet" href="/tour/vendor/psv-markers.css">
<link rel="stylesheet" href="/tour/vendor/psv-virtual-tour.css">
<link rel="stylesheet" href="/tour/vendor/psv-gallery.css">
<style>
  :root {
    color-scheme: light dark;

    /* ---- primitives. Lifted from the sibling inspection tool,
       android/app/src/main/assets/bridge-sketch.html:147-171, so the two
       tools read as one toolkit. Never referenced outside this block. ---- */
    --p-bg-l:#E7EAEF;   --p-panel-l:#FFFFFF; --p-panel2-l:#F5F7FA;
    --p-ink-l:#13181F;  --p-muted-l:#606A76; --p-line-l:#DCE1E8;
    --p-bg-d:#0A0F1A;   --p-panel-d:#131826; --p-panel2-d:#1A2138;
    --p-ink-d:#E8ECF4;  --p-muted-d:#94A3B8; --p-line-d:#2A3450;
    --p-blue:#1763C2;   --p-blue-2:#2A7EE0;  --p-blue-tint:#EAF2FC; --p-blue-deep:#114E9C;
    --p-blue-d:#2F80E8; --p-blue-2d:#4F9BEC; --p-blue-tint-d:#16243D;
    --p-red:#C62828;    --p-red-d:#FF5A52;
    --p-green:#2E7D32;  --p-green-d:#4CAF50;
    --p-defect:#C0392B; --p-defect-d:#FF6B5E;
    --p-amber:#B26A00;  --p-amber-d:#E0A02E;  /* derived: the sketch tool has no warning role */

    /* ---- semantic roles: the only names the rest of the sheet may use.
       Declared ONCE. The tempting `--x:#hex; --x:light-dark(...)` pair is not a
       fallback: a custom property accepts any token stream at parse time, so an
       engine without light-dark() keeps the SECOND declaration and every var()
       consumer then dies invalid-at-computed-value-time. The real fallback is
       the @supports block below. ---- */
    --bg:light-dark(var(--p-bg-l),var(--p-bg-d));
    --surface:light-dark(var(--p-panel-l),var(--p-panel-d));
    --surface-raised:light-dark(var(--p-panel2-l),var(--p-panel2-d));
    --ink:light-dark(var(--p-ink-l),var(--p-ink-d));
    --ink-2:light-dark(var(--p-muted-l),var(--p-muted-d));
    /* --ink-3 is the quietest tier that is still BODY text, so it is pinned at
       4.62:1 on white rather than the 3.0:1 a muted grey wants to be. Every
       12px label in the sidebar rides on it. */
    --ink-3:light-dark(#6B7684,#8B98AD);
    --line:light-dark(var(--p-line-l),var(--p-line-d));
    --line-strong:light-dark(#C3CBD6,#586A90);
    --accent:light-dark(var(--p-blue),var(--p-blue-d));
    /* Light hover DARKENS, dark hover brightens. Reusing the sketch tool's
       lighter --accent-2 here put white on #2A7EE0 at 4.07:1 — under the floor
       on the hover state of the app's primary action. --accent-deep is 8.09:1. */
    --accent-hover:light-dark(var(--p-blue-deep),var(--p-blue-2d));
    /* Flips with the theme. White on the light accent #1763C2 is 5.83:1, but
       white on the brighter dark-mode accent #2F80E8 is only 3.91:1 — under the
       4.5:1 floor for a 15px button label. Dark ink on that same blue is 4.78:1.
       (The pre-token app shipped 3.65:1 here, so this fixes an old defect
       rather than introducing one.) */
    --accent-ink:light-dark(#FFFFFF,#08121F);
    --accent-tint:light-dark(var(--p-blue-tint),var(--p-blue-tint-d));
    --accent-tint-strong:light-dark(#D6E6FA,#1E3357);
    --danger:light-dark(var(--p-red),var(--p-red-d));
    --warning:light-dark(var(--p-amber),var(--p-amber-d));
    --success:light-dark(var(--p-green),var(--p-green-d));
    --defect:light-dark(var(--p-defect),var(--p-defect-d));
    /* Fixed by intent: a scrim sits on a photograph, and a photograph looks the
       same in both themes. Never wrap these in light-dark(). */
    --scrim:rgba(11,11,14,.72);
    --scrim-strong:rgba(11,11,14,.86);

    /* ---- spacing, 4px grid ---- */
    --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px;
    --s6:24px; --s7:32px; --s8:40px; --s9:56px; --s10:80px;

    /* ---- type: fixed, not fluid. Product UI is read at a consistent DPI and a
       heading that shrinks inside a 320px rail looks worse, not better. ---- */
    --t-xs:10px; --t-sm:12px; --t-md:15px; --t-lg:18px; --t-xl:22px; --t-2xl:26px;
    --f-ui:-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
    /* Plex Mono is named first so it is used on machines that already have it
       (the Android capture app bundles it) and costs nothing on machines that
       do not. Shipping the woff2 would mean two binaries, a server MIME token,
       an export-filter token and a smoke-test assertion to make numerals match
       a sibling tool — ui-monospace already renders a mono. */
    --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;

    /* ---- radius ---- */
    --r-xs:6px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-pill:999px;

    /* ---- elevation. Themed through the colour components rather than a
       media query, so the data-theme hook below flips shadows and colours
       together instead of leaving one behind. ---- */
    --sh-1:0 1px 2px light-dark(rgba(17,28,44,.08),rgba(0,0,0,.45)),0 1px 1px light-dark(rgba(17,28,44,.04),rgba(0,0,0,.30));
    --sh-2:0 4px 14px light-dark(rgba(17,28,44,.10),rgba(0,0,0,.55)),0 1px 3px light-dark(rgba(17,28,44,.06),rgba(0,0,0,.35));
    --sh-3:0 14px 34px light-dark(rgba(17,28,44,.18),rgba(0,0,0,.60)),0 4px 12px light-dark(rgba(17,28,44,.08),rgba(0,0,0,.40));

    /* ---- motion. One place to tune, one branch to disable. ---- */
    --dur-fast:120ms; --dur-base:180ms; --dur-slow:620ms;
    --ease-out:cubic-bezier(0.22,1,0.36,1);   /* ease-out-quart */
    --ease-step:cubic-bezier(0.32,0,0.24,1);  /* the forward push into a scene */

    /* ---- stacking. Photo Sphere Viewer's own 50/80/90/100/110 are sealed
       inside .psv-container by its container-type:size, which establishes a
       stacking context, so nothing here has to clear them. ---- */
    --z-chrome:10;   /* .tour-title, .tour-logo */
    --z-overlay:20;  /* .load-error */
    --z-panel:30;    /* .hs-panel */
    --z-tryout:40;   /* .tryout — its close button is a later sibling, so no z-index */
    --z-toast:50;
    /* ponytail: below .psv-fullscreen-emulation (9999), which only exists in a
       browser with no Fullscreen API. The placing ghost would sit under an
       emulated fullscreen viewer there. Raise it if that browser ever matters. */
    --z-ghost:60;
  }
  /* An engine without light-dark() stores the function in the custom property
     anyway — custom properties accept any token stream at parse time — so every
     var() consumer would become invalid at computed-value time and the app would
     render unstyled, not dark. A declaration-level fallback cannot fix that; only
     re-declaring the roles can. Light is the fallback because this app is used
     outdoors. */
  @supports not (color: light-dark(#000, #fff)) {
    :root {
      --bg:#E7EAEF; --surface:#FFFFFF; --surface-raised:#F5F7FA;
      --ink:#13181F; --ink-2:#606A76; --ink-3:#6B7684;
      --line:#DCE1E8; --line-strong:#C3CBD6;
      --accent:#1763C2; --accent-hover:#2A7EE0; --accent-ink:#FFFFFF;
      --accent-tint:#EAF2FC; --accent-tint-strong:#D6E6FA;
      --danger:#C62828; --warning:#B26A00; --success:#2E7D32; --defect:#C0392B;
      --sh-1:0 1px 2px rgba(17,28,44,.08),0 1px 1px rgba(17,28,44,.04);
      --sh-2:0 4px 14px rgba(17,28,44,.10),0 1px 3px rgba(17,28,44,.06);
      --sh-3:0 14px 34px rgba(17,28,44,.18),0 4px 12px rgba(17,28,44,.08);
    }
    /* the photo chrome cannot ride color-scheme here, so pin it by hand */
    .stage, #edit-psv { --surface:#131826; --surface-raised:#1A2138; --ink:#E8ECF4;
      --ink-2:#94A3B8; --ink-3:#8B98AD; --line:rgba(255,255,255,.12); --line-strong:rgba(255,255,255,.20); }
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }

  /* The panorama is a PHOTOGRAPH, and dark chrome around a photograph is not a
     preference — it is how photographs are shown. color-scheme inherits, so
     one declaration resolves every light-dark() inside the stage and the
     editor's viewer to its dark value: the title plate, the load error, the
     navbar, the loader, PSV's own panels. */
  .stage, #edit-psv { color-scheme: dark; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: var(--t-md)/1.5 var(--f-ui);
  }
  button { font: inherit; cursor: pointer; }
  .num { font-variant-numeric: tabular-nums; font-family: var(--f-mono); }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0;
  }

  /* ---------- home ---------- */
  .home { max-width: 960px; margin: 0 auto; padding: 40px 24px 80px; }
  .home-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 8px; }
  .home-head h1 { font-size: var(--t-2xl); font-weight: 700; margin: 0; }
  .home-sub { color: var(--ink-2); margin: 0 0 28px; }
  .btn {
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 8px 16px; transition: transform var(--dur-fast) var(--ease-out), background var(--dur-fast) var(--ease-out);
  }
  .btn:hover { background: var(--surface-raised); }
  .btn:active { transform: scale(0.98); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .btn.primary { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.danger-text { color: var(--danger); }
  .btn.danger-solid { background: var(--danger); border-color: transparent; color: var(--accent-ink); }
  .create-row { display: none; gap: 8px; margin-bottom: 20px; }
  .create-row.open { display: flex; }
  .text-input {
    flex: 1; max-width: 360px; background: var(--surface); color: var(--ink);
    border: 1px solid var(--line-strong); border-radius: var(--r-md);
    padding: 8px 14px; font: inherit;
  }
  .text-input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--r-pill); padding: 10px 20px; z-index: var(--z-toast); font-size: var(--t-md);
    box-shadow: var(--sh-2);
  }
  .toast.error { border-color: var(--danger); color: var(--danger); }
  .tour-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
  .tour-card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 6px;
  }
  .tour-card h2 { margin: 0; font-size: var(--t-lg); font-weight: 600; overflow-wrap: anywhere; }
  .tour-card .cover {
    width: calc(100% + 40px); margin: -20px -20px 8px; height: 120px;
    object-fit: cover; border-radius: var(--r-lg) var(--r-lg) 0 0; display: block;
    background: var(--bg);
  }
  .tour-card .meta { color: var(--ink-2); font-size: var(--t-sm); }
  .tour-card .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .empty-card {
    grid-column: 1 / -1; text-align: center; padding: 56px 24px;
    border: 1px dashed var(--line-strong); border-radius: var(--r-lg); color: var(--ink-2);
  }
  .state-note { color: var(--ink-2); padding: 24px 0; }
  .state-note.error { color: var(--danger); }

  /* ---------- viewer ---------- */
  .stage { position: fixed; inset: 0; }
  #psv { width: 100%; height: 100%; }
  .tour-title {
    position: absolute; top: 16px; left: 16px; z-index: var(--z-chrome);
    background: var(--scrim); backdrop-filter: blur(8px);
    border: 1px solid var(--line); border-radius: var(--r-md);
    padding: 8px 14px; font-size: var(--t-md); font-weight: 600; max-width: min(60vw, 480px);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tour-logo {
    position: absolute; left: 16px; bottom: 56px; z-index: var(--z-chrome); display: block;
  }
  .tour-logo img { max-height: 56px; max-width: 160px; display: block; }
  /* stepping to the next scene: lean forward, then settle */
  .stage .psv-canvas-container { transition: transform var(--dur-slow) var(--ease-step); }
  .stage.stepping .psv-canvas-container { transform: scale(1.14); }
  @media (prefers-reduced-motion: reduce) {
    .stage .psv-canvas-container { transition: none; }
    .stage.stepping .psv-canvas-container { transform: none; }
  }
  /* top-right: the toolbar owns the top-left, the navbar owns the bottom */
  .compass {
    position: absolute; top: 16px; right: 16px; z-index: var(--z-chrome);
    display: flex; align-items: center; gap: var(--s2);
    background: var(--scrim); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 255, 255, 0.12); border-radius: var(--r-md);
    padding: 6px 12px 6px 8px; color: #F2F2F7;
  }
  .compass[hidden] { display: none; }
  .cmp-read { font-size: var(--t-sm); letter-spacing: 0.02em; }
  .load-error {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: var(--z-overlay);
    background: var(--surface); border: 1px solid var(--danger); color: var(--ink);
    border-radius: var(--r-md); padding: 14px 20px; max-width: 80%; text-align: center;
  }
  .center-note {
    position: fixed; inset: 0; display: flex; flex-direction: column; gap: 12px;
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .center-note .big { font-size: var(--t-lg); font-weight: 600; }
  .center-note .sub { color: var(--ink-2); }
  .center-note a { color: var(--accent); }
  .spin {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--line-strong); border-top-color: var(--accent);
    animation: spin 800ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) {
    .spin { animation-duration: 2s; }
    .btn { transition: none; }
  }

  /* ---------- editor ---------- */
  /* dvh, not vh: on a mobile browser 100vh is the viewport with the URL bar
     retracted, so a vh-tall editor is taller than the screen and the toolbar
     sits under the chrome. vh first for engines that lack dvh. */
  .editor { display: flex; height: 100vh; height: 100dvh; position: relative; }
  .side {
    width: 320px; flex: none; background: var(--surface);
    border-right: 1px solid var(--line); display: flex; flex-direction: column;
    overflow-y: auto;
  }
  .side-head { padding: 16px; border-bottom: 1px solid var(--line); }
  .side-head .back { color: var(--ink-2); text-decoration: none; font-size: var(--t-sm); }
  .side-head .back:hover { color: var(--ink); }
  .name-input {
    width: 100%; margin-top: 8px; background: transparent; color: var(--ink);
    border: 1px solid transparent; border-radius: 8px; padding: 6px 8px;
    font-size: var(--t-lg); font-weight: 600;
  }
  .name-input:hover { border-color: var(--line); }
  .name-input:focus-visible { outline: none; border-color: var(--accent); background: var(--bg); }
  .save-status { font-size: var(--t-sm); color: var(--ink-3); margin-top: 4px; min-height: 16px; }
  .save-status.saving { color: var(--ink-2); }
  .save-status.error { color: var(--danger); }
  .side-section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  /* Sentence case, not a tracked uppercase eyebrow. Four of these stack down
     one rail; as capitals they read as decoration repeating, and 12px tracked
     capitals are harder to scan than 12px sentence case at the same size. */
  .side-section h3 {
    margin: 0 0 10px; font-size: var(--t-sm); font-weight: 600; color: var(--ink-2);
  }
  .scene-row {
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 8px;
    border: 1px solid transparent;
  }
  .scene-row:hover { background: var(--surface-raised); }
  .scene-row.active { border-color: var(--accent); background: var(--accent-tint); }
  .scene-pick {
    flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
    background: none; border: none; color: inherit; padding: 0 6px 0 0; cursor: pointer; text-align: left;
  }
  .scene-pick:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
  .scene-row img { width: 56px; height: 28px; object-fit: cover; border-radius: 4px; flex: none; }
  .scene-row .sn { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--t-md); }
  .start-btn {
    font-size: var(--t-xs); letter-spacing: 0.04em; border-radius: 4px; padding: 1px 5px; flex: none;
    background: none; border: 1px solid var(--line-strong); color: var(--ink-3); cursor: pointer;
  }
  .start-btn:hover { color: var(--accent); border-color: var(--accent); }
  .start-btn.on { color: var(--accent); border-color: var(--accent); cursor: default; }
  .start-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .icon-btn.armed { color: var(--accent-ink); background: var(--danger); }
  .sn-input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--ink);
    border: 1px solid var(--accent); border-radius: 6px; padding: 2px 6px; font: inherit; font-size: var(--t-md);
  }
  .icon-btn {
    background: none; border: none; color: var(--ink-3); padding: 2px 4px;
    border-radius: 6px; font-size: var(--t-md); line-height: 1; flex: none;
  }
  .icon-btn:hover { color: var(--ink); background: rgba(255, 255, 255, 0.08); }
  .icon-btn:focus-visible { outline: 2px solid var(--accent); }
  .drop-zone {
    margin-top: 10px; border: 1px dashed var(--line-strong); border-radius: var(--r-md);
    padding: 18px 12px; text-align: center; color: var(--ink-2); font-size: var(--t-sm); cursor: pointer;
  }
  .drop-zone.drag { border-color: var(--accent); color: var(--accent); background: var(--accent-tint); }
  .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 10px 0; font-size: var(--t-md); }
  .field label { color: var(--ink-2); }
  .field input[type="checkbox"] { accent-color: var(--accent); width: 16px; height: 16px; }
  .field input[type="number"], .field input[type="url"], .field select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 5px 8px; font: inherit; font-size: var(--t-sm); max-width: 150px;
  }
  .field .file-line { display: flex; align-items: center; gap: 6px; }
  .share-row { margin: 12px 0 0; }
  .share-row label { display: block; font-size: var(--t-sm); color: var(--ink-2); margin-bottom: 4px; }
  .share-row .copy { display: flex; gap: 6px; align-items: flex-start; }
  .share-row input, .share-row textarea {
    flex: 1; min-width: 0; background: var(--bg); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: var(--t-sm); resize: vertical;
  }
  .share-row input:focus-visible, .share-row textarea:focus-visible { outline: 2px solid var(--accent); }
  .share-row .btn { padding: 5px 10px; font-size: var(--t-sm); flex: none; }
  a.btn { text-decoration: none; display: inline-block; }
  .main-pane { flex: 1; position: relative; display: flex; flex-direction: column; min-width: 0; }
  .toolbar {
    display: flex; gap: 8px; align-items: center; padding: 10px 14px;
    background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  .toolbar .hint { color: var(--ink-2); font-size: var(--t-sm); margin-left: auto; }
  .toolbar .hint.placing { color: var(--accent); }
  #edit-psv { flex: 1; min-height: 0; }
  /* Teaches the walk rather than announcing that nothing is here. Left-aligned
     and capped at a readable measure: this is the one screen in the app whose
     prose is long enough for line length to matter. */
  .editor-empty {
    flex: 1; display: flex; flex-direction: column; gap: var(--s3);
    align-items: flex-start; justify-content: center;
    color: var(--ink-2); padding: var(--s6);
    max-width: 62ch; margin: 0 auto; overflow-y: auto;
  }
  .editor-empty h2 { margin: 0; font-size: var(--t-xl); color: var(--ink); text-wrap: balance; }
  .editor-empty p { margin: 0; }
  .ee-lead { color: var(--ink); font-weight: 600; margin-top: var(--s3); }
  /* max-content, not a fixed ch width: "Loop closure" and "Underside lattice"
     differ by five characters, and a fixed column wraps the longer one */
  .ee-phases {
    list-style: none; counter-reset: phase; margin: 0; padding: 0;
    display: grid; grid-template-columns: max-content 1fr; gap: var(--s2) var(--s4);
    align-items: baseline; width: 100%;
  }
  .ee-phases li { display: contents; counter-increment: phase; }
  .ee-name { color: var(--ink); font-weight: 600; font-size: var(--t-sm); white-space: nowrap; }
  .ee-name::before { content: counter(phase) ". "; color: var(--ink-3); font-weight: 400; }
  .ee-what { font-size: var(--t-sm); }
  .ee-actions { display: flex; gap: var(--s2); margin-top: var(--s3); flex-wrap: wrap; }

  .empty-card h2 { margin: 0 0 var(--s2); font-size: var(--t-lg); color: var(--ink); }
  .empty-card p { margin: 0 auto var(--s2); max-width: 52ch; }
  .empty-card .ec-next { margin-bottom: 0; }

  /* per-file progress through a folder of forty panoramas */
  .drop-zone progress { width: 100%; height: 4px; margin-top: var(--s2); display: block; }
  .up-name {
    display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    color: var(--ink-3); font-size: var(--t-sm);
  }
  .hs-panel {
    position: absolute; top: 60px; right: 14px; z-index: var(--z-panel); width: 300px;
    background: var(--surface); border: 1px solid var(--line-strong);
    border-radius: var(--r-lg); padding: 16px; box-shadow: var(--sh-3);
  }
  .hs-panel h4 { margin: 0 0 10px; font-size: var(--t-md); }
  .hs-panel .frow { margin: 8px 0; display: flex; flex-direction: column; gap: 4px; }
  .hs-panel .frow label { font-size: var(--t-sm); color: var(--ink-2); }
  .hs-panel input[type="text"], .hs-panel textarea, .hs-panel select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 8px; font: inherit; font-size: var(--t-sm); width: 100%;
  }
  .hs-panel textarea { min-height: 64px; resize: vertical; }
  .hs-panel .row { display: flex; gap: 8px; margin-top: 12px; }
  .hs-panel input.invalid { border-color: var(--danger); }
  .field-note { font-size: var(--t-sm); color: var(--danger); min-height: 13px; }
  .icon-btn:disabled { opacity: 0.28; cursor: default; background: none; color: var(--ink-3); }

  /* ---------- build mode: the link-laying bar ---------- */
  .btn.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .btn.on:hover { background: var(--accent-hover); }
  .build-bar {
    display: none; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 8px 14px; background: var(--accent-tint);
    border-bottom: 1px solid var(--line);
  }
  .build-bar.open { display: flex; }
  /* --ink-2, not --ink-3: this label sits on --accent-tint, where the quiet
     tier lands at 3.9:1 instead of the 4.62:1 it clears on a plain surface. */
  .bb-label {
    font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); flex: none;
  }
  .bb-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; min-width: 120px; }
  .bb-chip {
    display: flex; align-items: center; gap: 7px; max-width: 210px;
    padding: 3px 11px 3px 3px; font-size: var(--t-sm); color: var(--ink);
    background: var(--surface); border: 1px solid var(--line-strong); border-radius: 999px;
  }
  .bb-chip img { width: 30px; height: 18px; object-fit: cover; border-radius: 999px; flex: none; }
  .bb-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bb-chip .tick { color: var(--success); flex: none; font-size: var(--t-sm); }
  .bb-chip.on { border-color: var(--accent); background: var(--accent-tint-strong); }
  .bb-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .bb-return { display: flex; align-items: center; gap: 6px; font-size: var(--t-sm); color: var(--ink-2); flex: none; }
  .bb-return input { accent-color: var(--accent); width: 16px; height: 16px; }

  /* ---------- scene coverage sliders ---------- */
  .range-row { display: flex; align-items: center; gap: 8px; margin: 9px 0; }
  .range-row > label { font-size: var(--t-sm); color: var(--ink-2); width: 58px; flex: none; }
  .range-row input[type="range"] { flex: 1; min-width: 0; accent-color: var(--accent); }
  .range-row .val { font-size: var(--t-sm); color: var(--ink-2); width: 46px; text-align: right; flex: none; }
  .scene-note { font-size: var(--t-sm); color: var(--ink-3); margin: 4px 0 0; }

  /* the hotspot you are about to drop, riding the cursor until you place it */
  .place-ghost {
    position: fixed; z-index: var(--z-ghost); pointer-events: none;
    transform: translate(-50%, -50%); opacity: 0.9;
    filter: drop-shadow(0 0 8px var(--accent));
  }

  /* walking the tour without leaving the editor */
  .tryout { position: absolute; inset: 0; z-index: var(--z-tryout); background: var(--bg); }
  .tryout iframe { display: block; width: 100%; height: 100%; border: 0; }
  .tryout-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--scrim-strong); backdrop-filter: blur(8px);
  }

  /* hotspots are draggable in the editor only — in the viewer they are buttons */
  #edit-psv .psv-marker { cursor: grab; }
  /* nothing else says "you can pick this up", so hover has to */
  #edit-psv .psv-marker:hover { filter: drop-shadow(0 0 7px var(--accent)); }
  #edit-psv.dragging-hotspot, #edit-psv.dragging-hotspot .psv-marker { cursor: grabbing; }
  #edit-psv.dragging-hotspot .psv-marker { filter: drop-shadow(0 0 9px var(--accent)); }

  /* ---------- the inspection title block ----------
     <details> because the header is written once and read rarely, and it must
     not push the scene list — the thing actually being worked on — down the
     rail. Native disclosure, no JS, keyboard and screen reader included. */
  .insp > summary {
    display: flex; align-items: center; gap: var(--s2);
    font-size: var(--t-sm); font-weight: 600; color: var(--ink-2);
    cursor: pointer; list-style-position: inside;
  }
  .insp > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
  .insp[open] > summary { margin-bottom: var(--s3); }
  .insp-tally {
    margin-left: auto; font-size: var(--t-sm); color: var(--ink-2);
    background: var(--surface-raised); border: 1px solid var(--line);
    border-radius: var(--r-pill); padding: 1px 8px;
  }
  .insp-tally.done { color: var(--success); border-color: var(--success); }
  .insp .frow { display: flex; flex-direction: column; gap: var(--s1); margin: var(--s3) 0; }
  .insp .frow label { font-size: var(--t-sm); color: var(--ink-2); }
  .insp input {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 6px 8px; font: inherit; font-size: var(--t-sm); width: 100%;
  }
  .insp input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cov-head { margin: var(--s5) 0 var(--s2); font-size: var(--t-sm); font-weight: 600; color: var(--ink-2); }
  .cov { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .cov li {
    display: flex; align-items: center; gap: var(--s2);
    font-size: var(--t-sm); color: var(--ink-3); padding: 3px 0;
  }
  .cov li.on { color: var(--ink); }
  .cov-mark {
    width: 16px; height: 16px; flex: none; display: grid; place-items: center;
    border: 1px solid var(--line-strong); border-radius: var(--r-xs);
    font-size: var(--t-xs); line-height: 1;
  }
  .cov li.on .cov-mark { background: var(--success); border-color: transparent; color: var(--accent-ink); }
  .cov-name { flex: 1; min-width: 0; }
  .cov-n { color: var(--ink-2); }

  /* This scene: same field vocabulary as everything around it. Shipped bare
     first time round, so a UA-chrome select sat beside styled siblings. */
  #scene-meta .frow { display: flex; flex-direction: column; gap: var(--s1); margin: var(--s3) 0; }
  #scene-meta .frow label { font-size: var(--t-sm); color: var(--ink-2); }
  #scene-meta input, #scene-meta select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 6px 8px; font: inherit; font-size: var(--t-sm); width: 100%;
  }
  #scene-meta input:hover, #scene-meta select:hover { border-color: var(--line-strong); }
  #scene-meta input:focus-visible, #scene-meta select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  @media (max-width: 960px), (pointer: coarse) {
    #scene-meta input, #scene-meta select { min-height: 44px; }
  }

  /* ---------- plan view ----------
     In the rail, not floating over the panorama: an overlay would land on the
     viewer's own navbar, and a plan belongs beside the list it indexes. */
  .plan { margin-top: var(--s3); }
  .plan > summary {
    display: flex; align-items: center; gap: var(--s2); cursor: pointer;
    font-size: var(--t-sm); color: var(--ink-2); list-style-position: inside; padding: var(--s1) 0;
  }
  .plan > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
  .plan-span { margin-left: auto; font-size: var(--t-sm); color: var(--ink-3); }
  .plan-box {
    position: relative; aspect-ratio: 1; margin: var(--s2) 0;
    background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-sm);
    /* north is up, and a grid says "sketch" rather than "survey" */
    background-image: linear-gradient(var(--line) 1px, transparent 1px),
                      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 25% 25%; background-position: -1px -1px;
  }
  .plan-box:empty { opacity: 0.5; }
  .plan-dot {
    position: absolute; width: 11px; height: 11px; padding: 0;
    transform: translate(-50%, -50%); border-radius: 50%;
    background: var(--surface); border: 2px solid var(--ink-3); cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-out);
  }
  button.plan-dot:hover { transform: translate(-50%, -50%) scale(1.35); border-color: var(--accent); }
  button.plan-dot:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .plan-dot.on { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-tint); }
  @media (prefers-reduced-motion: reduce) { .plan-dot { transition: none; } }

  /* scene groups: a flat rail is right for six photos and a scroll for forty */
  .sgroup { border-top: 1px solid var(--line); }
  .sgroup:first-of-type { border-top: 0; }
  .sgroup > summary {
    display: flex; align-items: center; gap: var(--s2); cursor: pointer;
    font-size: var(--t-sm); font-weight: 600; color: var(--ink-2);
    padding: var(--s2) 0; list-style-position: inside;
  }
  .sgroup > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
  .sg-n {
    margin-left: auto; font-size: var(--t-sm); color: var(--ink-3);
    background: var(--surface-raised); border-radius: var(--r-pill); padding: 0 7px;
  }
  .sg-body { padding-bottom: var(--s2); }

  /* ---------- pre-share check ----------
     A <details>, not a modal. A modal would interrupt the one moment the user
     is certain about what they want, and every finding here is advisory. */
  .preflight > summary {
    display: flex; align-items: center; gap: var(--s2); cursor: pointer;
    font-size: var(--t-sm); color: var(--ink-2); list-style-position: inside;
    padding: var(--s1) 0;
  }
  .preflight > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: var(--r-xs); }
  .pf-count {
    margin-left: auto; font-size: var(--t-sm); padding: 1px 8px;
    border: 1px solid var(--warning); color: var(--warning); border-radius: var(--r-pill);
  }
  .pf-count.clear { border-color: var(--success); color: var(--success); }
  .pf-list {
    list-style: none; margin: var(--s2) 0 0; padding: 0;
    display: grid; gap: var(--s2); font-size: var(--t-sm); color: var(--ink-2);
  }
  .pf-list li { padding-left: var(--s4); text-indent: calc(var(--s4) * -1); }
  .pf-list li::before { content: "•"; color: var(--warning); padding-right: var(--s2); }
  .pf-list .pf-ok::before { content: "✓"; color: var(--success); }

  /* ---------- the defect register ---------- */
  /* The one place --defect earns a control of its own. It is a border and a
     text colour, never a filled button: a solid red button in a toolbar reads
     as "destructive", and this one creates a record. */
  .btn.defect { color: var(--defect); border-color: color-mix(in srgb, var(--defect) 45%, var(--line)); }
  .btn.defect:hover { background: color-mix(in srgb, var(--defect) 10%, transparent); }
  @supports not (color: color-mix(in srgb, red 50%, blue)) {
    .btn.defect { border-color: var(--defect); }
  }
  .code-chip {
    font-size: var(--t-sm); font-weight: 600; color: var(--defect);
    border: 1px solid var(--defect); border-radius: var(--r-xs);
    padding: 1px 6px; margin-left: var(--s1); vertical-align: 1px;
  }
  /* Quantised measurements, the same increments the field sketch offers. A
     segmented row rather than a dropdown because these are the five answers
     you actually give, and one tap beats open-scroll-pick with a glove on. */
  .seg { display: flex; flex-wrap: wrap; gap: var(--s1); }
  .seg-btn {
    flex: 1 0 auto; min-width: 62px; padding: 7px 8px; font-size: var(--t-sm);
    background: var(--surface-raised); color: var(--ink-2);
    border: 1px solid var(--line); border-radius: var(--r-sm);
    transition: background var(--dur-fast) var(--ease-out);
  }
  .seg-btn:hover { background: var(--accent-tint); color: var(--ink); }
  .seg-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .seg-btn.on { background: var(--accent); border-color: transparent; color: var(--accent-ink); }
  .seg-btn:disabled { opacity: 0.4; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .seg-btn { transition: none; } }
  @media (max-width: 960px), (pointer: coarse) { .seg-btn { min-height: 44px; } }

  /* shape picker */
  .shape-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .shape-btn {
    width: 38px; height: 38px; padding: 4px; display: grid; place-items: center;
    background: var(--bg); border: 1px solid var(--line); border-radius: 9px;
  }
  .shape-btn img { width: 26px; height: 26px; display: block; }
  .shape-btn.on { border-color: var(--accent); background: var(--accent-tint); }
  .shape-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hs-panel .range-row > label { width: 52px; }
  .orphan { width: 7px; height: 7px; border-radius: 50%; background: var(--danger); flex: none; }

  /* ---------- field conditions: a tablet, outdoors, possibly gloved ----------
     ONE breakpoint governs both the drawer and the finger-sized targets. A
     landscape tablet at 1024px reports pointer:coarse and wants both, for the
     same reason. A touchscreen laptop driven by a mouse reports pointer:fine
     and rightly keeps the desktop layout.
     ponytail: the case this misses is that same laptop folded into tablet mode,
     which still reports pointer:fine at 1920px. `any-pointer: coarse` is the
     upgrade if that ever turns out to matter — it costs a touchscreen laptop
     big targets while mousing, which is why it is not the default. */
  .drawer-toggle, .drawer-scrim { display: none; }

  /* Six tab stops per scene row means a keyboard user pays for every photo in
     the tour before reaching the panorama. One link buys the whole way past. */
  .skip {
    position: absolute; left: var(--s2); top: -100px; z-index: var(--z-toast);
    background: var(--accent); color: var(--accent-ink); text-decoration: none;
    padding: 10px 16px; border-radius: var(--r-sm); box-shadow: var(--sh-2);
    transition: top var(--dur-fast) var(--ease-out);
  }
  .skip:focus { top: var(--s2); }
  #main-pane:focus { outline: none; }
  #main-pane:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  @media (prefers-reduced-motion: reduce) { .skip { transition: none; } }

  /* Jump-to. <dialog> again: backdrop, Escape, focus trap, inertness, free. */
  .palette {
    border: 1px solid var(--line-strong); border-radius: var(--r-lg);
    background: var(--surface); color: var(--ink); box-shadow: var(--sh-3);
    padding: 0; width: min(560px, calc(100vw - var(--s8)));
    margin-top: 12vh; overflow: hidden;
  }
  .palette::backdrop { background: rgba(11, 14, 20, 0.55); }
  .palette #pal-q {
    width: 100%; border: 0; border-bottom: 1px solid var(--line); background: transparent;
    color: var(--ink); font: inherit; font-size: var(--t-lg); padding: var(--s4) var(--s5);
  }
  .palette #pal-q:focus { outline: none; }
  .pal-list { list-style: none; margin: 0; padding: var(--s2); max-height: 52vh; overflow-y: auto; }
  .pal-list li {
    display: flex; align-items: baseline; gap: var(--s3);
    padding: 8px var(--s3); border-radius: var(--r-sm); cursor: pointer;
  }
  .pal-list li.on { background: var(--accent-tint); }
  .pal-kind {
    flex: none; font-size: var(--t-xs); font-weight: 600; color: var(--ink-2);
    border: 1px solid var(--line-strong); border-radius: var(--r-xs); padding: 1px 5px;
  }
  .pal-kind.defect { color: var(--defect); border-color: var(--defect); }
  .pal-label { flex: none; color: var(--ink); }
  .pal-detail {
    flex: 1; min-width: 0; font-size: var(--t-sm); color: var(--ink-2);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right;
  }
  .pal-none { color: var(--ink-2); cursor: default; }
  @media (max-width: 960px), (pointer: coarse) { .pal-list li { min-height: 44px; } }

  /* keyboard help. <dialog> brings the backdrop, Escape, focus trap and
     inertness for free — none of that is worth hand-writing. */
  .help-sheet {
    border: 1px solid var(--line-strong); border-radius: var(--r-lg);
    background: var(--surface); color: var(--ink); box-shadow: var(--sh-3);
    padding: var(--s6); max-width: 420px; width: calc(100vw - var(--s8));
  }
  .help-sheet::backdrop { background: rgba(11, 14, 20, 0.55); }
  .help-sheet h4 { margin: 0 0 var(--s4); font-size: var(--t-lg); }
  .help-sheet dl {
    display: grid; grid-template-columns: max-content 1fr;
    gap: var(--s2) var(--s4); margin: 0 0 var(--s5);
  }
  .help-sheet dt { margin: 0; }
  .help-sheet dd { margin: 0; color: var(--ink-2); }
  .help-sheet kbd {
    font: 500 var(--t-sm)/1 var(--f-mono); background: var(--surface-raised);
    border: 1px solid var(--line); border-bottom-width: 2px;
    border-radius: var(--r-xs); padding: 4px 7px; display: inline-block; color: var(--ink);
  }
  .help-sheet form { display: flex; justify-content: flex-end; }

  @media (max-width: 960px), (pointer: coarse) {
    .side {
      position: fixed; z-index: var(--z-panel); inset: 0 auto 0 0;
      width: min(340px, 86vw); box-shadow: var(--sh-3);
      transform: translateX(-100%); visibility: hidden;
      /* visibility lags the slide out, so a closed drawer leaves the tab order
         instead of sitting off-screen collecting focus */
      transition: transform var(--dur-base) var(--ease-out), visibility 0s linear var(--dur-base);
    }
    .editor.panels-open .side { transform: none; visibility: visible; transition-delay: 0s; }
    .drawer-scrim {
      display: block; position: fixed; inset: 0; z-index: calc(var(--z-panel) - 1);
      background: var(--scrim); opacity: 0; pointer-events: none;
      transition: opacity var(--dur-base) var(--ease-out);
    }
    .editor.panels-open .drawer-scrim { opacity: 1; pointer-events: auto; }
    .drawer-toggle {
      display: inline-flex; align-items: center; gap: var(--s2);
      position: fixed; top: var(--s2); left: var(--s2);
      /* above the drawer, not level with it: equal z-index let the later
         element win, so the open drawer swallowed its own close button */
      z-index: calc(var(--z-panel) + 1);
      min-height: 44px; min-width: 44px; box-shadow: var(--sh-1);
    }
    .toolbar { padding-left: 84px; }
    .editor-empty { padding-top: var(--s9); }

    /* The hotspot panel becomes a bottom sheet. A 300px card pinned top-right
       is both out of thumb reach and directly over the hotspot being edited. */
    .hs-panel {
      top: auto; right: 0; bottom: 0; left: 0; width: auto;
      max-height: 62dvh; overflow-y: auto;
      border-radius: var(--r-lg) var(--r-lg) 0 0;
    }

    /* --- the 44px finger floor --- */
    .toolbar .btn { min-height: 44px; min-width: 44px; }
    .icon-btn { min-width: 44px; min-height: 44px; display: inline-grid; place-items: center; padding: 0; }
    .start-btn { min-height: 32px; padding: 6px 10px; font-size: var(--t-sm); }
    /* six controls plus a thumbnail cannot share one 340px line at 44px each,
       so the name takes its own row and the controls sit under it */
    .scene-row { flex-wrap: wrap; row-gap: var(--s1); padding: var(--s2); }
    .scene-pick { flex-basis: 100%; min-height: 44px; }
    .shape-btn { width: 48px; height: 48px; }
    .field input[type="checkbox"], .bb-return input { width: 24px; height: 24px; }
    /* .field is flex + align-items:center, so min-height on the ROW leaves the
       label its 22px line box floating in dead space. The label itself has to
       become the target the for= binding already promised. */
    .field label { display: flex; align-items: center; min-height: 44px; flex: 1; }
    .range-row input[type="range"] { height: 44px; }
    .bb-chip { min-height: 44px; }
    .drop-zone { padding: var(--s6) var(--s3); }
    /* the panel the breakpoint exists to create was never covered */
    .side .btn, .share-row .btn, .side a.btn { min-height: 44px; }
    .insp > summary, .plan > summary, .sgroup > summary, .preflight > summary { min-height: 44px; }
    .plan-dot { width: 20px; height: 20px; }
    .start-btn { min-height: 44px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .side, .drawer-scrim { transition: none; }
  }

  /* ---------- the printed photo log ----------
     Browser print-to-PDF is the whole delivery mechanism; there is no PDF
     library here and there should not be one. The log is built on demand and
     removed again, so it can never disagree with the document it came from. */
  .print-log { display: none; }
  @media print {
    /* :has() scopes this to a page that actually HAS a log. Unscoped, it hid
       #app on every screen, so an ordinary Ctrl+P printed a blank sheet. */
    body:has(.print-log) > *:not(.print-log) { display: none !important; }
    .print-log { display: block; }
    /* forced to paper regardless of the reader's theme: a dark-mode PDF of an
       inspection log is a ream of toner and an unreadable filing copy */
    :root { color-scheme: light; }
    .print-log, .print-log * { color: #000; background: transparent; }
