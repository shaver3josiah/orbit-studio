     on the deck". Everything downstream treats it as a suggestion, and the
     four numbers below are field-tuning knobs, not constants of nature. */
  const deckTop = rowAt(-5);
  const deckBot = Math.max(deckTop + 1, rowAt(-40));
  const deckRows = deckBot - deckTop;
  let vehicle = null;
  if (deckRows >= 3) {
    const lumOf = i => 0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2];
    const satOf = i => Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2]);
    /* the deck's own colour, as a median so a vehicle filling a third of the
       band cannot drag the reference toward itself the way a mean would */
    const lums = [], sats = [];
    for (let x = 0; x < W; x += 2) {
      for (let y = deckTop; y < deckBot; y += 2) {
        const i = (y * W + x) * 4;
        lums.push(lumOf(i)); sats.push(satOf(i));
      }
    }
    lums.sort((a, b) => a - b); sats.sort((a, b) => a - b);
    const deckLum = lums[lums.length >> 1], deckSat = sats[sats.length >> 1];

    const share = new Float64Array(W);
    for (let x = 0; x < W; x++) {
      let hits = 0;
      for (let y = deckTop; y < deckBot; y++) {
        const i = (y * W + x) * 4;
        if (lumOf(i) - deckLum >= VEHICLE_MIN_LUM || satOf(i) - deckSat >= VEHICLE_MIN_SAT) hits++;
      }
      share[x] = hits / deckRows;
    }
    /* longest circular run of columns that are mostly not-deck. Scanning twice
       round lets a vehicle sitting across the 0/360 seam be found as one run
       rather than as two halves at opposite ends of the panorama. */
    let best = null, run = 0;
    for (let k = 0; k < W * 2; k++) {
      if (share[k % W] >= VEHICLE_MIN_SHARE) {
        run++;
        if (run <= W && (!best || run > best.len)) best = { len: run, end: k };
      } else run = 0;
    }
    const degPer = hFov / W;
    if (best && best.len * degPer >= VEHICLE_MIN_DEG && best.len * degPer <= VEHICLE_MAX_DEG) {
      const centre = ((best.end - (best.len - 1) / 2) % W + W) % W;
      vehicle = { yaw: yawAt(centre), width: +(best.len * degPer).toFixed(1) };
    }
  }

  return { W, hFov, wall, floor, sun, person, facing, vehicle };
}

/* Where the photo suggests you can walk. Reads the bands panoProfile built;
   every angle it returns is a draggable suggestion, never a decision. */
function guessNavigableYaws(profile, count = 3) {
  if (!profile) return [];
  const { W, hFov, wall, floor, sun } = profile;
  const smooth = (arr, radius) => {
    const out = new Float64Array(W);
    for (let x = 0; x < W; x++) {
      let sum = 0;
      for (let k = -radius; k <= radius; k++) sum += arr[(x + k + W) % W];
      out[x] = sum / (2 * radius + 1);
    }
    return out;
  };
  const wallBase = smooth(wall, Math.max(1, Math.round(W * 0.19)));
  const floorBase = smooth(floor, Math.max(1, Math.round(W * 0.19)));

  const score = new Float64Array(W);
  for (let x = 0; x < W; x++) {
    score[x] = Math.abs(wall[x] - wallBase[x]) + 0.5 * Math.abs(floor[x] - floorBase[x]);
  }

  /* the sun is the one bright thing that is reliably not somewhere you can
     walk — knock it out, plus a margin for the glare around it */
  if (sun) {
    const bloom = Math.max(1, Math.round(W * 0.035));
    for (let k = -bloom; k <= bloom; k++) score[(Math.round(sun.col) + k + W) % W] = 0;
  }

  const gap = Math.round(W * NAV_MIN_SEPARATION / 360);
  const apart = (a, b) => { const n = Math.abs(a - b) % W; return Math.min(n, W - n); };
  const floorScore = Math.max(NAV_MIN_SCORE, Math.max(...score) * NAV_MIN_RELATIVE);
  const picked = [];
  for (const x of [...score.keys()].sort((a, b) => score[b] - score[a])) {
    if (score[x] < floorScore || picked.length === count) break;
    if (!picked.some(p => apart(p, x) < gap)) picked.push(x);
  }
  return picked.map(x => +wrap180((x + 0.5) / W * hFov - hFov / 2).toFixed(2));
}

/* Which way a scene should open, off what the photo turned out to contain.
   Yaw 0 is the middle of the file, which is wherever the camera happened to be
   pointing, so almost anything beats it — but only two readings are worth
   having, in this order:

     person   somebody in hi-vis standing out in the scene. On an inspection
              they are nearly always at the thing being inspected.
     facing   nobody out there, but whoever held the camera is underfoot, and
              the top of their head says which way they were looking. A worse
              bet than the first, and still a far better one than the middle of
              the file.

   A hi-vis hit BELOW the underfoot line is the operator, not a second person,
   and gets no vote on bearing at all — it is the one case where the old guess
   confidently aimed at nothing. Returns null when the photo suggests neither,
   because "no idea" has to stay one of the answers. */
function openingView(profile) {
  const p = profile?.person;
  if (p && p.alt > UNDERFOOT_ALT) return { yaw: p.yaw, pitch: 0, from: 'person' };
  if (Number.isFinite(profile?.facing)) return { yaw: profile.facing, pitch: 0, from: 'facing' };
  return null;
}

/* ---------- keeping every hotspot clickable ----------

   Two hotspots close together on screen are one hotspot as far as anybody
   pressing them is concerned, and the one underneath cannot be reached at all.
   Automatic arrows now step aside as they are created (see freeYaw), but that
   cannot help the cases that matter most: two defects genuinely three degrees
   apart on the same spall, a tour built before that fix existed, or any pair
   that only collides once you zoom out.

   So marks are separated where they are DRAWN, never where they are stored.
   The record keeps the exact angle somebody clicked — the register, the CSV
   and the photo log all read the stored yaw and pitch and none of them can see
   any of this. Only pixels move.

   Takes boxes at {x, y, w, h} centres, returns one {dx, dy} per box in the
   same order. Pure, so the geometry can be tested without a viewer.

   ponytail: pairwise relaxation, O(n² · passes). At the dozen-or-two markers
   ever visible at once that is a few hundred operations a frame, far cheaper
   than the quadtree that would replace it. */

const DECLUTTER_GAP = 4;        /* px of daylight left between two marks */
/* Past half its own size a mark would stop covering the point it marks, and a
   defect pin that no longer sits on the defect is worse than one you have to
   zoom in to separate. This cap is the honesty of the whole mechanism. */
const DECLUTTER_LIMIT = 0.5;
const DECLUTTER_PASSES = 4;

function separateMarks(marks) {
  const at = marks.map(m => ({ x: m.x, y: m.y }));

  /* Marks landing on the very same pixel are the case this exists for, and
     pairwise pushing alone handles them badly: each push picks one axis, so a
     stack of three ends up in a LINE, which is the shape that leaves the middle
     one least room. Seed them on a ring first and the relaxation refines a fan
     instead. Up to four equal marks a ring at the cap radius keeps every centre
     clear of every other; a fifth cannot be fitted inside the cap by any
     arrangement, and gets a better place rather than a provably clear one. */
  const groups = new Map();
  marks.forEach((m, i) => {
    const key = `${Math.round(m.x)},${Math.round(m.y)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(i);
  });
  const stack = marks.map(() => -1); /* -1 = this mark shares its pixel with nobody */
  let stackId = 0;
  for (const idx of groups.values()) {
    if (idx.length < 2) continue;
    const id = stackId++;
    idx.forEach((i, n) => {
      stack[i] = id;
      const th = 2 * Math.PI * n / idx.length;
      const r = Math.max(marks[i].w, marks[i].h) * DECLUTTER_LIMIT;
      at[i].x += Math.cos(th) * r;
      at[i].y += Math.sin(th) * r;
    });
  }

  for (let pass = 0; pass < DECLUTTER_PASSES; pass++) {
    let moved = false;
    for (let i = 0; i < marks.length; i++) {
      for (let j = i + 1; j < marks.length; j++) {
        /* Two marks off the same pixel are already as far apart as the cap
           will ever allow them to be, and pushing them further only spends
           the budget unevenly — measured, it turned an exact four-way ring
           into two marks sitting back on each other's centres. They still
           relax against everything OUTSIDE their own stack. */
        if (stack[i] !== -1 && stack[i] === stack[j]) continue;
        const a = at[i], b = at[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        const overX = (marks[i].w + marks[j].w) / 2 + DECLUTTER_GAP - Math.abs(dx);
        const overY = (marks[i].h + marks[j].h) / 2 + DECLUTTER_GAP - Math.abs(dy);
        if (overX <= 0 || overY <= 0) continue; /* already clear of each other */
        moved = true;
        /* Exactly coincident is the common case here, not the rare one — it is
           what two auto-links on one bearing used to produce — and it offers no
           direction to push along. Push along the golden angle instead of along
           an axis: axis-aligned would lay a stack of three out in a LINE, where
           a radial fan spreads them around the point and leaves each one more
           room. Each mark gets its own angle, so the fan is deterministic. */
        if (!dx && !dy) {
          const th = i * 2.39996;
          const need = Math.max(overX, overY) / 2;
          a.x -= Math.cos(th) * need; a.y -= Math.sin(th) * need;
          b.x += Math.cos(th) * need; b.y += Math.sin(th) * need;
          continue;
        }
        /* separate along the axis needing the least movement — pushing apart
           sideways when they are stacked vertically travels much further */
        if (overX < overY) {
          const s = Math.sign(dx || 1) * overX / 2;
          a.x -= s; b.x += s;
        } else {
          const s = Math.sign(dy || 1) * overY / 2;
          a.y -= s; b.y += s;
        }
      }
    }
    if (!moved) break;
  }
  return marks.map((m, i) => {
    let dx = at[i].x - m.x, dy = at[i].y - m.y;
    const cap = Math.max(m.w, m.h) * DECLUTTER_LIMIT;
    const d = Math.hypot(dx, dy);
    if (d > cap) { dx = dx * cap / d; dy = dy * cap / d; }
    return { dx, dy };
  });
}

/* Nudge a direction we already believe in onto the nearest thing the photo
   suggests. Keeps the topology the GPS or the capture order decided, and only
   sharpens the angle — so a photo with nothing to say costs nothing. */
function snapToWay(yaw, ways, tolerance = 90) {
  if (!ways?.length) return yaw;
  let best = null;
  for (const w of ways) {
    const off = Math.abs(wrap180(w - yaw));
    if (off <= tolerance && (best === null || off < best.off)) best = { w, off };
  }
  return best ? best.w : yaw;
}

/* ---------- how far the next photo is turned from this one ----------

   Two photos taken a few metres apart see the same things — the deck line, the
   piers, the parapet, the truck parked on the approach. Slide one column
   profile round against the other and the offset that lines them up IS the
   rotation between the two photos. Circular cross-correlation, no library.

   ponytail: naive O(W²), 65k multiply-adds at W=256, measured at 90-265µs. A
   forty-photo tour's consecutive pairs cost under 10ms — one frame. An FFT
   would be 200 lines to save that, so no FFT until W passes ~1024.

   The hard part is not the shift, it is knowing when not to believe it. Three
   things had to be measured rather than assumed:

   - The raw peak lies. Two unrelated bridge photos still correlate at a median
     0.5, because a smoothed 256-column profile holds only ~36 independent
     samples and there are 256 lags to find a lucky one in. So what is reported
     is the peak's MARGIN over the best rival lag outside its own lobe.
   - A row of identical piers correlates 1.000 at every multiple of the pier
     spacing, and picks an arbitrary one — measured 180° wrong. The margin
     catches this exactly: the rival is also 1.000, so the margin is 0.000.
   - A smooth profile — a photo under a deck soffit, a flat overcast horizon —
     produces ONE broad lobe. Then the lobe walk swallows every lag, there is
     no rival left to beat, and a naive reading hands back full confidence.
     Measured: two unrelated single-bump profiles scored 1.0000 at a 180° error.
     No threshold fixes this, because the statistic stops being monotone in
     evidence; raising the bar to 0.70 still let a third of them through while
     killing the real matches. The fix is a precondition on the INPUT — a
     profile without enough structure to correlate is refused before its
     confidence is looked at — which took the false accepts from 21% to 0.3%
     with no loss of true matches. */

/* Sign changes about the profile's own mean. Six is the fewest that leaves a
   correlation peak anything to compete against. */
const MATCH_MIN_CROSSINGS = 6;
const MATCH_MIN_CONFIDENCE = 0.35;
/* Both bands must land within this of each other. Set just above the error
   parallax alone contributes over a couple of metres of walk — widen it for a
   site where the photos are far apart, narrow it for a tripod survey. */
const MATCH_AGREE_COLUMNS = 6;

function correlateYaw(a, b) {
  const W = a?.length | 0;
  const nothing = { shiftColumns: 0, confidence: 0 };
  if (!W || b?.length !== W) return nothing;

  /* zero-mean, unit-variance. This does NOT change which lag wins — the DC
     term is constant across lags and the scale is positive — but it puts the
     peak in correlation-coefficient units, so one threshold means the same
     thing on a photo shot two stops brighter. */
  const norm = src => {
    let mean = 0;
    for (let i = 0; i < W; i++) mean += src[i];
    mean /= W;
    const out = new Float64Array(W);
    let ss = 0;
    for (let i = 0; i < W; i++) { out[i] = src[i] - mean; ss += out[i] * out[i]; }
    const sd = Math.sqrt(ss / W);
    if (!(sd > 1e-9)) return null;
    for (let i = 0; i < W; i++) out[i] /= sd;
    /* the precondition: too few crossings and this is one broad blob, which
       correlates beautifully with any other broad blob anywhere */
    let crossings = 0;
    for (let i = 0; i < W; i++) if ((out[i] > 0) !== (out[(i + 1) % W] > 0)) crossings++;
    return crossings >= MATCH_MIN_CROSSINGS ? out : null;
  };
  const x = norm(a), y = norm(b);
  if (!x || !y) return nothing;

  const r = new Float64Array(W);
  for (let k = 0; k < W; k++) {
    let s = 0;
    for (let i = 0; i < W; i++) s += x[i] * y[(i + k) % W];
    r[k] = s / W;
  }

  let peak = -2, best = 0;
  for (let k = 0; k < W; k++) if (r[k] > peak) { peak = r[k]; best = k; }

  /* the peak's own shoulder is as wide as the scene's own features, not a
     fixed number, so walk down off it until the correlation stops falling */
  const at = k => r[(k % W + W) % W];
  let lo = 0, hi = 0;
  while (lo < W / 2 && at(best - lo - 1) < at(best - lo)) lo++;
  while (hi < W / 2 && at(best + hi + 1) < at(best + hi)) hi++;
  let rival = -2, rivals = 0;
  for (let k = 0; k < W; k++) {
    const dist = ((k - best) % W + W) % W;
    if (dist > hi && dist < W - lo) { rivals++; if (r[k] > rival) rival = r[k]; }
  }
  /* No rival left, or none of them even positive, both mean the same thing:
     one broad lobe and nothing to compare it against. That is an absence of
     evidence, not a strong result — the distinction this used to get backwards. */
  if (!rivals || rival < 0) return { shiftColumns: best, confidence: 0 };

  /* a feature at column c in `a` sits at column c + shiftColumns in `b` */
  return { shiftColumns: best, confidence: +Math.max(0, peak - rival).toFixed(4) };
}

/* Degrees `to` is rotated relative to `from`, or null when the photos do not
   agree that they are looking at the same place. Both bands, always: one band
   alone false-accepts a fifth of unrelated pairs at this threshold, and making
   wall and floor agree cuts that seventeenfold.

   The whole gate is deliberately timid. Measured over 600 synthetic pairs per
   regime, it answers 14-32% of the time on an ordinary scene and 0-4% on a
   near-flat one — but across every regime tried, 0% of unrelated pairs were
   accepted and 0% of accepted answers were wrong by more than 11°. Refusing is
   free: the caller falls back to the assumption it used before this existed.
   Answering wrongly is not, so the trade is the right way round.

   Never better than ±5° however confident it sounds — the two photos are
   metres apart, so near things swing further than far ones and the profile is
   not a pure rotation. */
function yawBetween(from, to) {
  const a = unpackProfile(from?.prof), b = unpackProfile(to?.prof);
  if (!a || !b || a.W !== b.W) return null;
  /* profiles built at different coverages are not comparable, and the
     wrap-around the correlation assumes is wrong for a partial panorama */
  if ((from.pano?.hFov ?? 360) !== (to.pano?.hFov ?? 360)) return null;
  const w = correlateYaw(a.wall, b.wall);
  const f = correlateYaw(a.floor, b.floor);
  if (w.confidence < MATCH_MIN_CONFIDENCE || f.confidence < MATCH_MIN_CONFIDENCE) return null;
  const d = Math.abs(w.shiftColumns - f.shiftColumns) % a.W;
  if (Math.min(d, a.W - d) > MATCH_AGREE_COLUMNS) return null;
  return {
    degrees: +wrap180(w.shiftColumns * 360 / a.W).toFixed(2),
    confidence: Math.min(w.confidence, f.confidence),
  };
}

/* The bands are luma means, so a byte each loses nothing the correlation can
   see. Two 256-column bands ride in a scene as ~690 characters of base64. */
function packProfile(profile) {
  if (!profile) return null;
  const { W, wall, floor } = profile;
  const bytes = new Uint8Array(W * 2);
  for (let i = 0; i < W; i++) {
    bytes[i] = clamp(Math.round(wall[i]), 0, 255);
    bytes[W + i] = clamp(Math.round(floor[i]), 0, 255);
  }
  return btoa(String.fromCharCode(...bytes));
}

function unpackProfile(packed) {
  if (typeof packed !== 'string' || !packed) return null;
  try {
    const bin = atob(packed);
    const W = bin.length >> 1;
    if (!W || W * 2 !== bin.length) return null;
    const wall = new Float64Array(W), floor = new Float64Array(W);
    for (let i = 0; i < W; i++) { wall[i] = bin.charCodeAt(i); floor[i] = bin.charCodeAt(W + i); }
    return { W, wall, floor };
  } catch { return null; }
}

/* ---------- the defect register ----------

   None of this vocabulary is invented here. The nine types, the quantised
   increments and the phrasing all come from the sibling field-sketch tool,
   android/app/src/main/assets/bridge-sketch.html (DEFECT_LABEL, DEFECT_PAL and
   its measurement fields). Keeping them byte-identical is the entire point: a
   structure's 360 record and its sketch register have to be readable side by
   side, and a tool that said "1/2 inch" where the other said "1/2 in" would
   quietly become a second, disagreeing source of truth.

   Only Spall takes a depth and only Crack / Map cracking take a width, because
   that is all the sketch tool defines. Giving Section loss a measurement the
   other tool does not have would be exactly the drift this is avoiding. */
const DEFECT_TYPES = [
  'Spall', 'Crack', 'Map cracking', 'Patch', 'Section loss',
  'Delamination', 'Efflorescence', 'Exposed reinforcement', 'Pack rust',
];
const DEFECT_MEASURE = { Spall: 'depth', Crack: 'width', 'Map cracking': 'width' };
const DEPTH_STEPS = [[0.25, '1/4 in'], [0.5, '1/2 in'], [1, '1 in'], [2, '2 in'], [3, 'Over 2 in']];
const WIDTH_STEPS = [[0.01, 'Hairline'], [0.0625, '1/16 in'], [0.125, '1/8 in'], [0.25, '1/4 in'], [0.375, 'Over 1/4 in']];

/* The three sentinels are the sketch tool's: 0.01 is "hairline" rather than a
   hundredth of an inch, and 0.375 / 3 are open-ended buckets, not measurements.
   Everything else renders as a real fraction in sixteenths. */
function fmtIn(v) {
  if (!(v > 0)) return '';
  if (v === 0.01) return 'hairline';
  if (v === 0.375) return 'over 1/4 in';
  if (v === 3) return 'over 2 in';
  const sixteenths = Math.round(v * 16);
  if (sixteenths % 16 === 0) return `${sixteenths / 16} in`;
  const gcd = (a, b) => (b ? gcd(b, a % b) : a);
  const rem = sixteenths % 16;
  const d = gcd(rem, 16);
  const whole = Math.floor(sixteenths / 16);
  /* past an inch it is a mixed number — "1 1/2 in", the way the sketch tool
     writes it and an inspector reads it, never an improper "3/2 in" */
  return `${whole ? `${whole} ` : ''}${rem / d}/${16 / d} in`;
}

/* The register's Measure column, and the marker tooltip. */
function defectMeasure(h) {
  const kind = DEFECT_MEASURE[h?.defect] || '';
  const parts = [];
  if (kind === 'depth' && h.depthIn > 0) parts.push(`${fmtIn(h.depthIn)} deep`);
  if (kind === 'width' && h.widthIn > 0) parts.push(`${fmtIn(h.widthIn)} wide`);
  if (h?.rebar) parts.push('reinforcement exposed');
  return parts.join(', ');
}

/* A defect of a type that takes a measurement, with none recorded. Advisory,
   not blocking — a photograph of a spall is still evidence without a depth. */
function defectNeedsMeasure(h) {
  const kind = DEFECT_MEASURE[h?.defect] || '';
  if (!kind) return false;
  return !(kind === 'depth' ? h.depthIn > 0 : h.widthIn > 0);
}

/* Codes run D1, D2, D3 across the WHOLE tour, not per scene: the register is
   one document, and the same spall photographed from two stations must not
   become two defects. Scanning for the highest rather than counting means
   deleting D2 never renumbers D3 out from under a note already written. */
function nextDefectCode(scenes) {
  let max = 0;
  for (const s of scenes || []) {
    for (const h of s.hotspots || []) {
      const m = /^D(\d+)$/.exec(h.code || '');
      if (m) max = Math.max(max, +m[1]);
    }
  }
  return `D${max + 1}`;
}

/* ---------- where the photos were taken from ----------

   This used to draw EXIF GPS and refuse everything else, on the grounds that a
   row of evenly spaced dots which are not where anything is would be a drawing
   of the tool's imagination, and that on a structure where "which pier is
   that" is the question, a confident wrong map is worse than no map.

   That reasoning was right about confidence and wrong about usefulness. A
   guessed layout you can DRAG is not a claim, it is a starting position — and
   an inspector who knows the site can fix forty dots faster than they can
   place them from nothing. So the refusal is now carried by the drawing rather
   than by the absence of one: a guessed dot is hollow and dashed, a GPS dot is
   solid, a dot somebody moved by hand is solid and accented, and the note
   under the plate counts each kind. Nothing here is ever exported as a
   surveyed coordinate.

   Three tiers, most trusted first:
     manual  — s.plan {x,y}, because a human said so
     gps     — EXIF, good to a few metres
     guess   — spread along the structure's own axis in capture order

   Everything is computed in local east/north METRES from the first located
   photo, and only normalised into the box at the end. Keeping one metric space
   is what lets a hand-dragged dot survive a later photo widening the site:
   store box fractions instead and every override silently slides when the
   scale changes. */

/* The long axis of a set of points, by principal component. A bridge walk is a
   line — deck loop out, elevations back — so the axis through the photos IS
   the structure, and it is worth drawing because it turns a scatter of dots
   into something recognisable enough to correct. */
function principalAxis(pts) {
  const n = pts.length;
  let mx = 0, my = 0;
  for (const p of pts) { mx += p.x; my += p.y; }
  mx /= n; my /= n;
  let sxx = 0, syy = 0, sxy = 0;
  for (const p of pts) {
    const dx = p.x - mx, dy = p.y - my;
    sxx += dx * dx; syy += dy * dy; sxy += dx * dy;
  }
  /* degenerate (one point, or every photo on the same fix) falls out as 0,
     i.e. due east — arbitrary, but it is a line the user can drag off */
  const th = 0.5 * Math.atan2(2 * sxy, sxx - syy);
  return { mx, my, dx: Math.cos(th), dy: Math.sin(th) };
}

/* Where several bearings agree something is. Each sighting is a place and a
   true bearing from it; the answer is the point with the least total squared
   distance to all those lines, which is a 2x2 solve and no iteration.

   Two bearings that are nearly parallel cross at a place enormously sensitive
   to a fraction of a degree in either — the classic way a plausible-looking
   triangulation lands in the next county. `det` measures exactly that
   degeneracy, so it is the gate: too small and this returns null rather than a
   number nobody should trust. Normalised by the sighting count so the
   threshold means the same thing for two bearings and for twenty. */
const CROSS_MIN_CONDITION = 0.12;
function triangulate(sightings) {
  if (!sightings || sightings.length < 2) return null;
  let a11 = 0, a12 = 0, a22 = 0, b1 = 0, b2 = 0;
  for (const s of sightings) {
    const th = s.bearing * Math.PI / 180;
    /* the bearing's normal: the residual being minimised is the distance from
       the answer to the line, measured across it */
    const nx = -Math.cos(th), ny = Math.sin(th);
    const c = nx * s.x + ny * s.y;
    a11 += nx * nx; a12 += nx * ny; a22 += ny * ny;
    b1 += nx * c; b2 += ny * c;
  }
  const n = sightings.length;
  const det = (a11 * a22 - a12 * a12) / (n * n);
  if (!(Math.abs(det) >= CROSS_MIN_CONDITION)) return null;
  const d = a11 * a22 - a12 * a12;
  return { x: (a22 * b1 - a12 * b2) / d, y: (a11 * b2 - a12 * b1) / d };
}

function planPositions(scenes) {
  const list = scenes || [];
  if (list.length < 2) return null; /* one dot is not a plan */
  const located = list.filter(s => Number.isFinite(s.geo?.lat) && Number.isFinite(s.geo?.lon));
  const origin = located[0]?.geo || null;

  const placed = new Map();
  for (const s of list) {
    if (Number.isFinite(s.plan?.x) && Number.isFinite(s.plan?.y)) {
      placed.set(s.id, { id: s.id, x: s.plan.x, y: s.plan.y, kind: 'manual' });
    } else if (origin && Number.isFinite(s.geo?.lat) && Number.isFinite(s.geo?.lon)) {
      const d = metresBetween(origin, s.geo);
      const b = bearing(origin, s.geo) * Math.PI / 180;
      placed.set(s.id, { id: s.id, x: d * Math.sin(b), y: d * Math.cos(b), kind: 'gps' });
    }
  }

  /* the structure's axis, from whatever is actually pinned down. Scale is a
     stricter claim: only the distance between two real GPS fixes is a
     measurement. Two hand-dragged dots alone must NOT flip the plan to
     "scaled" — the metres a drag stores are read out of whatever frame it was
     dropped in, which with no fix anywhere is the nominal one below. */
  const anchors = [...placed.values()];
  const scaled = located.length >= 2;
  const axis = anchors.length ? principalAxis(anchors) : { mx: 0, my: 0, dx: 1, dy: 0 };
  const along = p => (p.x - axis.mx) * axis.dx + (p.y - axis.my) * axis.dy;
  const ts = anchors.map(along);
  const NOMINAL_M = 40; /* a plausible short span, so an ungeolocated tour is not drawn as a dot */
  const tMin = scaled ? Math.min(...ts) : -NOMINAL_M / 2;
  const tMax = scaled ? Math.max(...ts) : NOMINAL_M / 2;

  /* Spread the unplaced along that axis in the order they were shot, which is
     the order the inspector walked. Evenly, because the spacing is not known —
     that is exactly the part the dragging is for. */
  const loose = list.filter(s => !placed.has(s.id));
  loose.forEach((s, i) => {
    const t = loose.length === 1
      ? (tMin + tMax) / 2
      : tMin + (tMax - tMin) * i / (loose.length - 1);
    placed.set(s.id, { id: s.id, x: axis.mx + axis.dx * t, y: axis.my + axis.dy * t, kind: 'guess' });
  });

  const pts = list.map(s => placed.get(s.id)).filter(Boolean);
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  /* one-metre floor: every photo standing on the same fix would otherwise
     divide by zero and put every dot at NaN. The 1.18 leaves the outermost
     dots a little clear of the border instead of half-buried in it. */
  const span = Math.max(maxX - minX, maxY - minY, 1) * 1.18;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  /* screen v grows downward; north stays up */
  const toBox = p => ({ u: 0.5 + (p.x - cx) / span, v: 0.5 - (p.y - cy) / span });
  const toMetres = (u, v) => ({ x: cx + (u - 0.5) * span, y: cy - (v - 0.5) * span });

  /* The vehicle, from every photo that both saw it and knows which way it was
     facing. Only ever drawn from a real crossing — with one sighting, or with
     sightings too nearly parallel to cross, there is no position and none is
     shown. Placed AFTER the box is fitted, deliberately: a bad triangulation
     must not be able to rescale the plan and move every photo on it. */
  const byId = new Map(pts.map(p => [p.id, p]));
  const sightings = [];
  for (const s of list) {
    const at = byId.get(s.id);
    if (!at || !Number.isFinite(s.vehicle?.yaw) || !Number.isFinite(s.geo?.heading)) continue;
    sightings.push({ x: at.x, y: at.y, bearing: s.geo.heading + s.vehicle.yaw });
  }
  const fix = triangulate(sightings);
  const inBox = fix && toBox(fix);
  const vehicle = inBox && inBox.u >= 0 && inBox.u <= 1 && inBox.v >= 0 && inBox.v <= 1
    ? { ...inBox, from: sightings.length }
    : null;

  const end = t => toBox({ x: axis.mx + axis.dx * t, y: axis.my + axis.dy * t });
  return {
    pts: pts.map(p => ({ ...p, ...toBox(p) })),
    deck: { from: end(tMin), to: end(tMax) },
    span, scaled, oriented: !!origin, toMetres, vehicle,
  };
}

/* True bearing from one plan position to the next — x east, y north, north up,
   the same frame planPositions works in. */
const planBearing = (from, to) => (Math.atan2(to.x - from.x, to.y - from.y) * 180 / Math.PI + 360) % 360;

/* The tour's links as lines to draw between plotted photos.

   A pair is ONE line however many arrows connect it, because two lines lying on
   top of each other is one line as far as anyone reading the plan can tell. But
   which way it works is worth keeping: a link placed in one direction only is a
   dead end from the far side, and on the plan that is the difference between a
   route and a trap. So `both` says whether it walks in both directions, and
   `from`/`to` orient the arrow along the one direction that does work. */
function planEdges(scenes, pts) {
  const at = new Map((pts || []).map(p => [p.id, p]));
  const edges = new Map();
  for (const s of scenes || []) {
    for (const h of s.hotspots || []) {
      if (h.type !== 'link' || h.target === s.id) continue;
      const here = at.get(s.id), there = at.get(h.target);
      if (!here || !there) continue; /* a link to a deleted scene draws nothing */
      /* one key per unordered pair, so A->B and B->A meet in the same slot */
      const flip = s.id > h.target;
      const key = flip ? `${h.target}␀${s.id}` : `${s.id}␀${h.target}`;
      const e = edges.get(key) || { a: flip ? there : here, b: flip ? here : there, ab: false, ba: false };
      if (flip) e.ba = true; else e.ab = true;
      edges.set(key, e);
    }
  }
  return [...edges.values()].map(e => ({
    a: e.a, b: e.b, both: e.ab && e.ba,
    from: e.ab ? e.a : e.b, to: e.ab ? e.b : e.a,
  }));
}

/* A cell Excel will read back as the text that was typed. Quoting handles
   commas, quotes and newlines; the apostrophe handles the other thing, which is
   that Excel treats a leading =, +, - or @ as a formula no matter how it is
   quoted.
   The minus belongs in that set. An earlier version left it out, reasoning that
   "-2 in" is a measurement somebody meant to write — but the Measure column is
   generated by fmtIn() and can never begin with a minus, while Note, Scene,
   Element and Station are free text and can. That rationale defended the one
   column never at risk and left open the four that were. */
function csvCell(v) {
  let s = String(v ?? '');
  if (/^[=+@\t\r-]/.test(s)) s = `'${s}`;
  return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

/* The defect register: one row per defect across the whole tour, in the same
   columns the field-sketch tool's XLSX uses, plus where the photo was taken
   from. Sorted by code NUMERICALLY, so D10 follows D9 rather than D1. */
function registerCsv(tour) {
  const rows = [['Code', 'Type', 'Measure', 'Scene', 'Photo stop', 'Element', 'Station', 'Note']];
  const found = tourDefects(tour);
  found.sort((a, b) => (parseInt(a.h.code?.slice(1), 10) || 0) - (parseInt(b.h.code?.slice(1), 10) || 0));
  for (const { h, s } of found) {
    rows.push([h.code, h.defect, defectMeasure(h), s.name, s.stop, s.element, s.station, h.note]);
  }
  return rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}

/* Every defect in the tour, with the photo it was marked on. Lives here rather
   than beside the paper deliverables it was written for because the register,
   the photo log, the editor's tally and now the plan all read it, and one
   collection loop is enough for all four. */
function tourDefects(tour) {
  return (tour?.scenes || []).flatMap(s => (s.hotspots || [])
    .filter(h => h.type === 'defect').map(h => ({ h, s })));
}

/* How many defects each photo carries. The register is a flat list with no map
   in it, so this is what puts the findings back on the ground they were found
   on. A photo with none is absent, not a zero — nothing to draw. */
function defectCounts(tour) {
  const out = new Map();
  for (const { s } of tourDefects(tour)) out.set(s.id, (out.get(s.id) || 0) + 1);
  return out;
}

/* A round number of metres to rule the grid and the scale bar at: the 1-2-5
   sequence, the largest that still fits across the plate at least four times.
   A grid at a quarter of an arbitrary span is decoration; a grid at 10 m is a
   measurement, and it is the same pixels either way. */
function niceMetres(span) {
  const raw = (Number.isFinite(span) && span > 0 ? span : 1) / 4;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  return [5, 2, 1].map(m => m * pow).find(v => v <= raw) || pow;
}

/* Which way a photo looks, as a compass bearing: where the shutter pointed,
   turned by however far the tour swings the view on opening — the same sum the
   viewer's compass needle is drawn from, so the plan and the needle can never
   disagree. No recorded heading returns null rather than north: a wedge is a
   claim about which pier this is a shot of, and a guessed one is a wrong one. */
function facingBearing(scene) {
  const h = scene?.geo?.heading;
  if (!Number.isFinite(h)) return null;
  return +((((h + (scene.view?.yaw || 0)) % 360) + 360) % 360).toFixed(2);
}

/* The compass bearing from one plan position to another point on the plate —
   the inverse of the arm each arrow is drawn along, and what turns "the pointer
   is here" into "you are aiming there". Plate coordinates: u right, v DOWN,
   north up, which is why v is subtracted the other way round from planBearing's
   metres. */
const aimFromPoint = (from, at) =>
  (Math.atan2(at.u - from.u, from.v - at.v) * 180 / Math.PI + 360) % 360;

/* The inverse of facingBearing: what to store as a photo's heading so that it
   ends up looking the way somebody just turned its arrow. The camera's bearing
   is where the MIDDLE of the file points, and the arrow shows where the opening
   view points, so the view's own yaw has to come back out.

   One line, but in the fence and tested, because a sign error here is the kind
   nothing catches: every arrow would still point somewhere entirely plausible,
   and every one of them would be wrong by twice the opening yaw. */
const headingForAim = (scene, aim) =>
  +(((((aim - (scene?.view?.yaw || 0)) % 360) + 360) % 360)).toFixed(2);

/* The dart every photo wears on the plan, drawn once and then only ever
   rotated. Its box is four dot-diameters square with the dot at the centre, so
   in this 100-unit viewBox one dot-diameter is 25 units and the centre is 50.

   The tip lands 50 units out — two dot-diameters, the whole point of the
   shape's proportions — and the notched tail stops 18.5 out, comfortably clear
   of the 12.5-unit dot it belongs to. Points north at rotation 0, which is what
   lets a bearing be applied as a plain CSS rotate with no maths at all. */
const AIM_DART = 'M 50 0 L 60.5 22.5 L 50 31.5 L 39.5 22.5 Z';

/* ---------- working out the bearings nobody recorded ----------

   Three things could already give a photo a bearing, and all three depend on
   the camera: GPSImgDirection in the EXIF, PoseHeadingDegrees in a photo
   sphere's XMP, or the sun in the frame plus a fix and a clock. A phone with
   its compass off, an action camera, or any indoor walk gets none of them, and
   until now that tour simply had no bearings at all — no compass in the
   viewer, no real angles on the plan, and every link arrow aimed by guesswork.

   Two more ways exist, and neither needs the camera to have known anything:

     match  Two photos of the same place, taken from a few metres apart, share
            their skyline. correlateYaw already measures how far one is turned
            from the other, to within a column, and yawBetween already refuses
            when the two bands disagree. So a bearing on ONE photo carries to
            every photo that shares a view with it, and onward from there —
            which means aiming a single arrow by hand can bearing a whole walk.
     plan   A link you placed by hand says "the way to B is over there", and
            the plan says where B is. The difference is this photo's bearing.

   Both are proposals: the caller writes them into geo.heading tagged with which
   one produced them, the scene panel says so, and the arrow on the plan turns
   them by hand. Nothing here overwrites a bearing that already exists.

   ponytail: the match pass correlates every pair once — 256-column circular
   correlation, so about n²/2 × 65k operations, a second or so at forty photos.
   That is why it is a button and not something renderPlan does. If it ever
   needs to be cheaper, the profiles are already summarised down to two bands;
   an FFT is the next step, not a smaller n. */

/* How far a bearing may travel from the photo that actually knows one.

   Every hop is a measured turn that already cleared MATCH_MIN_CONFIDENCE, so
   the thing that degrades along a chain is not belief, it is ANGLE: each hop
   is right to within a column or two, and those errors add. Three hops is a
   couple of degrees of accumulated slop, which a plan can carry; twenty hops
   down a viaduct is a number with no relationship to the ground.

   Deliberately a hop count and not a product of confidences. Confidence here
   is a peak-to-rival ratio, not a probability — multiplying two of them says
   nothing about two turns both being right, and in practice it killed every
   chain at the second hop because a legitimate match sits around 0.4. */
const HEADING_MATCH_HOPS = 3;
/* Two links from one photo that cannot agree within this are not evidence of
   anything, and their average would be a number with no source. */
const HEADING_PLAN_SPREAD = 25;

function deriveHeadings(scenes, pts) {
  const list = scenes || [];
  if (list.length < 2) return [];
  const wrap360 = deg => ((deg % 360) + 360) % 360;
  const recorded = list.map(s => Number.isFinite(s.geo?.heading));

  /* ---- pass one: carry a known bearing along shared views ----
     The pair graph is built once and reused, rather than re-correlating on
     every hop of the search. The reverse of a turn is its negative, so only
     half the pairs are ever measured. */
  const turn = new Map(), sure = new Map();
  for (let i = 0; i < list.length; i++) {
    for (let j = i + 1; j < list.length; j++) {
      const t = yawBetween(list[i], list[j]);
      if (!t) continue;
      turn.set(`${i} ${j}`, t.degrees);
      turn.set(`${j} ${i}`, -t.degrees);
      sure.set(`${i} ${j}`, t.confidence);
      sure.set(`${j} ${i}`, t.confidence);
    }
  }

  /* Breadth first, so every photo is reached by the FEWEST turns from a photo
     that already knows — fewest turns is least accumulated angle. Among routes
     of equal length the more confident match wins, which is what the second
     condition below is for. */
  const heading = list.map((s, i) => (recorded[i] ? wrap360(s.geo.heading) : null));
  const hops = list.map((s, i) => (recorded[i] ? 0 : Infinity));
  const routeSure = list.map((s, i) => (recorded[i] ? 1 : 0));
  let frontier = list.map((s, i) => i).filter(i => recorded[i]);
  for (let step = 1; step <= HEADING_MATCH_HOPS && frontier.length; step++) {
    const next = [];
    for (const k of frontier) {
      for (let j = 0; j < list.length; j++) {
        if (recorded[j] || hops[j] < step) continue;
        const c = sure.get(`${k} ${j}`);
        if (c === undefined) continue;
        if (hops[j] === step && c <= routeSure[j]) continue;
        hops[j] = step;
        routeSure[j] = c;
        /* the same world direction sits `turn` degrees further round in j's
           frame than in k's, so j's own frame starts that much earlier */
        heading[j] = wrap360(heading[k] - turn.get(`${k} ${j}`));
        if (!next.includes(j)) next.push(j);
      }
    }
    frontier = next;
  }

  const out = [];
  list.forEach((s, i) => {
    if (recorded[i] || heading[i] === null) return;
    out.push({ id: s.id, heading: +heading[i].toFixed(2), from: 'match', hops: hops[i] });
  });

  /* ---- pass two: what the links and the plan already say ----
     Only where BOTH ends are really placed. A dot laid out by capture order is
     a placeholder for a position, and a bearing measured off it would be an
     invention wearing the clothes of a measurement. */
  const at = new Map((pts || []).map(p => [p.id, p]));
  const real = id => at.get(id)?.kind === 'gps' || at.get(id)?.kind === 'manual';
  const covered = new Set(out.map(o => o.id));
  list.forEach((s, i) => {
    if (recorded[i] || covered.has(s.id) || !real(s.id)) return;
    const from = [];
    for (const h of s.hotspots || []) {
      if (h.type !== 'link' || !h.target || h.target === s.id) continue;
      if (!Number.isFinite(h.yaw) || !real(h.target)) continue;
      from.push(wrap360(planBearing(at.get(s.id), at.get(h.target)) - h.yaw));
    }
    if (!from.length) return;
    /* circular mean, because two links either side of north average to south */
    let sx = 0, sy = 0;
    for (const b of from) { sx += Math.cos(b * Math.PI / 180); sy += Math.sin(b * Math.PI / 180); }
    const mean = wrap360(Math.atan2(sy, sx) * 180 / Math.PI);
    if (from.some(b => Math.abs(wrap180(b - mean)) > HEADING_PLAN_SPREAD)) return;
    out.push({ id: s.id, heading: +mean.toFixed(2), from: 'plan' });
  });

  return out;
}

/* The photos the finished tour cannot reach.

   One definition, because there were two and they disagreed. The pre-share
   check treated the first photo as the front door when no start scene had been
   chosen; the scene list did not, so it printed a red orphan dot on the very
   photo a visitor would land on and a warning about a tour that was fine. The
   check's reading is the right one — something has to be the front door — so
   that is the one that survives. */
function strandedScenes(tour) {
  const scenes = tour?.scenes || [];
  if (!scenes.length) return [];
  const linked = new Set();
  for (const s of scenes) {
    for (const h of s.hotspots || []) if (h.type === 'link' && h.target) linked.add(h.target);
  }
  const startId = tour.settings?.startScene || scenes[0].id;
  return scenes.filter(s => s.id !== startId && !linked.has(s.id)).map(s => s.id);
}

/* --- pure helpers end --- */

/* ---------- how a hotspot looks (no emoji, per house rules) ----------

   Shape, size and transparency live on the hotspot itself, so the editor and
   the viewer read the same three fields and cannot drift apart. All three are
   optional; a hotspot that has never been styled looks exactly as it always
   did.

   'arrow' is special: it means the viewer's own arrow lying flat on the floor,
   which is the right default for a link and is not something drawn here. Every
   other shape is generated below. */

const HOTSPOT_SHAPES = {
  arrow: null,
  circle: '<circle cx="20" cy="20" r="18" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2"/>',
  square: '<rect x="3" y="3" width="34" height="34" rx="8" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2"/>',
  diamond: '<path d="M20 1.5 38.5 20 20 38.5 1.5 20Z" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2"/>',
  ring: '<circle cx="20" cy="20" r="16.5" fill="none" stroke="#F2F2F7" stroke-width="3.5"/>',
  dot: '<circle cx="20" cy="20" r="9" fill="#F2F2F7" stroke="rgba(11,11,14,0.75)" stroke-width="2"/>',
};

const HOTSPOT_GLYPHS = {
  /* points up, not right: an arrow on a hotspot reads as "go this way", and
     the way is forward from where you are standing */
  link: '<path d="M20 27V14m0 0l-4.8 4.8M20 14l4.8 4.8" stroke="#F2F2F7" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
  info: '<rect x="18.5" y="17" width="3" height="12" rx="1.5" fill="#F2F2F7"/><circle cx="20" cy="12" r="2.2" fill="#F2F2F7"/>',
  url: '<path d="M15 25L25 15M25 15h-7M25 15v7" stroke="#F2F2F7" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>',
};

const DEFAULT_SHAPE = { link: 'square', info: 'circle', url: 'circle', defect: 'circle' };
const DEFAULT_SIZE = 40;

/* A defect is not a place you can go, and at a glance across a busy soffit it
   must never be mistaken for one. It keeps the dark badge — that is what stays
   readable over bright concrete and over shadow alike — and adds a red ring
   plus its own register code, the way the mark reads on a field sketch. The
   code on the marker means a reviewer walking the tour can call out "D7"
   without opening anything.

   Fixed hex, not var(--defect): this is painted onto a photograph, and a
   photograph is the same in both themes. */
const DEFECT_INK = '#FF6B5E';
function defectMark(code) {
  const text = String(code || '').slice(0, 4);
  /* 4 characters at 15px overflow a 40px badge; step down once rather than
     clip, so D100 still reads */
  const size = text.length > 3 ? 11 : text.length > 2 ? 13 : 15;
  return `<circle cx="20" cy="20" r="18.6" fill="none" stroke="${DEFECT_INK}" stroke-width="2.4"/>` +
    (text ? `<text x="20" y="${20 + size * 0.36}" text-anchor="middle" fill="${DEFECT_INK}"` +
      ` font-family="ui-monospace,Consolas,monospace" font-size="${size}" font-weight="700">${text}</text>` : '');
}

const hotspotShape = h => {
  const shape = h.shape && HOTSPOT_SHAPES[h.shape] !== undefined ? h.shape : (DEFAULT_SHAPE[h.type] || 'circle');
  /* only a link can wear the floor arrow; anything else falls back to a badge */
  return shape === 'arrow' && h.type !== 'link' ? 'circle' : shape;
};
const hotspotSize = h => clamp(Math.round(h.size || DEFAULT_SIZE), 16, 128);
const hotspotOpacity = h => clamp(h.opacity ?? 1, 0.1, 1);

/* Returns null only for a link left as the floor arrow — the caller then lets
   the viewer draw its own. `dot` is deliberately bare: a glyph inside a 9px
   circle is a smudge.

   Transparency is painted INTO the drawing rather than set on the element,
   because the viewer rewrites the opacity of any two arrows that overlap, on
   every frame, to show which is nearer. An element-level fade would flicker
   away the moment two doorways came within 45 degrees of each other; a fade
   inside the picture survives, and the viewer's own dimming then reads on top
   of it as it was meant to. */
function hotspotIcon(h, forceShape) {
  const shape = forceShape || hotspotShape(h);
  const body = HOTSPOT_SHAPES[shape];
  if (!body) return null;
  const glyph = shape === 'dot' ? ''
    : h.type === 'defect' ? defectMark(h.code)
      : (HOTSPOT_GLYPHS[h.type] || '');
  const fade = hotspotOpacity(h);
  const open = fade < 1 ? `<g opacity="${fade}">` : '';
  return 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">` +
    `${open}${body}${glyph}${open ? '</g>' : ''}</svg>`);
}

/* The viewer's stock arrow paints itself with the element's CSS colour, which
   nothing else touches — so for a link left as an arrow the fade rides in the
   alpha channel. 0.8 is the stock alpha, kept so full opacity still looks
   exactly like an untouched tour. */
const arrowColour = h => `rgba(255,255,255,${(0.8 * hotspotOpacity(h)).toFixed(3)})`;

/* What shows through where a partial panorama has no photo. Black reads as a
   broken viewer; sky above and ground below reads as a photo that simply did
   not reach that far, which is the truth. Kuula solves it the same way and
   for the same reason. Screen-space rather than sphere-space, which is exactly
   right when you tilt up or down and only approximate when you turn behind
   you — still far better than a hole. */
const sceneBackground = scene =>
  scene?.fill ? `linear-gradient(${scene.fill.top}, ${scene.fill.bottom})` : '#000';

/* Standing upright, a link arrow lives in the same visual space as a marker
   and one stored number means the same size on both. This was 2 while arrows
   lay on the floor at 80px against a marker's 40px. */
const ARROW_SCALE = 1;

const SHAPE_NAMES = {
  arrow: 'Arrow on the floor', circle: 'Circle', square: 'Square',
  diamond: 'Diamond', ring: 'Ring', dot: 'Dot',
};

/* shown only in the shape picker: the real one is drawn by the viewer in 3D */
const ARROW_PREVIEW = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">' +
  '<path d="M20 5 34 31H6Z" fill="rgba(11,11,14,0.75)" stroke="#F2F2F7" stroke-width="2.4" stroke-linejoin="round"/></svg>');

const SAFE_URL = u => /^https?:\/\//i.test(u || '');

/* The seven phases of one capture walk, from docs/bridge-capture-paths.html.
   Shown in the editor's empty state because "add a photo" teaches nothing, and
   the order of the walk is the one thing that decides whether the reconstruction
   and the photo record both come out usable. */
const CAPTURE_PHASES = [
  ['Deck loop', 'both curbs, end to end'],
  ['Corner ties', 'four corners, tying the deck to the ground'],
  ['Elevation passes', 'near at ~3 m, then far at 8–12 m'],
  ['Bearing line', 'every beam, every support'],
  ['Underside lattice', 'each span, each bay'],
  ['Channel arcs', 'upstream and downstream'],
  ['Loop closure', 'back to the start, overlapping the opening frames'],
];

/* ---------- what an inspection walk has to photograph ----------

   The eleven stops are the NBIS photo checklist as set out in
   docs/bridge-capture-paths.html, which grounds them in SNBI 2022, BIRM and
   AASHTO MBEI. They are stored as one field per scene rather than a set,
   because a scene either is or is not the bearing-line shot, and one <select>
   is a thousand times lighter than a tag editor.

   What this can and cannot know is worth being blunt about: ticking a stop
   means a photo has been FILED against it, not that the photo shows what it
   claims. The app cannot see a bearing. 360 capture supplements the inspection
   record; it does not replace hands-on NBIS judgement. */
const NBIS_STOPS = [
  'Approach roadway',
  'Deck wearing surface',
  'Expansion joints',
  'Barriers',
  'Full elevations',
  'Fascia and obliques',
  'Wing walls',
  'Bearings',
  'Pier faces',
  'Underside',
  'Channel, up and downstream',
];

/* Suggestions only — the input stays free text, because element naming is a
   local dialect and a closed list would be wrong somewhere on the first day. */
const ELEMENT_SUGGESTIONS = [
  'Deck', 'Wearing surface', 'Approach slab', 'Expansion joint', 'Barrier', 'Sidewalk', 'Curb',
  'Girder', 'Beam line', 'Diaphragm', 'Cross-frame', 'Soffit', 'Fascia', 'Bay',
  'Bearing, elastomeric pad', 'Bearing, rocker', 'Bearing, fixed', 'Bearing, expansion',
  'Beam seat', 'Sole plate', 'Masonry plate', 'Pier cap',
  'Pier, column', 'Pier, wall', 'Pier, hammerhead', 'Pier, pile bent',
  'Abutment, stub', 'Abutment, full-height cantilever', 'Abutment, gravity',
  'Abutment, spill-through', 'Abutment, integral',
  'Wing wall, straight', 'Wing wall, flared', 'Wing wall, U-return', 'Wing wall toe',
  'Footing', 'Pile', 'Slope protection', 'Embankment', 'Channel upstream', 'Channel downstream',
];

const NAV_REGISTER_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/></svg>';
const NAV_PRINT_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 9V3h10v6"/><path d="M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>';
const NAV_PLANET_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="6.5"/><ellipse cx="12" cy="12" rx="10.5" ry="3.6" transform="rotate(-18 12 12)"/></svg>';
const NAV_AUDIO_ON_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';
const NAV_AUDIO_OFF_SVG = '<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="1.8" fill="none"/></svg>';

/* ---------- the two paper deliverables ----------

   Top level, not inside renderEditor, because the artefact an inspector hands
   over is the standalone export — which only ever runs renderViewer. Leaving
   these in the editor meant the zip a bridge owner archives contained neither
   the defect register nor the photo log, while the docs said it did. Both are
   built in the browser from the tour document, so they work with no server.
   tourDefects, which both of them read, moved up into the pure-helper block
   with the rest of the maths once the plan view wanted it as well. */
const slugName = v => (v || '').toLowerCase().replace(/[^a-z0-9]+/g, '-')
  .replace(/^-|-$/g, '').slice(0, 40) || 'tour';

function downloadText(name, mime, text) {
  const url = URL.createObjectURL(new Blob([text], { type: mime }));
  const a = Object.assign(document.createElement('a'), { href: url, download: name });
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 0);
}

function downloadRegister(tour) {
  if (!tourDefects(tour).length) { toast('No defects recorded in this tour'); return; }
  /* The BOM is the difference between Excel reading this as UTF-8 and Excel
     reading it as the local code page and mangling every degree sign. */
  downloadText(`${slugName(tour.inspection?.structureId || tour.name)}-defects.csv`,
    'text/csv;charset=utf-8', '﻿' + registerCsv(tour));
}

/* Browser print-to-PDF, no PDF library. Built on demand and removed again, so
   it can never disagree with the document it came from. */
async function printPhotoLog(tour) {
  const found = tourDefects(tour);
  if (!found.length) { toast('No defects to log in this tour'); return; }
  const i = tour.inspection || {};
  const head = [['Structure', i.structureId], ['Inspected', i.date], ['By', i.by], ['Sheet', i.sheet]]
    .filter(([, v]) => v).map(([k, v]) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('');
  const rows = found
    .sort((a, b) => (parseInt(a.h.code?.slice(1), 10) || 0) - (parseInt(b.h.code?.slice(1), 10) || 0))
    .map(({ h, s }) => {
      const img = h.image || s.thumb || s.file;
      const where = [s.name, s.station && `Station ${s.station}`, s.element].filter(Boolean).join(' · ');
      const measure = defectMeasure(h);
      return `<section class="pl-row">
        <img src="${fileUrl(tour.id, img)}" alt="">
        <div class="pl-body">
          <h2><span class="pl-code">${esc(h.code || '')}</span> ${esc(h.defect || '')}</h2>
          ${measure ? `<p class="pl-measure">${esc(measure)}</p>` : '<p class="pl-measure pl-none">No measurement recorded</p>'}
          ${where ? `<p class="pl-where">${esc(where)}</p>` : ''}
          ${h.note ? `<p class="pl-note">${esc(h.note)}</p>` : ''}
        </div></section>`;
    }).join('');
  document.querySelector('.print-log')?.remove();
  const log = el(`<div class="print-log">
    <header class="pl-head"><h1>${esc(tour.name)}</h1><dl>${head}</dl>
      <p class="pl-sub">Photo log &mdash; ${found.length} defect${found.length > 1 ? 's' : ''}.
      360&deg; capture supplements the inspection record; it does not replace hands-on judgement.</p>
    </header>${rows}</div>`);
  document.body.append(log);
  /* The preferred image is the defect's close-up, which is the ONE image the
     editor never renders and is therefore always cold. A rAF is not an
     image-load wait, so the row a photo log exists for printed as a gap.
     decode() is; the race is a backstop so a broken file cannot hang the
     print dialog forever. */
  await Promise.race([
    Promise.all([...log.querySelectorAll('img')].map(im => im.decode().catch(() => {}))),
    new Promise(r => setTimeout(r, 4000)),
  ]);
  print();
  log.remove();
}

/* ---------- router ---------- */

const viewMatch = location.pathname.match(/^\/tour\/view\/([^/]+)/);
const editId = new URLSearchParams(location.search).get('edit');
if (STATIC_TOUR) {
  renderViewer(STATIC_TOUR.id);
} else if (viewMatch) {
  renderViewer(viewMatch[1]);
} else if (editId) {
  renderEditor(editId);
} else {
  renderHome();
}

/* ---------- home ---------- */

async function renderHome() {
  document.title = 'Orbit Tour';
  app.innerHTML = `
    <div class="home">
      <div class="home-head">
        <h1>Orbit Tour</h1>
        <button class="btn primary" id="new-tour">New tour</button>
      </div>
      <p class="home-sub">Self-hosted 360&deg; virtual tours. Your panoramas never leave this machine.</p>
      <form class="create-row" id="create-row">
        <input class="text-input" id="create-name" placeholder="Tour name" maxlength="80" autocomplete="off">
        <button class="btn primary" type="submit">Create</button>
        <button class="btn" type="button" id="create-cancel">Cancel</button>
      </form>
      <div id="tour-list" class="state-note">Loading tours&hellip;</div>
    </div>`;

  const createRow = document.getElementById('create-row');
  const createName = document.getElementById('create-name');
  document.getElementById('new-tour').addEventListener('click', () => {
    createRow.classList.add('open');
    createName.focus();
  });
  document.getElementById('create-cancel').addEventListener('click', () => {
    createRow.classList.remove('open');
    createName.value = '';
  });
  createName.addEventListener('keydown', e => {
    if (e.key === 'Escape') { createRow.classList.remove('open'); createName.value = ''; }
  });
  createRow.addEventListener('submit', async e => {
    e.preventDefault();
    const submitBtn = createRow.querySelector('[type=submit]');
    if (submitBtn.disabled) return;
    submitBtn.disabled = true;
    try {
      const tour = await api('POST', '/api/tours', { name: createName.value.trim() || 'untitled tour' });
      location.href = `/tour?edit=${tour.id}`;
    } catch (err) {
      toast(`Could not create tour: ${err.message}`, true);
      submitBtn.disabled = false;
    }
  });

  const list = document.getElementById('tour-list');
  let tours;
  try {
    ({ tours } = await api('GET', '/api/tours'));
  } catch (err) {
    list.className = 'state-note error';
    list.textContent = `Could not load tours: ${err.message}. Is server.py running?`;
    return;
  }

  list.className = 'tour-grid';
  list.innerHTML = '';
  if (!tours.length) {
    list.append(el(`<div class="empty-card">
      <h2>No tours yet</h2>
      <p>A tour is one structure walked as a set of 360&deg; photos, linked so a
      reviewer can step through it, with defects marked where they are.</p>
      <p class="ec-next">Start with <strong>New tour</strong>, then drop in the
      photos from the walk. A 2:1 equirectangular export from the Insta360 app is
      the ideal case; a phone panorama or an ordinary photo works too.</p>
    </div>`));
    return;
  }
  for (const t of tours) {
    const scenes = (t.scenes || []).length;
    const first = (t.scenes || [])[0];
    const cover = first
      ? `<img class="cover" src="${fileUrl(t.id, first.thumb || first.file)}" alt="" loading="lazy">`
      : '';
    const card = el(`
      <div class="tour-card">
        ${cover}
        <h2>${esc(t.name)}</h2>
        <div class="meta"><span class="num">${scenes}</span> scene${scenes === 1 ? '' : 's'} &middot; updated ${fmtDate(t.updated)}</div>
        <div class="row">
          <button class="btn primary" data-act="open">Open</button>
          <button class="btn" data-act="edit">Edit</button>
          <button class="btn" data-act="duplicate" title="Copy this tour and its photos">Duplicate</button>
          <button class="btn danger-text" data-act="delete">Delete</button>
        </div>
      </div>`);
    card.querySelector('[data-act=open]').addEventListener('click', () => location.href = `/tour/view/${t.id}`);
    card.querySelector('[data-act=edit]').addEventListener('click', () => location.href = `/tour?edit=${t.id}`);
    const dupBtn = card.querySelector('[data-act=duplicate]');
    dupBtn.addEventListener('click', async () => {
      dupBtn.disabled = true;
      try {
        const copy = await api('POST', `/api/tours/${t.id}/duplicate`);
        toast(`Created "${copy.name}"`);
        renderHome();
      } catch (err) {
        toast(`Duplicate failed: ${err.message}`, true);
        dupBtn.disabled = false;
      }
    });

    const delBtn = card.querySelector('[data-act=delete]');
    let armTimer = null;
    delBtn.addEventListener('click', async () => {
      if (!delBtn.classList.contains('danger-solid')) {
        /* two-step confirm: first click arms, second within 4s deletes */
        delBtn.classList.replace('danger-text', 'danger-solid');
        delBtn.textContent = 'Confirm delete?';
        armTimer = setTimeout(() => {
          delBtn.classList.replace('danger-solid', 'danger-text');
          delBtn.textContent = 'Delete';
        }, 4000);
        return;
      }
      clearTimeout(armTimer);
      try {
        await api('DELETE', `/api/tours/${t.id}`);
        card.remove();
        toast(`Deleted "${t.name}"`);
        if (!list.querySelector('.tour-card')) renderHome();
      } catch (err) {
        toast(`Delete failed: ${err.message}`, true);
        delBtn.classList.replace('danger-solid', 'danger-text');
        delBtn.textContent = 'Delete';
      }
    });
    list.append(card);
  }
}

/* ---------- viewer ---------- */

function sceneToNode(tour, scene) {
  const hotspots = scene.hotspots || [];
  return {
    id: scene.id,
    panorama: fileUrl(tour.id, scene.file),
    panoData: panoDataFor(scene),
    thumbnail: fileUrl(tour.id, scene.thumb || scene.file),
    name: esc(scene.name), /* gallery + arrow tooltips inject this via innerHTML */
    caption: `${esc(tour.name)} &mdash; ${esc(scene.name)}`,
    links: hotspots
      .filter(h => h.type === 'link' && tour.scenes.some(s => s.id === h.target)) /* dangling links must not brick the tour */
      .map(h => {
        /* a custom uploaded icon wins, then a chosen shape, then nothing at all
           — which leaves the viewer to draw its own arrow on the floor */
        const image = h.icon ? fileUrl(tour.id, h.icon) : hotspotIcon(h);
        const px = hotspotSize(h) * ARROW_SCALE;
        return {
          nodeId: h.target,
          position: { yaw: h.yaw * DEG, pitch: h.pitch * DEG },
          ...(h.label ? { name: esc(h.label) } : {}),
          arrowStyle: {
            ...(image ? { image } : {}),
            size: { width: px, height: px },
            /* a shape we drew already carries its fade; the stock arrow takes
               it through colour; only an uploaded icon has nowhere else to put
               it and must risk the viewer's own overlap dimming */
            style: h.icon ? { opacity: String(hotspotOpacity(h)) }
              : image ? {} : { color: arrowColour(h) },
          },
        };
      }),
    markers: hotspots.filter(h => h.type === 'info' || h.type === 'url' || h.type === 'defect').map(h => {
      const px = hotspotSize(h);
      const common = {
        id: h.id,
        position: { yaw: h.yaw * DEG, pitch: h.pitch * DEG },
        image: h.icon ? fileUrl(tour.id, h.icon) : hotspotIcon(h),
        size: { width: px, height: px },
        opacity: h.icon ? hotspotOpacity(h) : 1, /* a drawn shape is already faded */
      };
      if (h.type === 'url') {
        return {
          ...common,
          tooltip: esc(h.label || h.url || 'Open link'),
          data: SAFE_URL(h.url) ? { url: h.url } : {},
        };
      }
      /* The panel is assembled from the same three groups either way —
         evidence, identity, provenance — so an info hotspot and a defect read
         as one component with different contents rather than as two designs. */
      const shot = (file, alt) => file
        ? `<img class="hs-shot" src="${fileUrl(tour.id, file)}" alt="${esc(alt)}" loading="lazy">`
        : '';
      const where = items => {
        const kept = items.filter(Boolean);
        return kept.length ? `<ul class="hs-where">${kept.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
      };

      if (h.type === 'defect') {
        const measure = defectMeasure(h);
        return {
          ...common,
          tooltip: esc([h.code, h.defect, measure].filter(Boolean).join(' · ')),
          content: `<div class="hs">
            ${shot(h.image, `${h.defect || 'Defect'}${h.code ? ` at ${h.code}` : ''}`)}
            <h2 class="hs-title">${h.code ? `<span class="hs-code">${esc(h.code)}</span>` : ''}${esc(h.defect || 'Defect')}</h2>
            ${measure ? `<p class="hs-measure">${esc(measure)}</p>` : ''}
            ${h.note ? `<p class="hs-note">${esc(h.note)}</p>` : ''}
            ${where([scene.station && `Station ${scene.station}`, scene.element, scene.name])}
          </div>`,
        };
      }
      const body = [
        shot(h.image, h.title || ''),
        h.title ? `<h2 class="hs-title">${esc(h.title)}</h2>` : '',
        h.text ? `<p class="hs-note">${esc(h.text)}</p>` : '',
        h.audio ? `<audio class="hs-audio" controls src="${fileUrl(tour.id, h.audio)}"></audio>` : '',
      ].filter(Boolean);
      return {
        ...common,
        tooltip: esc(h.title || 'Info'),
        /* a title on its own is already in the tooltip; opening a panel to
           repeat one line of text is a click that gives nothing back */
        ...(body.length > (h.title ? 1 : 0) ? { content: `<div class="hs">${body.join('')}</div>` } : {}),
      };
    }),
  };
}

/* ---------- keeping every hotspot clickable ----------

   Two hotspots close together in the sphere are one hotspot as far as anybody
   pressing them is concerned, and the one underneath cannot be reached at all.
   Automatic arrows now step aside as they are created (see freeYaw), but that
   cannot help the cases that matter most: two defects genuinely three degrees
   apart on the same spall, a tour built before that fix existed, or any pair
   that only collides once you zoom out.

   So the marks are separated where they are DRAWN rather than where they are
   stored. The record keeps the exact angle somebody clicked — the register,
   the CSV and the photo log all read the stored yaw and pitch and are
   untouched by any of this. Only the pixels move, and never by more than the
   mark's own radius, so a mark always still covers the point it marks.

   PSV positions markers with the CSS `translate` property and scales them with
   `scale`, leaving `transform` free; that is what this writes, so the two
   never fight over the same declaration. */

function wireDeclutter(viewer, plugin, isBusy = () => false) {
  let nudged = [];
  const relax = () => {
    const marks = [];
    for (const m of Object.values(plugin.markers || {})) {
      const p = m.state?.position2D;
      const w = m.state?.size?.width, h = m.state?.size?.height;
      if (!m.state?.visible || !p || !m.domElement || !w || !h) continue;
      marks.push({ el: m.domElement, w, h, x: p.x + w / 2, y: p.y + h / 2 });
    }
    const offsets = separateMarks(marks);
    const next = [];
    for (let i = 0; i < marks.length; i++) {
      const { dx, dy } = offsets[i];
      const css = (dx || dy) ? `translate(${dx.toFixed(1)}px, ${dy.toFixed(1)}px)` : '';
      /* this runs on every frame of a pan; only touch the DOM when it changed */
      if (marks[i].el.style.transform !== css) marks[i].el.style.transform = css;
      if (css) next.push(marks[i].el);
    }
    /* a mark that stopped colliding has to be let back to its own place */
    for (const el of nudged) if (!next.includes(el) && el.style.transform) el.style.transform = '';
    nudged = next;
  };

  viewer.addEventListener('render', () => {
    /* while a hotspot is being dragged its position is the pointer's, and
       nudging it would mean wrestling the user for the mark they are holding */
    if (!isBusy()) relax();
  });
}

async function renderViewer(tourId) {
  const embed = new URLSearchParams(location.search).has('embed');
  app.innerHTML = `<div class="center-note"><div class="spin"></div><div class="sub">Loading tour&hellip;</div></div>`;

  let tour;
  try {
    const res = STATIC_TOUR ? null : await fetch(`/api/tours/${tourId}`);
    if (res && res.status === 404) {
      app.innerHTML = `<div class="center-note">
        <div class="big">Tour not found</div>
        <div class="sub">It may have been deleted.</div>
        <a href="/tour">Back to your tours</a></div>`;
      return;
    }
    if (res && !res.ok) throw new Error(`server replied ${res.status}`);
    tour = STATIC_TOUR || await res.json();
  } catch (err) {
    app.innerHTML = `<div class="center-note">
      <div class="big">Could not load this tour</div>
      <div class="sub">${esc(err.message)}. Is server.py running?</div>
      <button class="btn" id="retry-btn">Try again</button></div>`;
    document.getElementById('retry-btn').addEventListener('click', () => location.reload());
    return;
  }
  document.title = `${tour.name} — Orbit Tour`;

  /* handle_tour_save only checks that scenes is a list, so a hand-edited doc
     can put anything inside it. A shapeless entry used to make the viewer
     throw before it drew anything — a blank page with no way out. Keep only
     real scenes, the way export_manifest already does; links to anything
     dropped self-heal in sceneToNode's dangling-link filter. */
  tour.scenes = (tour.scenes || []).filter(s =>
    s && typeof s === 'object' && s.id && typeof s.id === 'string' && s.file && typeof s.file === 'string');

  if (!(tour.scenes || []).length) {
    app.innerHTML = `<div class="center-note">
      <div class="big">${esc(tour.name)}</div>
      <div class="sub">This tour has no scenes yet.${STATIC_TOUR ? '' : ' Open the editor and add 360&deg; photos.'}</div>
      ${STATIC_TOUR ? '' : `<a href="/tour?edit=${esc(tour.id)}">Open editor</a>`}</div>`;
    return;
  }

  const settings = tour.settings || {};
  app.innerHTML = `<div class="stage"><div id="psv"></div></div>`;
  const stage = app.firstElementChild;

  if (!embed) {
    stage.append(el(`<div class="tour-title">${esc(tour.name)}</div>`));
  }
  if (settings.logo) {
    const img = `<img src="${fileUrl(tour.id, settings.logo)}" alt="${esc(tour.name)}">`;
    stage.append(el(settings.logoLink
      ? `<a class="tour-logo" href="${esc(settings.logoLink)}" target="_blank" rel="noopener">${img}</a>`
      : `<div class="tour-logo">${img}</div>`));
  }

  /* background audio (starts on first gesture — browsers block autoplay) */
  let audioEl = null;
  let audioWanted = Boolean(settings.audio);
  if (settings.audio) {
    audioEl = new Audio(fileUrl(tour.id, settings.audio));
    audioEl.loop = true;
    const startOnce = () => { if (audioWanted) audioEl.play().catch(() => {}); };
    stage.addEventListener('pointerdown', startOnce, { once: true });
  }

  const nodes = tour.scenes.map(s => sceneToNode(tour, s));
  /* A link to one exact scene, so "look at the bearing at 2+12" can be sent as
     a URL instead of "open the tour and walk to the third arrow". The fragment
     wins over the tour's own start scene when it names a real one; an id from a
     different tour simply loses. (Scene ids survive both export and duplicate
     byte-for-byte — handle_tour_export inlines the document verbatim — so a
     deep link shared from the editor keeps working inside the exported site.) */
  const linkedScene = sceneIdFromHash();
  const startNodeId = tour.scenes.some(s => s.id === linkedScene)
    ? linkedScene
    : tour.scenes.some(s => s.id === settings.startScene)
      ? settings.startScene
      : tour.scenes[0].id;

  /* reduced motion: no planet intro, no self-starting rotation — manual controls stay.
     A partial panorama has no nadir to look down into, so the planet intro would
     unfold onto empty sphere — skip it there whatever the setting says. */
  const startScene = tour.scenes.find(s => s.id === startNodeId);
  const littlePlanet = settings.littlePlanetIntro !== false && !REDUCED_MOTION && !isPartial(startScene);
  const autorotate = settings.autorotate === true && !REDUCED_MOTION;

  const navbar = [
    'autorotate',
    'zoom',
    {
      id: 'planet',
      title: 'Little planet',
      content: NAV_PLANET_SVG,
      onClick(viewer) {
        planetOn = !planetOn;
        viewer.setOption('fisheye', planetOn ? 2 : false);
      },
    },
  ];
  if (audioEl) {
    navbar.push({
      id: 'audio',
      title: 'Sound',
      content: NAV_AUDIO_ON_SVG,
      onClick(viewer) {
        audioWanted = !audioWanted;
        if (audioWanted) audioEl.play().catch(() => {}); else audioEl.pause();
        /* .content is getter-only on AbstractButton — write the DOM directly */
        viewer.navbar.getButton('audio').container.innerHTML = audioWanted ? NAV_AUDIO_ON_SVG : NAV_AUDIO_OFF_SVG;
      },
    });
  }
  /* The register and the photo log belong to whoever is HOLDING the record,
     which for a standalone export is a reviewer in the viewer, not the
     inspector in the editor. Shown only when the tour actually carries
     defects, so an ordinary 360 tour is unchanged. */
  if (tourDefects(tour).length) {
    navbar.push({
      id: 'register', title: 'Download the defect register (CSV)', content: NAV_REGISTER_SVG,
      onClick: () => downloadRegister(tour),
    }, {
      id: 'photolog', title: 'Print the photo log', content: NAV_PRINT_SVG,
      onClick: () => printPhotoLog(tour),
    });
  }
  navbar.push('gallery', 'caption', 'gyroscope', 'stereo', 'fullscreen');

  let planetOn = littlePlanet;

  const viewer = new Viewer({
    container: document.getElementById('psv'),
    loadingTxt: 'Loading panorama&hellip;',
    touchmoveTwoFingers: embed,
    mousewheelCtrlKey: embed,
    keyboard: embed ? 'fullscreen' : 'always',
    fisheye: littlePlanet ? 2 : false,
    canvasBackground: sceneBackground(startScene),
    defaultYaw: ((tour.scenes.find(s => s.id === startNodeId)?.view?.yaw) || 0) * DEG,
    defaultPitch: littlePlanet ? -90 * DEG : ((tour.scenes.find(s => s.id === startNodeId)?.view?.pitch) || 0) * DEG,
    navbar,
    plugins: [
      MarkersPlugin,
      [AutorotatePlugin, autorotate
        ? { autostartDelay: 4000, autorotateSpeed: `${settings.autorotateSpeed || 0.7}rpm`, autostartOnIdle: true }
        : { autostartDelay: null, autostartOnIdle: false, autorotateSpeed: '0.7rpm' }],
      [GalleryPlugin, { visibleOnLoad: false, thumbnailSize: { width: 120, height: 60 } }],
      GyroscopePlugin,
      StereoPlugin,
      [VirtualTourPlugin, {
        positionMode: 'manual',
        /* '3d' lays each arrow flat on the ground, which reads as a sticker
           stuck to the path and skews with the floor. '2d' stands them up
           facing the viewer, the way Street View does, so an arrow saying
           "forward" actually points up the screen. */
        renderMode: '2d',
        preload: true,
        /* rotation: the camera swinging round to face the link before the
           crossfade, which lands as a spin. Off — you walk forward, you do
           not pirouette. */
        transitionOptions: { effect: REDUCED_MOTION ? 'none' : 'fade', rotation: false, speed: '20rpm', showLoader: true },
        nodes,
        startNodeId,
      }],
    ],
  });

  const virtualTour = viewer.getPlugin(VirtualTourPlugin);
  window.orbitTour = { viewer, virtualTour, tour }; // debug/editor handle

  /* a missing or unreadable panorama file should say so, not sit blank */
  viewer.addEventListener('panorama-error', () => {
    stage.querySelector('.load-error')?.remove();
    /* on a first-load failure the node never lands, so fall back to the start scene */
    let nodeId;
    try { nodeId = virtualTour.getCurrentNode()?.id; } catch { nodeId = null; }
    const scene = tour.scenes.find(s => s.id === (nodeId || startNodeId));
    stage.append(el(`<div class="load-error" role="alert">
      Could not load the photo for &ldquo;${esc(scene?.name || 'this scene')}&rdquo;.
    </div>`));
  });
  virtualTour.addEventListener('node-changed', () => stage.querySelector('.load-error')?.remove());

  /* URL hotspots open in a new tab */
  viewer.getPlugin(MarkersPlugin).addEventListener('select-marker', ({ marker }) => {
    if (SAFE_URL(marker.data?.url)) open(marker.data.url, '_blank', 'noopener');
  });
  wireDeclutter(viewer, viewer.getPlugin(MarkersPlugin));

  /* ----- which way am I facing -----
     Only when at least one photo recorded a compass heading, because a compass
     that is guessing is worse than no compass. GPSImgDirection is already
     parsed at upload; this just adds the live viewer yaw to it.
